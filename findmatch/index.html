<style>
/* Layout: one phone-tall table. Opponent's card on top, the shared card in the middle, your card at the bottom. Round tins on a sunburst. Deliberately one bright look. */
:root{
  --bg:#ff7a2f; --bg2:#ff9e3d; --ink:#2b1300; --card:#fffaf0; --rim:#2b1300; --you:#2d6cff; --them:#e8336d; --ok:#14b86b; --bad:#ff3b3b; --gold:#ffd23f;
  --display:'Lilita One', 'Arial Black', sans-serif; --body:'Nunito', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:repeating-conic-gradient(from 0deg at 50% 50%,var(--bg) 0 10deg,var(--bg2) 10deg 20deg)}
#app{height:100%;max-width:520px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto 1fr auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;gap:4px}
button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:14px;padding:.55em 1em;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.wm{white-space:nowrap;font-family:var(--display);font-size:24px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);letter-spacing:.02em}
header .grow{flex:1}
header a,header .hb{color:var(--ink);text-decoration:none;font-weight:900;font-size:13px;background:rgba(255,255,255,.7);border-radius:999px;padding:6px 12px}
header .rg-btn{background:rgba(255,255,255,.7);color:var(--ink);border-color:transparent}
.seat{display:grid;grid-template-columns:1fr;place-items:center;position:relative;min-height:0}
.seat.top{transform:rotate(180deg)}
.seat.top.cpu{transform:none}
.tag{position:absolute;left:4px;top:4px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 12px 4px 4px;font-weight:900;z-index:3}
.tag i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.tag b{font-family:var(--display);font-size:22px;font-weight:400;min-width:1.6em;text-align:right}
.pips{display:flex;gap:3px}.pips u{width:8px;height:8px;border-radius:50%;background:rgba(43,19,0,.18);text-decoration:none}.pips u.on{background:var(--c)}
.card{position:relative;aspect-ratio:1;height:min(100%,86vw,330px);max-width:100%;border-radius:50%;background:var(--card);border:6px solid var(--rim);box-shadow:0 8px 0 rgba(43,19,0,.35),inset 0 0 0 6px #fff;transition:transform .25s}
.card.mid{height:auto;width:min(46vw,26vh,240px);border-width:5px}
.card.deal{animation:deal .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes deal{from{transform:scale(.4) rotate(-90deg);opacity:0}}
.card.frozen{filter:grayscale(.8) brightness(.9)}
.sym{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);transform:translate(-50%,-50%) rotate(var(--r));background:none;border:0;padding:0;border-radius:50%;cursor:pointer}
.sym img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.sym:active{transform:translate(-50%,-50%) rotate(var(--r)) scale(.9)}
.sym.right{animation:right .6s ease}
@keyframes right{30%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.35)}}
.sym.right::after,.sym.found::after{content:"";position:absolute;inset:-8%;border-radius:50%;box-shadow:0 0 0 4px var(--ok),0 0 18px var(--ok)}
.sym.wrong{animation:wrong .35s}
@keyframes wrong{25%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(-6px)}75%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(6px)}}
.sym.hinted::after{content:"";position:absolute;inset:-8%;border-radius:50%;box-shadow:0 0 0 4px var(--gold),0 0 22px var(--gold);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.midrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.flash{font-family:var(--display);font-size:22px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);text-align:center;min-height:1.2em}
.midrow .flash.b{transform:rotate(180deg)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.75);font-size:13px;padding:.45em .8em}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.hintb{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.hintb:disabled{opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(43,19,0,.55);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--card);border:5px solid var(--ink);border-radius:26px;padding:22px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center;box-sizing:border-box;box-shadow:0 10px 0 rgba(43,19,0,.4)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0}
.sheet p{margin:0}
.sheet .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.go{background:var(--you);color:#fff;box-shadow:0 4px 0 var(--ink);font-size:18px}
.alt{background:#fff;border:3px solid var(--ink)}
.opts{display:grid;gap:8px}.opts .controls{gap:6px}
.lbl{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
@media (prefers-reduced-motion:reduce){.card.deal,.sym.right,.sym.wrong,.sym.hinted::after{animation:none}}
</style>

<div id="app">
  <header><div class="wm">Find Match</div><div class="grow"></div><span id="snd"></span><button class="hb" id="menuBtn">Menu</button><a href="../index.html">All games</a></header>

<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){
      const o=ac.createOscillator();wave(o,type);const d=stack>1?(k/(stack-1)-.5)*2*det:det;o.detune.value=d;
      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}
      o.connect(n);o.start(t);o.stop(end+.05);into.push(o)}
    const v=vol/Math.sqrt(stack);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,end);
    out=panTo(g,pan);out.connect(bus);sends(g,{echo,rev});
  }
  function noise(bus,{t,dur=.1,vol=.2,a=.002,hp=null,bp=null,bp2=null,lp=null,lp2=null,q=1,pan=0,echo=0,rev=0}){
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=noiseBuf;let n=s;
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;n.connect(fl);n=fl}
    if(bp){const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(bp,t);if(bp2)fl.frequency.exponentialRampToValueAtTime(bp2,t+dur);n.connect(fl);n=fl}
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,t+dur);n.connect(fl);n=fl}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(g);panTo(g,pan).connect(bus);sends(g,{echo,rev});s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---------- sound effects: a clean sci-fi palette (same names the games already call) ---------- */
  const B=()=>sfxBus,V=(o)=>voice(sfxBus,o),Nz=(o)=>noise(sfxBus,o);
  const FX={
    click:t=>{V({f:2600,f2:1800,t,dur:.014,type:'sine',vol:.09,r:.02});Nz({t,dur:.012,vol:.04,hp:7000})},
    tap:t=>V({f:880,f2:1500,t,dur:.035,type:'triangle',vol:.11,r:.04,echo:.12}),
    ui:t=>V({f:1200,f2:1700,t,dur:.03,type:'sine',vol:.08,r:.04}),
    tab:t=>{V({f:1500,t,dur:.02,type:'sine',vol:.07,r:.03});V({f:2250,t:t+.03,dur:.02,type:'sine',vol:.05,r:.04})},
    open:t=>{V({f:500,f2:1400,t,dur:.12,type:'sine',vol:.09,r:.06,echo:.15});Nz({t,dur:.14,vol:.035,bp:1500,bp2:6000,q:2})},
    close:t=>{V({f:1400,f2:500,t,dur:.1,type:'sine',vol:.08,r:.06});Nz({t,dur:.1,vol:.03,bp:5000,bp2:1200,q:2})},
    flip:t=>{Nz({t,dur:.07,vol:.12,bp:1600,bp2:7000,q:1.4});V({f:1600,f2:2400,t,dur:.03,type:'sine',vol:.06,r:.03})},
    deal:t=>{Nz({t,dur:.06,vol:.14,bp:3500,bp2:8000,q:1.6,pan:(Math.random()-.5)*.6});V({f:3200,t:t+.01,dur:.01,type:'sine',vol:.04,r:.03})},
    place:t=>{V({f:190,f2:70,t,dur:.07,type:'sine',vol:.3});V({f:3000,t,dur:.008,type:'square',vol:.04,r:.02,lp:5000})},
    shuffle:t=>{for(let i=0;i<7;i++)V({f:hz(84+[0,3,7,10,12,15,19][i]),t:t+i*.032,dur:.02,type:'sine',vol:.06,r:.03,pan:i%2?.4:-.4})},
    good:t=>{V({f:hz(79),t,dur:.06,type:'sine',vol:.14,r:.12,fm:.6,fmr:2,echo:.2});V({f:hz(86),t:t+.07,dur:.1,type:'sine',vol:.14,r:.25,fm:.6,fmr:2,echo:.25})},
    bad:t=>V({f:260,f2:110,t,dur:.24,type:'sawtooth',vol:.11,stack:2,det:18,lp:1400,lp2:300,q:6}),
    miss:t=>V({f:260,f2:110,t,dur:.22,type:'sawtooth',vol:.1,stack:2,det:18,lp:1400,lp2:300,q:6}),
    error:t=>{V({f:210,t,dur:.07,type:'square',vol:.07,lp:1500});V({f:175,t:t+.09,dur:.11,type:'square',vol:.07,lp:1200})},
    pop:t=>V({f:1500,f2:420,t,dur:.06,type:'sine',vol:.2,fm:1.2,fmr:1.5,r:.05}),
    merge:t=>{V({f:300,f2:960,t,dur:.1,type:'sine',vol:.18,fm:.8,fmr:2,r:.08,echo:.15});Nz({t:t+.04,dur:.08,vol:.03,hp:6000})},
    slide:t=>Nz({t,dur:.11,vol:.07,a:.03,bp:700,bp2:2600,q:1.2}),
    tick:t=>V({f:4200,t,dur:.006,type:'sine',vol:.06,r:.012}),
    reveal:t=>V({f:hz(86+[0,2,4,7,9][Math.random()*5|0]),t,dur:.02,type:'sine',vol:.055,r:.05,pan:(Math.random()-.5)*.8}),
    hint:t=>[88,91,95,100].forEach((m,i)=>V({f:hz(m),t:t+i*.055,dur:.05,type:'sine',vol:.07,r:.3,fm:.3,fmr:3,echo:.35,rev:.2})),

RG.init({game:'findmatch',accent:'#2d6cff'});
document.getElementById('snd').appendChild(RG.button());
const NAMES=['apple','banana','grapes','watermelon','strawberry','cherries','carrot','sweetcorn','mushroom','cactus','sunflower','rose','four-leaf clover','rainbow','star','moon','sun','lightning','fire','water drop','snowflake','balloon','present','guitar','drum','trumpet','paint palette','football','basketball','tennis ball','dice','jigsaw piece','key','padlock','light bulb','alarm clock','camera','telephone','pencil','scissors','pin','car','rocket','aeroplane','anchor','house','dog','cat','mouse','fox','bear','panda','frog','monkey','chicken','penguin','turtle'];
const $=s=>document.querySelector(s);
/* a deck where any two cards share exactly one symbol: lines of the projective plane of order 7 */
function makeDeck(){const n=7,cards=[];
  for(let m=0;m<n;m++)for(let b=0;b<n;b++){const c=[];for(let x=0;x<n;x++)c.push(x*n+((m*x+b)%n));c.push(49+m);cards.push(c)}
  for(let x=0;x<n;x++){const c=[];for(let y=0;y<n;y++)c.push(x*n+y);c.push(56);cards.push(c)}
  cards.push([49,50,51,52,53,54,55,56]);return cards}
const DECK=makeDeck();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ld=(k,d)=>{try{const v=localStorage.getItem('fm.'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('fm.'+k,JSON.stringify(v))}catch(e){}};
let cfg=ld('cfg',{mode:'cpu',level:'normal',target:10});
const SPOT={easy:[5200,8500],normal:[3000,5200],hard:[1500,2800]};
let G=null,cpuT=null,ov='menu';
const TARGETS=[5,10,15];

function layout(card){ // one symbol in the middle, seven around it, random sizes and turns
  const order=shuffle(card.slice()),pos=[];const a0=Math.random()*Math.PI*2;
  order.forEach((s,i)=>{let x=50,y=50,sz=27+Math.random()*7;
    if(i>0){const a=a0+(i-1)*(Math.PI*2/7)+(Math.random()-.5)*.25,r=33+Math.random()*3;x=50+Math.cos(a)*r;y=50+Math.sin(a)*r;sz=19+Math.random()*9}
    pos.push({s,x,y,sz,r:Math.floor(Math.random()*360)})});
  return pos}
function newGame(){
  clearTimeout(cpuT);
  const d=shuffle(DECK.map((c,i)=>i));
  G={pile:d,mid:null,A:null,B:null,score:[0,0],frozen:[0,0],lock:false,hints:3,round:0};
  G.mid=G.pile.pop();G.A=G.pile.pop();G.B=G.pile.pop();
  renderAll(true);nextRound();
}
const shared=(a,b)=>DECK[a].find(s=>DECK[b].includes(s));
function nextRound(){
  G.lock=false;G.round++;G.hintOn=null;$('#flashA').textContent='';$('#flashB').textContent='';
  if(cfg.mode==='cpu'){const [lo,hi]=SPOT[cfg.level];clearTimeout(cpuT);cpuT=setTimeout(()=>score(1,null),lo+Math.random()*(hi-lo))}
}
function cardHTML(id,who){
  const L=layout(DECK[id]);
  return L.map(p=>`<button class="sym" data-s="${p.s}" data-who="${who}" style="--x:${p.x}%;--y:${p.y}%;--s:${p.sz}%;--r:${p.r}deg" aria-label="${NAMES[p.s]}"><img src="${SYMS[p.s][1]}" alt="" draggable="false"></button>`).join('')}
function seatHTML(p){
  const n=cfg.mode==='cpu'?(p===0?'You':'Computer'):(p===0?'Player 1':'Player 2'),col=p===0?'var(--you)':'var(--them)';
  const pips=Array.from({length:cfg.target},(_,i)=>`<u class="${i<G.score[p]?'on':''}"></u>`).join('');
  return `<div class="tag" style="--c:${col}"><i style="background:${col}">${p===0?'1':'2'}</i><div><div style="font-size:13px">${n}</div><div class="pips">${pips}</div></div><b>${G.score[p]}</b></div><div class="card deal" id="card${p}"></div>`}
function renderAll(all){
  $('#seatA').innerHTML=seatHTML(0);$('#seatB').innerHTML=seatHTML(1);
  $('#seatB').classList.toggle('cpu',cfg.mode==='cpu');
  $('#card0').innerHTML=cardHTML(G.A,0);$('#card1').innerHTML=cardHTML(G.B,1);
  if(all||true){$('#mid').innerHTML=cardHTML(G.mid,'mid');$('#mid').classList.remove('deal');void $('#mid').offsetWidth;$('#mid').classList.add('deal')}
  $('#hint').textContent=`Hint (${G.hints})`;$('#hint').disabled=!G.hints||cfg.mode!=='cpu';
  $('#hint').hidden=cfg.mode!=='cpu';
}
function tap(el){
  if(!G||G.lock||ov)return;
  const who=el.dataset.who,s=+el.dataset.s;
  let p;if(who==='mid'){if(cfg.mode!=='cpu')return;p=0}else p=+who;
  if(cfg.mode==='cpu'&&p===1)return;
  if(Date.now()<G.frozen[p]){RG.sfx('error');return}
  const own=p===0?G.A:G.B,ans=shared(own,G.mid);
  if(s===ans)score(p,el);
  else{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');RG.sfx('bad');RG.buzz(40);
    G.frozen[p]=Date.now()+1300;const c=$('#card'+p);c.classList.add('frozen');setTimeout(()=>c.classList.remove('frozen'),1300);
    flash(p,'Wrong! Frozen…')}
}
function flash(p,t){(p===0?$('#flashA'):$('#flashB')).textContent=t}
function score(p,el){
  if(G.lock)return;G.lock=true;clearTimeout(cpuT);
  const own=p===0?G.A:G.B,ans=shared(own,G.mid);
  document.querySelectorAll(`#card${p} .sym[data-s="${ans}"],#mid .sym[data-s="${ans}"]`).forEach(e=>e.classList.add('right'));
  G.score[p]++;RG.sfx(cfg.mode==='cpu'&&p===1?'bad':'good');RG.buzz(15);
  flash(p,cfg.mode==='cpu'?(p===0?'Got it!':''):'Point!');if(cfg.mode==='cpu'&&p===1)flash(0,`Computer found the ${NAMES[ans]}`);
  setTimeout(()=>{
    if(G.score[p]>=cfg.target){RG.sfx(cfg.mode==='cpu'&&p===1?'lose':'fanfare');const b=ld('best',{});if(cfg.mode==='cpu'&&p===0){b[cfg.level]=(b[cfg.level]||0)+1;sv('best',b)}ov={win:p};overlay();return}
    // the winner's card becomes the new shared card, as in the pub game; they get a fresh card
    if(!G.pile.length)G.pile=shuffle(DECK.map((c,i)=>i).filter(i=>![G.A,G.B,G.mid].includes(i)));
    if(p===0){G.mid=G.A;G.A=G.pile.pop()}else{G.mid=G.B;G.B=G.pile.pop()}
    renderAll();nextRound()},850);
}
function hint(){if(!G||G.lock||!G.hints||cfg.mode!=='cpu')return;G.hints--;const ans=shared(G.A,G.mid);document.querySelectorAll(`#card0 .sym[data-s="${ans}"]`).forEach(e=>e.classList.add('hinted'));RG.sfx('hint');$('#hint').textContent=`Hint (${G.hints})`;$('#hint').disabled=!G.hints}
function overlay(){
  let h='';
  if(ov==='menu'){
    const seg=(k,l)=>`<div class="controls">${l.map(([v,t])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${String(cfg[k])===String(v)}">${t}</button>`).join('')}</div>`;
    h=`<div class="overlay"><div class="sheet"><h2>Find Match</h2><p>Every card shares exactly <b>one</b> picture with the card in the middle. Spot it on your card and tap it before your opponent does. Wrong taps freeze you for a second.</p>
      <div class="opts"><span class="lbl">Play</span>${seg('mode',[['cpu','Vs computer'],['two','Two players, one phone']])}
      ${cfg.mode==='cpu'?`<span class="lbl">Computer</span>${seg('level',[['easy','Easy'],['normal','Normal'],['hard','Hard']])}`:'<p style="font-size:13px">Sit opposite each other with the phone flat on the table. Each player taps only their own card.</p>'}
      <span class="lbl">First to</span>${seg('target',TARGETS.map(t=>[t,String(t)]))}</div>
      <div class="row"><button class="go" data-a="start">Deal</button></div></div></div>`}
  else if(ov&&ov.win!=null){const p=ov.win,n=cfg.mode==='cpu'?(p===0?'You win!':'Computer wins'):`Player ${p+1} wins!`;
    h=`<div class="overlay"><div class="sheet"><h2>${n}</h2><p style="font-family:var(--display);font-size:34px">${G.score[0]} – ${G.score[1]}</p><div class="row"><button class="go" data-a="start">Play again</button><button class="alt" data-a="menu">Menu</button></div></div></div>`}
  $('#ov').innerHTML=h;
}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.sym');if(el){e.preventDefault();tap(el)}});
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');if(k){cfg[k.dataset.k]=k.dataset.k==='target'?+k.dataset.v:k.dataset.v;sv('cfg',cfg);RG.sfx('click');overlay();return}
  const a=e.target.closest('[data-a]');if(a){const x=a.dataset.a;if(x==='start'){ov=null;overlay();RG.sfx('shuffle');newGame()}if(x==='menu'){ov='menu';overlay()}}
});
$('#menuBtn').onclick=()=>{clearTimeout(cpuT);ov='menu';overlay()};
$('#hint').onclick=hint;
overlay();
</script>

/* Back to all games: sits at the start of the game's header; floats top-left on screens without one */
(function(){
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
