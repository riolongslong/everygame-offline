<!doctype html><html lang="en-GB" data-game="wildtrumps"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082621"><meta name="color-scheme" content="dark"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EveryGame"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}input,textarea{-webkit-user-select:text;user-select:text}body{background:#082621}</style></head><body>
<title>Wild Trumps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a felt card table. Pack shelf first; then two seats facing each other (top/bottom on phones, left/right on wide screens) with the clash zone between them. One deliberate dark look. */
:root{
  --felt:#0f3a33; --felt-2:#082621; --felt-line:#1f5a4f;
  --paper:#fffaf0; --ink:#1d1a14; --muted:#6b6352;
  --gold:#ffcf3f; --gold-ink:#2a1e00;
  --win:#36c06c; --lose:#e2533a;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
:root{color-scheme:dark}
body{background:var(--felt-2);color:#f2efe6;font-family:var(--body);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{position:relative;height:100%;background:radial-gradient(120% 90% at 50% 45%,var(--felt) 0%,var(--felt-2) 75%)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

/* ---------- pack shelf ---------- */
.shelf{position:absolute;inset:0;overflow-y:auto;padding-inline:16px;padding-block:24px 40px}
.shelf-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,68px);line-height:.9;margin:0;color:var(--gold);letter-spacing:1px;text-shadow:0 3px 0 #7a4b00,0 8px 22px rgba(0,0,0,.45)}
.brand p{margin:0;color:#b9cec7;font-size:15px;max-width:46ch;line-height:1.45}
.controls{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:7px}
.lab{font-family:var(--data);text-transform:uppercase;letter-spacing:1.4px;font-size:13px;color:#93b3a9}
.seg{display:flex;background:rgba(0,0,0,.28);border:1px solid var(--felt-line);border-radius:999px;padding:3px}
.seg button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:#cfe0da}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.names{display:flex;gap:8px}
.names input{width:130px;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--felt-line);color:#fff;border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px 26px;padding-top:14px}
.pack{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;perspective:900px}
.pk{position:relative;width:200px;height:270px;max-width:100%;transform-style:preserve-3d;transform:rotateY(-14deg) rotateX(4deg);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pack:hover .pk,.pack:focus-visible .pk{transform:rotateY(-4deg) rotateX(2deg) translateY(-8px)}
.pk .f,.tbox .f{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:var(--c1);box-shadow:inset 0 0 0 5px var(--c1),inset 0 0 0 7px rgba(255,255,255,.35),0 26px 40px rgba(0,0,0,.5)}
.pk .f img,.tbox .f img{position:absolute;inset:7px 7px 70px;width:calc(100% - 14px);height:auto;max-width:none;object-fit:cover;border-radius:5px;aspect-ratio:186/193}
.pk .t,.tbox .t{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;gap:2px}
.pk .t b,.tbox .t b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.pk .t span,.tbox .t span{font-family:var(--data);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;color:rgba(255,255,255,.88)}
.pk .s{position:absolute;top:0;left:100%;width:26px;height:100%;background:var(--c2);transform-origin:left;transform:rotateY(90deg);border-radius:0 6px 6px 0}
.pk .tag,.tbox .tag{position:absolute;top:14px;left:14px;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:14px;padding:3px 8px;border-radius:4px;transform:rotate(-6deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pack .desc{font-size:14px;color:#b9cec7;max-width:28ch;line-height:1.4}

/* ---------- table ---------- */
.table{position:absolute;inset:0}
.layer{position:absolute;inset:0;overflow:hidden}
.badge{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;background:rgba(0,0,0,.35);border:1px solid var(--felt-line);border-radius:999px;transform:translate(-50%,-50%);white-space:nowrap;transition:box-shadow .3s,border-color .3s;z-index:2}
.badge.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,207,63,.25),0 0 24px rgba(255,207,63,.25)}
.stack{position:relative;width:26px;height:34px}
.stack i{position:absolute;inset:0;border-radius:4px;background:var(--c1);border:2px solid #fff}
.stack i:nth-child(1){transform:translate(-3px,3px) rotate(-8deg);opacity:.6}
.stack i:nth-child(2){transform:translate(-1px,1px) rotate(-3deg);opacity:.85}
.badge .nm{font-weight:700;font-size:14px;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.badge .ct{font-family:var(--display);font-size:22px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.badge .tn{font-family:var(--data);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.banner{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:60;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s;width:max-content;max-width:calc(100% - 32px)}
.banner.on{opacity:1}
.banner .bx{display:inline-block;background:rgba(8,20,17,.88);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner .big{font-family:var(--display);font-size:clamp(20px,4.5vw,30px);line-height:1.1;color:var(--gold)}
.banner .sm{font-family:var(--data);font-size:16px;color:#e6efe9;letter-spacing:.3px}
.hud{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;z-index:70}
.hud button{background:rgba(0,0,0,.4);border:1px solid var(--felt-line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.potc{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--data);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);z-index:3;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px}

/* the box on the table */
.tbox{position:absolute;left:0;top:0;width:200px;height:270px;transform-style:preserve-3d;perspective:700px;z-index:40}
.tbox .lid{position:absolute;left:-4px;right:-4px;top:-4px;height:62px;background:var(--c2);border-radius:10px 10px 4px 4px;transform-origin:50% 0;transition:transform .55s cubic-bezier(.3,1.4,.5,1);box-shadow:0 6px 12px rgba(0,0,0,.35);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;letter-spacing:1px;backface-visibility:hidden}
.tbox.open .lid{transform:rotateX(118deg)}
.tbox .glow{position:absolute;left:10px;right:10px;top:0;height:10px;border-radius:50%;background:var(--gold);filter:blur(10px);opacity:0;transition:opacity .4s}
.tbox.open .glow{opacity:.9}

/* ---------- cards ---------- */
.c{position:absolute;left:0;top:0;width:260px;height:400px;transform-origin:50% 50%;will-change:transform;perspective:1200px}
.c .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
.c.down .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(160deg,var(--c2),var(--c1) 55%);padding:8px;display:flex;flex-direction:column;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.front .panel{flex:1;min-height:0;background:var(--paper);border-radius:9px;display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.hd{display:flex;align-items:center;gap:6px;padding:5px 8px 4px;background:var(--c1);height:40px;flex:none}
.hd .nm{flex:1;min-width:0;font-family:var(--display);font-size:27px;line-height:1;color:#fff;white-space:nowrap;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 1px #000}
.hd .no{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:13px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.pic{position:relative;height:142px;flex:none;background:#000}
.pic img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.trump{position:absolute;left:6px;bottom:6px;background:var(--lose);color:#fff;font-family:var(--display);font-size:11px;letter-spacing:.5px;padding:3px 7px;border-radius:4px;transform:rotate(-5deg);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.strip{flex:none;background:var(--gold);color:var(--gold-ink);font-family:var(--data);font-weight:600;font-size:11.5px;padding:3px 8px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.strip b{font-weight:700}
.file{flex:1;min-height:0;font-size:10.5px;line-height:1.3;padding:5px 9px 3px;color:#3b352a;overflow:hidden}
.file b{font-family:var(--data);font-weight:700;color:var(--c1);letter-spacing:.6px;margin-right:3px;text-transform:uppercase}
.stats{flex:none;display:flex;flex-direction:column;padding:0 4px 4px}
.row{display:flex;align-items:baseline;gap:4px;padding:2px 6px;border-radius:5px;font-family:var(--data);font-size:15px;line-height:16.5px;color:var(--ink);text-align:left;width:100%;cursor:default}
.row .k{font-weight:700;color:var(--c1)}
.row i{flex:1;border-bottom:2px dotted rgba(0,0,0,.28);transform:translateY(-4px);min-width:8px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.row .v small{font-weight:500;color:var(--muted);font-size:11px;margin-left:1px}
.row .lo{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-left:2px}
.c.live .row{cursor:pointer}
.c.live .row:hover{background:rgba(255,207,63,.35)}
.c.live .stats{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px rgba(255,207,63,.7)}}
.row.sel{background:var(--gold)}
.row.hinted{background:rgba(255,207,63,.5);box-shadow:inset 0 0 0 2px var(--gold)}
#hintBtn{background:rgba(0,0,0,.55)!important;border-color:var(--gold)!important;}
.hud.hintwrap{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
#hintBtn{color:var(--gold);border-style:dashed!important}
.c.won .row.sel{background:#bff0d0}
.c.lost .row.sel{background:#f8cdc4}
.c.won .front{box-shadow:0 0 0 4px var(--win),0 0 40px rgba(54,192,108,.6)}
.c.lost .front{filter:saturate(.6) brightness(.9)}
.back{transform:rotateY(180deg);background:var(--c1);border:8px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.45);display:grid;place-items:center;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 18px),radial-gradient(circle at 50% 50%,var(--c2),var(--c1) 70%)}
.back .em{width:150px;height:150px;border-radius:50%;background:var(--gold);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:34px;line-height:.95;color:var(--gold-ink);box-shadow:0 0 0 6px #fff,0 8px 20px rgba(0,0,0,.35);transform:rotate(-8deg)}
.mini{position:absolute;left:0;top:0;width:260px;height:400px;border-radius:16px;background:var(--c1);border:8px solid #fff;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 18px);box-shadow:0 6px 14px rgba(0,0,0,.4);transform-origin:50% 50%}

/* ---------- overlay ---------- */
.over{position:absolute;inset:0;z-index:90;background:rgba(4,16,13,.82);display:grid;place-items:center;padding:16px;text-align:center}
.over .in{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:380px}
.over h2{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--gold)}
.over p{margin:0;color:#cfe0da;line-height:1.5}
.btn{background:var(--gold);color:var(--gold-ink);font-weight:700;padding:12px 22px;border-radius:12px;font-size:16px}
.btn.alt{background:transparent;color:#fff;border:1px solid var(--felt-line)}
.over .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.c .inner,.tbox .lid,.pk{transition-duration:.01s!important}.c.live .stats{animation:none}}

.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;display:inline-block;cursor:pointer}
.lobby{display:flex;flex-direction:column;gap:8px;max-width:640px}
.lg{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.28);border:1px solid var(--felt-line);border-radius:12px;padding:10px 12px;font-size:14px}
.lg .acts,.ph .acts{display:flex;gap:6px}
.note{margin:0;color:#b9cec7;font-size:14px;line-height:1.45}
.note.err{color:#ffb4a4}
.packhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:32px}
.pic .sz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.photos{position:absolute;inset:0;overflow-y:auto;padding-inline:16px;padding-block:24px 40px;background:var(--felt-2);z-index:95}
.phtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phtop h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:34px;margin:0}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ph{background:rgba(0,0,0,.28);border:1px solid var(--felt-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:26/15;object-fit:cover;display:block}
.ph .phb{padding:8px 10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.share{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;background:rgba(8,20,17,.9);border:1px solid rgba(255,207,63,.45);border-radius:16px;padding:16px;z-index:45;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.linkrow{display:flex;gap:8px;width:100%}
.linkrow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--felt-line);color:#fff;border-radius:9px;padding:9px 10px;font:inherit;font-size:13px}
.share .code{font-family:var(--data);font-size:15px;letter-spacing:1px;color:#cfe0da}
.share .code b{font-family:var(--display);color:var(--gold);font-size:22px;letter-spacing:3px;margin-left:4px}
.lg.inv{border-color:var(--gold);background:rgba(255,207,63,.1)}
.codeform{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:420px}
.pic img.bg{animation:kb 16s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translateY(-2%)}}
.pic .emo{position:absolute;left:50%;bottom:8px;font-size:92px;line-height:1;transform:translateX(-50%);filter:drop-shadow(0 10px 10px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,255,255,.18));animation:bob 3.4s ease-in-out infinite;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-2deg)}50%{transform:translateX(-50%) translateY(-7px) rotate(2deg)}}
.pic .flag{position:absolute;top:6px;right:8px;font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.c.down .pic img.bg,.c.down .pic .emo{animation-play-state:paused}
.photobar{display:grid;gap:10px;margin-top:8px;padding:14px 16px;border:1px solid var(--felt-line);border-radius:14px;background:rgba(0,0,0,.22)}.photobar b{display:block;color:var(--gold);margin-bottom:2px}.photobar span{font-size:13px;opacity:.85}.photobar .pbtns{display:flex;gap:8px;flex-wrap:wrap}.photobar .ghost{background:transparent;color:inherit;border:1px solid var(--felt-line)}.photobar .pbar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.photobar .pbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.pic.photo .emo{display:none}.pic.photo img.bg{animation-duration:24s}.pic .cr{position:absolute;right:6px;bottom:4px;font-size:9px;letter-spacing:.04em;color:#fff;opacity:.75;text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none}
@media (prefers-reduced-motion:reduce){.pic img.bg,.pic .emo{animation:none}}
</style>

<div class="app" id="app">
  <section class="shelf" id="shelf">
    <div class="shelf-in">
      <div class="brand">
        <h1>Wild Trumps</h1>
        <p>Choose a pack, pick your best stat, and win your opponent's card. Take the whole deck to win.</p><a href="../index.html" style="color:var(--gold);font-weight:700;text-decoration:none;border:1px solid var(--felt-line);border-radius:999px;padding:6px 14px">All games</a>
      </div>
      <div class="controls">
        <div class="ctl"><span class="lab">Play against</span>
          <div class="seg" id="modeSeg"><button id="m-cpu" data-v="cpu" aria-pressed="true">Computer</button><button id="m-friend" data-v="friend" aria-pressed="false">Same device</button><button id="m-online" data-v="online" aria-pressed="false">Online</button></div></div>
        <div class="ctl" id="diffCtl"><span class="lab">Computer</span>
          <div class="seg" id="diffSeg"><button id="d-easy" data-v="easy" aria-pressed="false">Easy</button><button id="d-normal" data-v="normal" aria-pressed="true">Normal</button><button id="d-hard" data-v="hard" aria-pressed="false">Hard</button></div></div>
        <div class="ctl"><span class="lab">Names</span>
          <div class="names"><input id="n1" value="You" maxlength="14" aria-label="Your name" placeholder="Your name"><span id="n2wrap"><input id="n2" value="Computer" maxlength="14" aria-label="Opponent name"></span></div></div>
      </div>
      <section class="lobby" id="lobby" hidden><span class="lab">Online games</span><div id="lobbyList"></div>
        <form class="codeform" id="codeForm"><label class="lab" for="codeIn">Got a game code from a friend?</label><div class="linkrow"><input id="codeIn" maxlength="12" autocomplete="off" placeholder="e.g. Y6342" style="text-transform:uppercase"><button class="btn sm" id="codeGo">Join game</button></div></form></section>
      <div class="packhead"><span class="lab" id="packHint"></span></div>
      <div class="packs" id="packs"></div>
      <div class="photobar" id="photoBar"><div><b>Card photos</b><span id="photoMsg">Real photos load from Wikipedia when you're online. Save them all once to play offline with photos.</span></div>
        <div class="pbtns"><button class="btn sm" id="photoSave">Save photos for offline</button><button class="btn sm ghost" id="photoExport">Export photo pack</button></div>
        <div class="pbar" hidden><i id="photoProg"></i></div></div>
    </div>
  </section>

  <section class="table" id="table" hidden>
    <div class="layer" id="layer"></div>
    <div class="hud"><button id="quitBtn">Packs</button></div><div class="hud hintwrap"><button id="hintBtn" hidden>Hint</button></div>
  </section>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="photos.js"></script><script>
/* ---------- Rooms without Claude: peer-to-peer, host keeps the table ----------
   The player who creates a room becomes its host. Everyone else connects straight to
   the host's device (PeerJS). The host holds every room document and sends each change
   to all players. The object below offers the same small set of calls the games already
   use (doc().get/set/onSnapshot/acquire, collection().onSnapshot), so game code is unchanged. */
const NET=(()=>{
  const GAME=(document.documentElement.dataset.game||'game');
  const PREFIX='riosgames-'+GAME+'-';
  const store=new Map(),subs=new Set(),leases=new Map(),pending=new Map();
  let role=null,peer=null,conns=[],hostConn=null,reqId=0,onLost=null;
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const snap=(p,d)=>({id:p.split('/').pop(),exists:d!==undefined,data:()=>clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
  function deliver(s){
    if(s.coll){const depth=s.path.split('/').length+1;
      const docs=[...store].filter(([p])=>p.startsWith(s.path+'/')&&p.split('/').length===depth).map(([p,d])=>snap(p,d));
      s.fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>[]})}
    else s.fn(snap(s.path,store.get(s.path)));
  }
  const fire=()=>{for(const s of [...subs])try{deliver(s)}catch(e){console.error(e)}};
  function put(path,data){if(data==null)store.delete(path);else store.set(path,clone(data))}
  function broadcast(m){for(const c of conns)try{c.open&&c.send(m)}catch(e){}}
  function hostPut(path,data){leases.delete(path);put(path,data);broadcast({t:'put',path,data});fire()}
  function lease(path,holder,ttl){const now=Date.now(),l=leases.get(path);
    if(l&&l.until>now&&l.holder!==holder)return{acquired:false};
    leases.set(path,{holder,until:now+Math.max(1000,Math.min(ttl||4000,10000))});return{acquired:true}}
  function hostHear(conn,m){
    if(!m||typeof m!=='object')return;
    if(m.t==='put'&&typeof m.path==='string'&&m.path.startsWith('games/'))hostPut(m.path,m.data);
    else if(m.t==='acq')conn.send({t:'ack',id:m.id,res:lease(m.path,m.holder,m.ttl)});
  }
  function guestHear(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='sync'){store.clear();for(const[p,d] of m.entries)put(p,d);fire();const j=pending.get('join');if(j){pending.delete('join');j.resolve()}}
    else if(m.t==='put'){put(m.path,m.data);fire()}
    else if(m.t==='ack'){const r=pending.get(m.id);if(r){pending.delete(m.id);r.resolve(m.res)}}
  }
  function request(m){return new Promise((resolve,reject)=>{const id=++reqId;pending.set(id,{resolve});
    try{hostConn.send({...m,id})}catch(e){pending.delete(id);reject({code:'unavailable'})}
    setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject({code:'unavailable'})}},6000)})}
  const PeerImpl=()=>/[?&]loopback\b/.test(location.search)?LoopPeer:window.Peer;
  const opts={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  function close(){for(const c of conns)try{c.close()}catch(e){}conns=[];try{hostConn&&hostConn.close()}catch(e){}hostConn=null;
    try{peer&&peer.destroy()}catch(e){}peer=null;role=null;store.clear();leases.clear();fire()}
  function host(randCode){
    close();const P=PeerImpl();if(!P)return Promise.reject({code:'offline'});
    return new Promise((resolve,reject)=>{let tries=0;
      const attempt=()=>{const code=randCode();const p=peer=new P(PREFIX+code,opts);let done=false;
        p.on('open',()=>{done=true;role='host';resolve(code)});
        p.on('error',e=>{if(done)return;try{p.destroy()}catch(_){}
          if(e&&e.type==='unavailable-id'&&++tries<6)attempt();else reject({code:'offline'})});
        p.on('connection',c=>{conns.push(c);
          c.on('open',()=>c.send({t:'sync',entries:[...store]}));
          c.on('data',m=>hostHear(c,m));
          c.on('close',()=>{conns=conns.filter(x=>x!==c)})});
        p.on('disconnected',()=>{if(role==='host')setTimeout(()=>{try{p.reconnect()}catch(_){}},1500)});
        setTimeout(()=>{if(!done){try{p.destroy()}catch(_){}reject({code:'offline'})}},15000)};
      attempt()});
  }
  function join(code){
    close();const P=PeerImpl();if(!P)return Promise.reject({code:'offline'});
    return new Promise((resolve,reject)=>{
      const p=peer=new P(undefined,opts);let ok=false;
      const fail=c=>{if(ok)return;pending.delete('join');close();reject({code:c})};
      pending.set('join',{resolve:()=>{ok=true;resolve()}});
      p.on('open',()=>{const c=hostConn=p.connect(PREFIX+code,{reliable:true});
        c.on('data',guestHear);
        c.on('close',()=>{if(ok&&role==='guest'){role=null;onLost&&onLost()}});
        c.on('error',()=>fail('notfound'))});
      p.on('error',e=>fail(e&&e.type==='peer-unavailable'?'notfound':'offline'));
      role='guest';
      setTimeout(()=>fail('notfound'),12000)});
  }
  const db={
    doc(path){return{id:path.split('/').pop(),path,
      get:async()=>snap(path,store.get(path)),
      set:async d=>{if(role==='guest'){put(path,d);fire();hostConn.send({t:'put',path,data:d})}else hostPut(path,d)},
      delete:async()=>{if(role==='guest'){put(path,null);fire();hostConn.send({t:'put',path,data:null})}else hostPut(path,null)},
      acquire:async({holder,ttlMs})=>role==='guest'?request({t:'acq',path,holder,ttl:ttlMs}):lease(path,holder,ttlMs),
      onSnapshot(fn){const s={path,fn,coll:false};subs.add(s);setTimeout(()=>subs.has(s)&&deliver(s));return()=>subs.delete(s)}}},
    collection(path){return{path,onSnapshot(fn){const s={path,fn,coll:true};subs.add(s);setTimeout(()=>subs.has(s)&&deliver(s));return()=>subs.delete(s)}}}
  };
  return{db,host,join,close,onLost:f=>onLost=f,get role(){return role}};
})();

/* Same-browser stand-in for PeerJS, used only for testing (?loopback in the address). */
class LoopPeer{
  constructor(id){this.id=id||'anon-'+Math.random().toString(36).slice(2,9);this.h={};this.bc=new BroadcastChannel('loopnet');
    this.bc.onmessage=e=>{const m=e.data;
      if(m.k==='claim'&&m.id===this.id&&m.from!==this.uid)this.bc.postMessage({k:'taken',id:this.id,to:m.from});
      if(m.k==='taken'&&m.to===this.uid){this.dead=true;this.emit('error',{type:'unavailable-id'})}
      if(m.k==='open'&&m.to===this.id){const c=new LoopConn(this,m.from,m.cid);this.emit('connection',c);setTimeout(()=>{this.bc.postMessage({k:'ok',to:m.from,cid:m.cid});c.ready()},10)}
      if(m.k==='ok'&&m.to===this.id){const c=this.out[m.cid];c&&c.ready()}
      if(m.k==='msg'&&m.to===this.id){const c=this.all[m.cid];c&&c.emit('data',m.data)}
      if(m.k==='nohost'&&m.to===this.id)this.emit('error',{type:'peer-unavailable'})};
    this.uid=Math.random().toString(36);this.out={};this.all={};
    this.bc.postMessage({k:'claim',id:this.id,from:this.uid});
    setTimeout(()=>{if(!this.dead)this.emit('open',this.id)},120);
    this.probe=new BroadcastChannel('loopnet-probe');this.probe.onmessage=e=>{if(e.data.ask===this.id)this.probe.postMessage({yes:this.id,to:e.data.from})};
  }
  on(k,f){(this.h[k]=this.h[k]||[]).push(f)}
  emit(k,v){(this.h[k]||[]).forEach(f=>f(v))}
  connect(to){const cid=Math.random().toString(36).slice(2);const c=new LoopConn(this,to,cid);this.out[cid]=c;
    const pr=new BroadcastChannel('loopnet-probe');let seen=false;pr.onmessage=e=>{if(e.data.yes===to&&e.data.to===this.id)seen=true};
    pr.postMessage({ask:to,from:this.id});setTimeout(()=>{pr.close();if(!seen)this.emit('error',{type:'peer-unavailable'});else this.bc.postMessage({k:'open',to,from:this.id,cid})},150);
    return c}
  destroy(){this.dead=true;try{this.bc.close();this.probe.close()}catch(e){}}
  reconnect(){}
}
class LoopConn{
  constructor(p,to,cid){this.p=p;this.to=to;this.cid=cid;this.h={};this.open=false;p.all[cid]=this}
  ready(){this.open=true;this.emit('open')}
  on(k,f){(this.h[k]=this.h[k]||[]).push(f)}
  emit(k,v){(this.h[k]||[]).forEach(f=>f(v))}
  send(data){this.p.bc.postMessage({k:'msg',to:this.to,cid:this.cid,data:JSON.parse(JSON.stringify(data))})}
  close(){this.open=false}
}

/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}

    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;

  }
  const pulse={};
  function wave(o,type){

      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}

  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){

    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}

      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}

    shuffle:t=>{for(let i=0;i<7;i++)V({f:hz(84+[0,3,7,10,12,15,19][i]),t:t+i*.032,dur:.02,type:'sine',vol:.06,r:.03,pan:i%2?.4:-.4})},
    good:t=>{V({f:hz(79),t,dur:.06,type:'sine',vol:.14,r:.12,fm:.6,fmr:2,echo:.2});V({f:hz(86),t:t+.07,dur:.1,type:'sine',vol:.14,r:.25,fm:.6,fmr:2,echo:.25})},
    bad:t=>V({f:260,f2:110,t,dur:.24,type:'sawtooth',vol:.11,stack:2,det:18,lp:1400,lp2:300,q:6}),
    miss:t=>V({f:260,f2:110,t,dur:.22,type:'sawtooth',vol:.1,stack:2,det:18,lp:1400,lp2:300,q:6}),
    error:t=>{V({f:210,t,dur:.07,type:'square',vol:.07,lp:1500});V({f:175,t:t+.09,dur:.11,type:'square',vol:.07,lp:1200})},

    merge:t=>{V({f:300,f2:960,t,dur:.1,type:'sine',vol:.18,fm:.8,fmr:2,r:.08,echo:.15});Nz({t:t+.04,dur:.08,vol:.03,hp:6000})},

function customScene(ctx,W,H,kind,r,card){
  const glow=(x,y,rad,col)=>{const g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)};

    const px=W*(.15+r()*.15),py=H*.85,pr=H*.45;const pg=ctx.createRadialGradient(px-pr*.3,py-pr*.4,pr*.1,px,py,pr);pg.addColorStop(0,"#f3c27a");pg.addColorStop(.6,"#a35a2a");pg.addColorStop(1,"#2a1208");
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,pr,0,7);ctx.fill();
    ctx.strokeStyle="rgba(255,220,170,.5)";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(px,py,pr*1.6,pr*.32,-.25,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
    ctx.fillStyle="#cfd8e6";ctx.beginPath();ctx.arc(W*.86,H*.2,H*.06,0,7);ctx.fill();
  }
  if(kind==="stage"){
    const cols=["255,80,180","80,180,255","255,210,90","160,90,255"];
    for(let i=0;i<5;i++){const x=W*(.1+i*.2),c=cols[i%4];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(${c},.55)`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-6,0);ctx.lineTo(x+6,0);ctx.lineTo(W*.5+(x-W*.5)*.3+70,H*.85);ctx.lineTo(W*.5+(x-W*.5)*.3-70,H*.85);ctx.fill()}
    glow(W*.5,H*.82,H*.5,"rgba(255,230,200,.35)");

    for(let i=0;i<40;i++){const x=r()*W,y=H*(.9+r()*.08),rad=8+r()*8;ctx.fillStyle="#05020a";ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.fillRect(x-rad,y,rad*2,H)}

    const g=ctx.createLinearGradient(0,H*.56,0,H);g.addColorStop(0,"#c98a4b");g.addColorStop(1,"#7a4a1f");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-W*.2,H);ctx.lineTo(W*.12,H*.56);ctx.lineTo(W*.88,H*.56);ctx.lineTo(W*1.2,H);ctx.fill();
    ctx.strokeStyle="rgba(90,50,20,.25)";ctx.lineWidth=1;for(let i=0;i<24;i++){const t=i/24;ctx.beginPath();ctx.moveTo(W*.12+(W*.76)*t,H*.56);ctx.lineTo(-W*.2+W*1.4*t,H);ctx.stroke()}
    ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W*.5,H*.98,W*.32,H*.2,0,Math.PI,0);ctx.stroke();
    glow(W*.5,H*.75,H*.5,"rgba(255,200,140,.2)");
  }
  if(kind==="pitch"){
    glow(W*.12,H*.12,H*.45,"rgba(255,255,230,.7)");glow(W*.88,H*.12,H*.45,"rgba(255,255,230,.7)");
    ctx.fillStyle="#0b1424";ctx.fillRect(0,H*.32,W,H*.22);
    for(let i=0;i<200;i++){ctx.fillStyle=`hsla(${r()<.5?0:210},50%,${40+r()*30}%,.5)`;ctx.fillRect(r()*W,H*(.34+r()*.18),3,3)}
    for(let i=0;i<8;i++){ctx.fillStyle=i%2?"#2f8a3a":"#38a046";const y0=H*.54+(H*.46)*(i/8)**1.2,y1=H*.54+(H*.46)*((i+1)/8)**1.2;ctx.fillRect(0,y0,W,y1-y0+1)}
    ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H*.62);ctx.lineTo(W,H*.62);ctx.stroke();

    const tower=(x,w,h)=>{ctx.fillRect(x,base-h,w,h);ctx.beginPath();ctx.moveTo(x-w*.15,base-h);ctx.lineTo(x+w/2,base-h-w*1.3);ctx.lineTo(x+w*1.15,base-h);ctx.fill()};
    const cx=W*.12;tower(cx,26,90);tower(cx+40,20,130);tower(cx+70,34,70);tower(cx+112,18,110);ctx.fillRect(cx,base-60,150,60);
    for(let i=0;i<14;i++){ctx.fillStyle="rgba(255,200,90,.9)";ctx.fillRect(cx+5+r()*135,base-20-r()*100,3,5)}
    ctx.fillStyle="#05060f";ctx.fillRect(0,base,W,H);

  if(kind==="lair"){
    glow(W*.5,H*.35,H*.6,"rgba(255,60,90,.35)");
    ctx.strokeStyle="rgba(230,200,255,.9)";ctx.lineWidth=2.5;ctx.beginPath();let x=W*(.6+r()*.3),y=0;ctx.moveTo(x,y);while(y<H*.6){x+=(r()-.5)*40;y+=18+r()*20;ctx.lineTo(x,y)}ctx.stroke();
    ridge(ctx,W,H,H*.78,H*.16,P_LAIR[0],r);ridge(ctx,W,H,H*.9,H*.1,P_LAIR[1],r);

    ctx.fillStyle="rgba(255,220,150,.5)";for(let i=0;i<18;i++){const w=20+r()*80;ctx.fillRect(W*.7-w/2+(r()-.5)*40,hz+6+i*7,w,2)}
  }
}
const P_LAIR=["#2a0620","#12030c"];
function rng(seed){let s=seed*9301+49297;return()=>(s=(s*9301+49297)%233280)/233280}
function ridge(ctx,W,H,y0,amp,col,r){
  const p=[r()*6,r()*6,r()*6];ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=6){const y=y0-amp*(0.5*Math.sin(x/W*3+p[0])+0.3*Math.sin(x/W*7+p[1])+0.2*Math.sin(x/W*17+p[2]));ctx.lineTo(x,y)}
  ctx.lineTo(W,H);ctx.fill();
}
function drawShape(ctx,shape,x,y,k,fill){
  ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fillStyle=fill;
  for(const d of SH[shape])ctx.fill(new Path2D(d));ctx.restore();
}
function paintScene(card,W,H,opts={}){
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  const P=HAB[card.hab],r=rng(card.id*31+card.deck.length*7);
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,P.sky[0]);g.addColorStop(.55,P.sky[1]);g.addColorStop(1,P.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sx=W*(.62+r()*.2),sy=H*(.3+r()*.12);
  if(P.sun){const s=ctx.createRadialGradient(sx,sy,0,sx,sy,H*.6);s.addColorStop(0,P.sun);s.addColorStop(.12,P.sun+"cc");s.addColorStop(.35,P.sun+"33");s.addColorStop(1,P.sun+"00");ctx.fillStyle=s;ctx.fillRect(0,0,W,H)}
  if(P.water){ // light shafts + bubbles
    for(let i=0;i<6;i++){ctx.fillStyle="rgba(170,235,255,.07)";ctx.beginPath();const x=r()*W;ctx.moveTo(x,0);ctx.lineTo(x+40+r()*40,0);ctx.lineTo(x-60+r()*120+120,H);ctx.lineTo(x-120+r()*60,H);ctx.fill()}
    for(let i=0;i<26;i++){ctx.strokeStyle="rgba(200,245,255,.35)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(r()*W,r()*H*.8,1+r()*4,0,7);ctx.stroke()}
  }
  if(P.veg==="clouds"){for(let i=0;i<7;i++){ctx.fillStyle="rgba(255,255,255,.55)";const cx=r()*W,cy=H*(.15+r()*.5);for(let j=0;j<5;j++){ctx.beginPath();ctx.ellipse(cx+j*18-36,cy+(r()*8),26+r()*16,12+r()*8,0,0,7);ctx.fill()}}}
  if(P.veg==="volcano"){ctx.fillStyle="#2a0d0b";ctx.beginPath();ctx.moveTo(W*.55,H*.75);ctx.lineTo(W*.72,H*.28);ctx.lineTo(W*.8,H*.28);ctx.lineTo(W*.98,H*.75);ctx.fill();
    const l=ctx.createRadialGradient(W*.76,H*.26,0,W*.76,H*.26,H*.35);l.addColorStop(0,"rgba(255,170,60,.9)");l.addColorStop(1,"rgba(255,80,30,0)");ctx.fillStyle=l;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#ff7a2e";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.75,H*.3);ctx.quadraticCurveTo(W*.78,H*.5,W*.83,H*.7);ctx.stroke();
    for(let i=0;i<40;i++){ctx.fillStyle=`rgba(255,${150+r()*80|0},60,${.4+r()*.5})`;ctx.fillRect(r()*W,r()*H*.7,2,2)}}
  if(P.veg==="skyline"){for(let x=0;x<W;){const w=20+r()*40,h=H*(.15+r()*.35);ctx.fillStyle="#141834";ctx.fillRect(x,H*.72-h,w,h);ctx.fillStyle="rgba(255,214,120,.55)";for(let wy=H*.72-h+6;wy<H*.7;wy+=9)for(let wx=x+4;wx<x+w-4;wx+=8)if(r()<.35)ctx.fillRect(wx,wy,3,4);x+=w+2}}
  if(P.road&&P.veg==="road"){ // floodlights & grandstand
    ctx.fillStyle="#0d0f22";ctx.fillRect(0,H*.5,W,H*.22);for(let i=0;i<4;i++){const x=W*(.12+i*.26);const L=ctx.createRadialGradient(x,H*.18,0,x,H*.18,H*.4);L.addColorStop(0,"rgba(255,255,240,.9)");L.addColorStop(1,"rgba(255,255,240,0)");ctx.fillStyle=L;ctx.fillRect(0,0,W,H);ctx.fillStyle="#0d0f22";ctx.fillRect(x-2,H*.18,4,H*.35)}}

  if(!P.road&&!P.custom){ridge(ctx,W,H,H*(hz-.16),H*.14,P.hills[0],r);if(P.fog)fog(ctx,W,H,H*.45,P.sky[1]);ridge(ctx,W,H,H*(hz-.06),H*.1,P.hills[1],r)}

function sizeChart(ctx,card,W,H){
  const pw=W*.4,ph=H*.36,px=W-pw-10,py=H-ph-10;

  const innerW=pw-28,innerH=ph-30,gx=px+12,gy=py+ph-12;
  const span=L+2.2, tall=Math.max(Hm,1.8)*1.15;
  const ppm=Math.min(innerW/span,innerH/tall);

  ctx.strokeStyle="rgba(255,207,63,.22)";ctx.lineWidth=1;
  for(let m=0;m*ppm<=innerW+1;m+=step){ctx.beginPath();ctx.moveTo(gx+m*ppm,gy);ctx.lineTo(gx+m*ppm,py+16);ctx.stroke()}
  for(let m=0;m*ppm<=innerH;m+=step){ctx.beginPath();ctx.moveTo(gx,gy-m*ppm);ctx.lineTo(px+pw-12,gy-m*ppm);ctx.stroke()}
  ctx.strokeStyle="rgba(255,207,63,.7)";ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(px+pw-12,gy);ctx.stroke();

  ctx.fillStyle="#ffcf3f";ctx.font="600 "+Math.round(H*.065)+"px 'Barlow Condensed',sans-serif";ctx.textBaseline="top";

const PHOTOS=window.WT_PHOTOS||{};
let ME="me";
try{ME=sessionStorage.getItem("wt-id")||("p"+Math.random().toString(36).slice(2,10));sessionStorage.setItem("wt-id",ME)}catch(e){ME="p"+Math.random().toString(36).slice(2,10)}
let LINK=null; // {role:"host"|"guest", code, unsubs, closed}
const ROOMS={db:NET.db,canWrite:true,async ready(){return true},
  host(make){return NET.host(make)},join(c){return NET.join(c)},close(){NET.close()},
  offline:"Online play needs an internet connection.",readonly:"Online play needs an internet connection."};
NET.onLost(()=>{if(G&&G.mode==="online")flash("Your friend has left, so the game has closed.")});
function netErr(e){const c=e&&e.code;return c==="notfound"?"No game with that code. Check it, and that your friend still has the game open.":c==="invalid_argument"?ROOMS.readonly:c==="offline"?"Couldn't connect. Check your internet connection and try again.":"Couldn't reach the game. Check your connection and try again."}
function netClose(){if(!LINK)return;LINK.closed=true;LINK.unsubs.forEach(u=>{try{u()}catch(e){}});clearTimeout(LINK.timer);try{ROOMS.close()}catch(e){}LINK=null}
function hostNet(code){
  netClose();
  const net=LINK={role:"host",code,unsubs:[],seen:{},chain:Promise.resolve()};
  net.unsubs.push(ROOMS.db.collection("games/"+code+"/msg").onSnapshot(qs=>{
    if(net.closed)return;
    qs.docs.forEach(d=>{const v=d.data();if(!v||!v.m||(net.seen[d.id]||0)>=v.n)return;net.seen[d.id]=v.n;hostHear({send(){}},{...v.m,from:d.id})});
  },()=>{}));
}
function hostHear(conn,msg){
  if(!G||G.mode!=="online"||!msg||typeof msg!=="object")return;
  const st=G.cur;if(!st)return;
  const who=String(msg.from||msg.id||"").slice(0,20);
  if(msg.t==="join"){
    if(st.phase==="waiting"){
      const ns={...st,players:[ME,who],names:[st.names[0],String(msg.name||"Player 2").slice(0,14)],phase:"play",updated:Date.now()};
      hostSet(ns);
    } else if(st.players[1]===who)hostSet(st);
  }
  if(msg.t==="pick"&&who&&st.players[1]===who&&st.phase==="play"&&st.chooser===1&&st.seq===msg.seq&&Number.isInteger(msg.s)&&msg.s>=0&&msg.s<DECKS[st.deck].stats.length){
    hostSet(nextState(st,msg.s));
  }
  if(msg.t==="again"&&who===st.players[1]&&st.phase==="over"){
    const n=newState(st.deck,st.names);n.players=st.players;n.doc=st.doc;hostSet(n);
  }
}
function hostSet(ns){G.cur=ns;
  if(LINK){const net=LINK,doc={st:JSON.parse(JSON.stringify(ns)),host:ME,at:Date.now()};net.chain=net.chain.then(()=>ROOMS.db.doc("games/"+net.code).set(doc)).catch(e=>{if(!net.closed)flash(netErr(e))})}
  apply(ns)}
function guestNet(code,name){
  netClose();
  const net=LINK={role:"guest",code,unsubs:[],got:false};
  const onState=msg=>{
    if(!msg||typeof msg!=="object"||!G||net.closed)return;
    if(msg.t==="state"&&msg.st){
      if(msg.st.phase!=="waiting"&&msg.st.players[1]&&msg.st.players[1]!==ME&&msg.st.players[0]!==ME){toShelf();lobbyNote("That game already has two players.");return}
      if(msg.st.phase==="waiting")return;
      net.got=true;if(G.cur&&msg.st.gid===G.cur.gid&&msg.st.seq<G.cur.seq)return;G.cur=msg.st;if(!G.badges)setupTable(msg.st.deck);apply(msg.st)}
  };
  net.unsubs.push(ROOMS.db.doc("games/"+code).onSnapshot(s=>{
    if(net.closed)return;
    if(!s.exists){if(net.got)flash("Your friend has closed the game.");return}
    const d=s.data();if(d&&d.st)onState({t:"state",st:d.st})},()=>{}));
  net.send=m=>ROOMS.db.doc("games/"+code+"/msg/"+ME).set({m,n:Date.now()}).catch(e=>{if(!net.closed)flash(netErr(e))});
  net.send({t:"join",name});
  net.timer=setTimeout(()=>{if(!net.got&&!net.closed&&!G?.shown){toShelf();lobbyNote(`Couldn't reach game ${code}. Check the code, and make sure your friend still has the game open.`)}},30000);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newState(deckId,names){

  return{gid:Math.random().toString(36).slice(2,12),deck:deckId,names,players:[null,null],deal:ids,
    hands:[ids.filter((_,i)=>i%2===0),ids.filter((_,i)=>i%2===1)],pot:[],chooser:Math.random()<.5?0:1,
    phase:"play",seq:0,last:null,rounds:0,updated:Date.now()};

function nextState(st,s){
  const d=DECKS[st.deck],n=JSON.parse(JSON.stringify(st));
  const a=n.hands[0].shift(),b=n.hands[1].shift();
  const va=d.cards[a-1].v[s],vb=d.cards[b-1].v[s],low=d.stats[s].low;
  const w=va===vb?-1:(low?(va<vb?0:1):(va>vb?0:1));
  if(w<0)n.pot.push(a,b);else{n.hands[w].push(...(w===0?[a,b]:[b,a]),...n.pot);n.pot=[];n.chooser=w}
  n.seq++;n.rounds++;n.last={seq:n.seq,s,a,b,w,by:st.chooser};n.updated=Date.now();
  if(!n.hands[0].length||!n.hands[1].length)n.phase="over";
  return n;
}

 hp:/character|fictional|harry potter/i,starwars:/character|fictional|star wars/i,villains:/character|fictional|villain|antagonist|comic|disney|vampire|novel/i};
const PEOPLE_DECKS=new Set(["hp","starwars","villains","singers","football","basketball"]);
const wikiCache=new Map();
function wikiFor(c){
  const key=c.deck+"|"+c.name;if(wikiCache.has(key))return wikiCache.get(key);
  let saved=null;try{saved=JSON.parse(localStorage.getItem("wt.wiki2."+key)||"null")}catch(e){}
  const remember=v=>{try{localStorage.setItem("wt.wiki2."+key,JSON.stringify(v))}catch(e){}};
  const job=saved?Promise.resolve(saved.src?saved:null):(async()=>{
    if(navigator.onLine===false)return null;
    const t=(WIKI_TITLE[c.deck]||{})[c.name],cands=[...new Set([t,c.name].filter(Boolean))],ok=WIKI_OK[c.deck];
    for(const title of cands){
      let r;for(let tries=0;tries<4;tries++){
        try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
          r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_")),{signal:ctl.signal});clearTimeout(tm)}
        catch(e){return null}                     // offline or blocked: try again next time
        if(r.status!==429&&r.status<500)break;await sleep(1200*(tries+1))}
      if(r.status===404)continue;if(!r.ok)return null;
      let j;try{j=await r.json()}catch(e){return null}
      if(j.type==="disambiguation")continue;
      if(ok&&!ok.test((j.description||"")+" "+(j.extract||"").slice(0,200)))continue;
      if(!j.thumbnail){remember({src:""});return null}
      // Wikimedia only serves its standard thumbnail widths, so ask for 500px when the original is big enough
      const alt=j.thumbnail.source,ow=j.originalimage&&j.originalimage.width;let src=alt;
      if(ow>=500&&/\/\d+px-/.test(alt))src=alt.replace(/\/\d+px-/,"/500px-");
      const v={src,alt,page:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||""};remember(v);return v}
    remember({src:""});return null})();
  wikiCache.set(key,job);return job;
}
const PHOTO_CACHE="wt-photos-v1";
async function cachedURL(src){try{const c=await caches.open(PHOTO_CACHE),r=await c.match(src);if(r)return URL.createObjectURL(await r.blob())}catch(e){}return null}
async function cacheImg(src){try{const c=await caches.open(PHOTO_CACHE);if(await c.match(src))return true;const r=await fetch(src,{mode:"cors"});if(!r.ok)return false;await c.put(src,r.clone());return true}catch(e){return false}}
const allCards=()=>Object.values(DECKS).flatMap(d=>d.cards);
const imgCands=r=>[...new Set([r.src,r.alt].filter(Boolean))];
const NO_BUNDLE=new Set(["hp","starwars","villains"]);   // character images on Wikipedia are copyrighted film stills: shown live, never bundled
async function savePhotos(prog){const all=allCards();let done=0,got=0;
  for(let i=0;i<all.length;i+=6)await Promise.all(all.slice(i,i+6).map(async c=>{
    if(PHOTOS[c.deck]?.[c.id]){got++}else{const r=await wikiFor(c);if(r){for(const u of imgCands(r))if(await cacheImg(u)){got++;break}}}done++;prog(done,all.length,got)}));
  return{got,total:all.length}}
function toJpeg(u){return new Promise(res=>{const im=new Image();if(/^https?:/.test(u))im.crossOrigin="anonymous";
  im.onload=()=>{try{const s=Math.min(1,560/im.naturalWidth),cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.78))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=u})}
async function exportPhotos(prog){const out={},missing=[],all=allCards();let i=0;
  for(const c of all){i++;let data=PHOTOS[c.deck]?.[c.id]||null;
    if(!data&&!NO_BUNDLE.has(c.deck)){const r=await wikiFor(c);if(r)for(const cand of imgCands(r)){data=await toJpeg(await cachedURL(cand)||cand);if(data)break}}
    if(data)(out[c.deck]||(out[c.deck]={}))[c.id]=data;else if(!NO_BUNDLE.has(c.deck))missing.push(DECKS[c.deck].title+": "+c.name);prog(i,all.length)}
  const txt="/* Wild Trumps photo pack: lead images from Wikipedia, resized for the cards */\nwindow.WT_PHOTOS="+JSON.stringify(out)+";\n/* missing: "+missing.join(" | ").replace(/\*\//g,"")+" */\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));a.download="wt-photos.js";document.body.append(a);a.click();setTimeout(()=>a.remove(),500);
  return{saved:Object.values(out).reduce((n,o)=>n+Object.keys(o).length,0),missing}}
function wikiPhoto(el,c){
  if(PHOTOS[c.deck]?.[c.id]){const pic=el.querySelector(".pic");if(pic){pic.classList.add("photo");if(PEOPLE_DECKS.has(c.deck)){const bg=pic.querySelector("img.bg");if(bg)bg.style.objectPosition="50% 22%"}pic.insertAdjacentHTML("beforeend",'<span class="cr">Photo: Wikipedia</span>')}return}
  wikiFor(c).then(async r=>{if(!r||!el.isConnected)return;const cands=imgCands(r);let k=0;
    const next=async()=>{if(k>=cands.length)return;const u=cands[k++];const src=await cachedURL(u)||u;if(src===u)cacheImg(u);const im=new Image();im.decoding="async";im.onerror=next;
    im.onload=()=>{const pic=el.querySelector(".pic"),bg=pic&&pic.querySelector("img.bg");if(!bg)return;
      bg.src=src;if(PEOPLE_DECKS.has(c.deck))bg.style.objectPosition="50% 22%";pic.classList.add("photo");
      if(!pic.querySelector(".cr"))pic.insertAdjacentHTML("beforeend",'<span class="cr">Photo: Wikipedia</span>')};
    im.src=src};next()});
}

function apply(st){G.queue.push(st);if(!G.busy)drain()}
async function drain(){

    let st=g.queue.shift();
    // collapse to the newest state that is still one step on, or the newest overall
    while(g.queue.length&&!(g.shown&&st.gid===g.shown.gid&&st.seq===g.shown.seq+1&&st.phase!=="waiting"))st=g.queue.shift();
    try{await step(st,g)}catch(e){console.error(e)}

}
async function step(st,g){
  const prev=g.shown;
  if(prev&&st.gid===prev.gid&&st.seq<prev.seq)return;
  if(prev&&st.gid===prev.gid&&st.seq===prev.seq&&st.phase===prev.phase){g.shown=st;hud();return}
  if(st.phase==="waiting"){g.shown=st;layout();hud();showWaiting(st);return}
  const fresh=!prev||prev.gid!==st.gid||prev.phase==="waiting";
  if(fresh){
    clearCards();g.shown={...st,hands:[[],[]]};layout();hud();
    $("over")?.remove();
    await dealAnim(st,g);if(G!==g)return;
    g.shown=st;hud();

  } else if(st.seq===prev.seq+1&&st.last){
    await clashAnim(prev,st,g);if(G!==g)return;
    g.shown=st;hud();

}

/* Back to all games: sits at the start of the game's header; floats top-left on screens without one */
(function(){
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
