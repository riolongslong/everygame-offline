<style>

}
html,body{height:100%}
body{background:var(--wood);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;

button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.65em 1.1em;font-weight:800;letter-spacing:.01em}

.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--body);font-size:calc(var(--cw)*.5);padding-top:12%}
.card .tag{position:absolute;bottom:6%;right:6%;font-family:var(--body);font-weight:800;font-size:calc(var(--cw)*.13);

/* Home */
.home{display:grid;gap:18px}
.hero{padding:22px 0 6px}

  border:2px dashed var(--line);border-radius:14px}

.pile .empty{color:var(--muted);font-size:12px;text-align:center;padding:6px}
.drop{animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-18px) scale(1.06);opacity:.3}}
.need{font-family:var(--display);font-size:clamp(20px,5vw,28px);line-height:1.05;color:var(--text);text-wrap:balance}
.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap}
.log{list-style:none;margin:6px 0 0;padding:0;font-size:13px;display:grid;gap:2px}
.log li{color:var(--muted)}
.log li:first-child{color:var(--text)}

.mine{margin-top:auto;background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}

.mine .head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

.slots{display:flex;gap:10px}

.hand{display:flex;flex-wrap:wrap;gap:8px 6px;padding:16px 4px 6px;min-height:calc(var(--ch) + 22px)}
.hand .card,.slot .card.up{touch-action:none}
.card.dragging{opacity:.35}
.card.droptarget{box-shadow:0 0 0 3px var(--ok),0 8px 16px rgba(0,0,0,.4);transform:translateY(-6px)}
.card.dragghost{position:fixed;pointer-events:none;z-index:40;transform:translate(-50%,-60%) rotate(-6deg);box-shadow:0 14px 28px rgba(0,0,0,.5);transition:none}
.hand .empty{color:var(--muted);font-size:13px;align-self:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:130px}

.overlay{position:fixed;inset:0;background:rgba(15,8,6,.72);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--wood-2);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:480px;width:100%;max-height:86vh;overflow:auto;display:grid;gap:12px;box-sizing:border-box}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--brass)}
.sheet ol,.sheet ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateX(-50%);background:var(--ink);color:var(--text);
  border:1px solid var(--brass-dim);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:520px){
  .centre{gap:12px}
  .opp{min-width:0;flex:1 1 140px}
  .wordmark{font-size:22px}
}
@media (max-width:520px){header{flex-wrap:wrap;row-gap:8px}header .grow{display:none}.wordmark{margin-right:auto}header button,.hublink{padding:.4em .6em!important;font-size:12px!important}}
.deck{position:relative;width:calc(var(--cw)*1.2);height:calc(var(--ch)*1.15);display:grid;place-items:center}
.deck .card{position:absolute;left:calc(var(--cw)*.12);top:calc(var(--ch)*.12)}
.deck .dcount{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--brass);border:1.5px solid var(--brass-dim);border-radius:999px;padding:1px 8px;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:2}
.deck .gone{width:var(--cw);height:var(--ch);border:2px dashed var(--line);border-radius:calc(var(--cw)*.1);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
body.cb4 .card.sH{color:#d0201a}body.cb4 .card.sD{color:#1f5fd6}body.cb4 .card.sC{color:#14833b}body.cb4 .card.sS{color:#111}
@media (max-width:520px){.centre{grid-template-columns:auto auto 1fr!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ---------- Rooms without Claude: peer-to-peer, host keeps the table ----------
   The player who creates a room becomes its host. Everyone else connects straight to
   the host's device (PeerJS). The host holds every room document and sends each change
   to all players. The object below offers the same small set of calls the games already
   use (doc().get/set/onSnapshot/acquire, collection().onSnapshot), so game code is unchanged. */
const NET=(()=>{
  const GAME=(document.documentElement.dataset.game||'game');
  const PREFIX='riosgames-'+GAME+'-';
  const store=new Map(),subs=new Set(),leases=new Map(),pending=new Map();
  let role=null,peer=null,conns=[],hostConn=null,reqId=0,onLost=null;
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const snap=(p,d)=>({id:p.split('/').pop(),exists:d!==undefined,data:()=>clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
  function deliver(s){
    if(s.coll){const depth=s.path.split('/').length+1;
      const docs=[...store].filter(([p])=>p.startsWith(s.path+'/')&&p.split('/').length===depth).map(([p,d])=>snap(p,d));
      s.fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>[]})}
    else s.fn(snap(s.path,store.get(s.path)));
  }
  const fire=()=>{for(const s of [...subs])try{deliver(s)}catch(e){console.error(e)}};
  function put(path,data){if(data==null)store.delete(path);else store.set(path,clone(data))}
  function broadcast(m){for(const c of conns)try{c.open&&c.send(m)}catch(e){}}
  function hostPut(path,data){leases.delete(path);put(path,data);broadcast({t:'put',path,data});fire()}
  function lease(path,holder,ttl){const now=Date.now(),l=leases.get(path);
    if(l&&l.until>now&&l.holder!==holder)return{acquired:false};
    leases.set(path,{holder,until:now+Math.max(1000,Math.min(ttl||4000,10000))});return{acquired:true}}
  function hostHear(conn,m){
    if(!m||typeof m!=='object')return;
    if(m.t==='put'&&typeof m.path==='string'&&m.path.startsWith('games/'))hostPut(m.path,m.data);
    else if(m.t==='acq')conn.send({t:'ack',id:m.id,res:lease(m.path,m.holder,m.ttl)});
  }
  function guestHear(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='sync'){store.clear();for(const[p,d] of m.entries)put(p,d);fire();const j=pending.get('join');if(j){pending.delete('join');j.resolve()}}
    else if(m.t==='put'){put(m.path,m.data);fire()}
    else if(m.t==='ack'){const r=pending.get(m.id);if(r){pending.delete(m.id);r.resolve(m.res)}}
  }
  function request(m){return new Promise((resolve,reject)=>{const id=++reqId;pending.set(id,{resolve});
    try{hostConn.send({...m,id})}catch(e){pending.delete(id);reject({code:'unavailable'})}
    setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject({code:'unavailable'})}},6000)})}
  const PeerImpl=()=>/[?&]loopback\b/.test(location.search)?LoopPeer:window.Peer;
  const opts={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  function close(){for(const c of conns)try{c.close()}catch(e){}conns=[];try{hostConn&&hostConn.close()}catch(e){}hostConn=null;
    try{peer&&peer.destroy()}catch(e){}peer=null;role=null;store.clear();leases.clear();fire()}
  function host(randCode){
    close();const P=PeerImpl();if(!P)return Promise.reject({code:'offline'});
    return new Promise((resolve,reject)=>{let tries=0;
      const attempt=()=>{const code=randCode();const p=peer=new P(PREFIX+code,opts);let done=false;
        p.on('open',()=>{done=true;role='host';resolve(code)});
        p.on('error',e=>{if(done)return;try{p.destroy()}catch(_){}
          if(e&&e.type==='unavailable-id'&&++tries<6)attempt();else reject({code:'offline'})});
        p.on('connection',c=>{conns.push(c);
          c.on('open',()=>c.send({t:'sync',entries:[...store]}));
          c.on('data',m=>hostHear(c,m));
          c.on('close',()=>{conns=conns.filter(x=>x!==c)})});
        p.on('disconnected',()=>{if(role==='host')setTimeout(()=>{try{p.reconnect()}catch(_){}},1500)});
        setTimeout(()=>{if(!done){try{p.destroy()}catch(_){}reject({code:'offline'})}},15000)};
      attempt()});
  }
  function join(code){
    close();const P=PeerImpl();if(!P)return Promise.reject({code:'offline'});
    return new Promise((resolve,reject)=>{
      const p=peer=new P(undefined,opts);let ok=false;
      const fail=c=>{if(ok)return;pending.delete('join');close();reject({code:c})};
      pending.set('join',{resolve:()=>{ok=true;resolve()}});
      p.on('open',()=>{const c=hostConn=p.connect(PREFIX+code,{reliable:true});
        c.on('data',guestHear);
        c.on('close',()=>{if(ok&&role==='guest'){role=null;onLost&&onLost()}});
        c.on('error',()=>fail('notfound'))});
      p.on('error',e=>fail(e&&e.type==='peer-unavailable'?'notfound':'offline'));
      role='guest';
      setTimeout(()=>fail('notfound'),12000)});
  }
  const db={
    doc(path){return{id:path.split('/').pop(),path,
      get:async()=>snap(path,store.get(path)),
      set:async d=>{if(role==='guest'){put(path,d);fire();hostConn.send({t:'put',path,data:d})}else hostPut(path,d)},
      delete:async()=>{if(role==='guest'){put(path,null);fire();hostConn.send({t:'put',path,data:null})}else hostPut(path,null)},
      acquire:async({holder,ttlMs})=>role==='guest'?request({t:'acq',path,holder,ttl:ttlMs}):lease(path,holder,ttlMs),
      onSnapshot(fn){const s={path,fn,coll:false};subs.add(s);setTimeout(()=>subs.has(s)&&deliver(s));return()=>subs.delete(s)}}},
    collection(path){return{path,onSnapshot(fn){const s={path,fn,coll:true};subs.add(s);setTimeout(()=>subs.has(s)&&deliver(s));return()=>subs.delete(s)}}}
  };
  return{db,host,join,close,onLost:f=>onLost=f,get role(){return role}};
})();

/* Same-browser stand-in for PeerJS, used only for testing (?loopback in the address). */
class LoopPeer{
  constructor(id){this.id=id||'anon-'+Math.random().toString(36).slice(2,9);this.h={};this.bc=new BroadcastChannel('loopnet');
    this.bc.onmessage=e=>{const m=e.data;
      if(m.k==='claim'&&m.id===this.id&&m.from!==this.uid)this.bc.postMessage({k:'taken',id:this.id,to:m.from});
      if(m.k==='taken'&&m.to===this.uid){this.dead=true;this.emit('error',{type:'unavailable-id'})}
      if(m.k==='open'&&m.to===this.id){const c=new LoopConn(this,m.from,m.cid);this.emit('connection',c);setTimeout(()=>{this.bc.postMessage({k:'ok',to:m.from,cid:m.cid});c.ready()},10)}
      if(m.k==='ok'&&m.to===this.id){const c=this.out[m.cid];c&&c.ready()}
      if(m.k==='msg'&&m.to===this.id){const c=this.all[m.cid];c&&c.emit('data',m.data)}
      if(m.k==='nohost'&&m.to===this.id)this.emit('error',{type:'peer-unavailable'})};
    this.uid=Math.random().toString(36);this.out={};this.all={};
    this.bc.postMessage({k:'claim',id:this.id,from:this.uid});
    setTimeout(()=>{if(!this.dead)this.emit('open',this.id)},120);
    this.probe=new BroadcastChannel('loopnet-probe');this.probe.onmessage=e=>{if(e.data.ask===this.id)this.probe.postMessage({yes:this.id,to:e.data.from})};
  }
  on(k,f){(this.h[k]=this.h[k]||[]).push(f)}
  emit(k,v){(this.h[k]||[]).forEach(f=>f(v))}
  connect(to){const cid=Math.random().toString(36).slice(2);const c=new LoopConn(this,to,cid);this.out[cid]=c;
    const pr=new BroadcastChannel('loopnet-probe');let seen=false;pr.onmessage=e=>{if(e.data.yes===to&&e.data.to===this.id)seen=true};
    pr.postMessage({ask:to,from:this.id});setTimeout(()=>{pr.close();if(!seen)this.emit('error',{type:'peer-unavailable'});else this.bc.postMessage({k:'open',to,from:this.id,cid})},150);
    return c}
  destroy(){this.dead=true;try{this.bc.close();this.probe.close()}catch(e){}}
  reconnect(){}
}
class LoopConn{
  constructor(p,to,cid){this.p=p;this.to=to;this.cid=cid;this.h={};this.open=false;p.all[cid]=this}
  ready(){this.open=true;this.emit('open')}
  on(k,f){(this.h[k]=this.h[k]||[]).push(f)}

/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));

  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;

    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}

  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;

    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);

    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);

      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));

function rgAfter(){
  const hd=document.querySelector('#app header');if(hd&&!hd.querySelector('.rg-btn'))hd.insertBefore(RG.button(),hd.querySelector('[data-act=settings]'));
  if(!G||!G.seats){rgPrev=null;return}
  const cur={deal:G.deal,phase:G.phase,pile:G.pile.length,burned:G.burned,stock:(G.stock||[]).length,out:G.out.length,turn:G.turn};
  const p=rgPrev;rgPrev=cur;
  if(!p||p.deal!==cur.deal){if(p&&cur.phase==='swap')RG.sfx('shuffle');return}
  if(cur.phase==='over'&&p.phase!=='over'){RG.sfx(!G.out.includes(me)?'lose':G.out[0]===me?'fanfare':'win');return}
  if(cur.phase==='play'&&p.phase==='swap'){RG.sfx('deal');return}
  if(cur.burned>p.burned)RG.sfx('burn');else if(cur.pile>p.pile)RG.sfx('place');else if(cur.pile===0&&p.pile>0)RG.sfx('pickup');
  if(cur.stock<p.stock)setTimeout(()=>RG.sfx('deal'),140);
  if(cur.out>p.out)setTimeout(()=>RG.sfx('good'),220);

const rgCb=()=>document.body.classList.toggle('cb4',RG.prefs.cb!=='off');RG.onChange(rgCb);addEventListener('DOMContentLoaded',rgCb);if(document.body)rgCb();

/* ---------- Rules engine ---------- */
const RANKS='3456789TJQKA2';
const val=r=>RANKS.indexOf(r);
const rk=c=>c[0];
const ANY=new Set(['2','7','8','T']);           // power cards that go on anything
const SUIT={S:'♠',H:'♥',D:'♦',C:'♣'};
const TAG={'2':'RESET','7':'≤7','8':'GHOST','T':'BURN'};
const lab=r=>r==='T'?'10':r;
const word=r=>({J:'Jack',Q:'Queen',K:'King',A:'Ace',T:'10'})[r]||r;
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(n){const d=[];for(let k=0;k<n;k++)for(const s of 'SHDC')for(const r of '23456789TJQKA')d.push(r+s+k);return shuffle(d)}
function sortHand(h){h.sort((a,b)=>val(rk(a))-val(rk(b))||a.localeCompare(b))}
function effTop(p){for(let i=p.length-1;i>=0;i--)if(rk(p[i])!=='8')return p[i];return null}
function canPlay(r,p){
  if(ANY.has(r))return true;
  const t=effTop(p); if(!t)return true;
  const tr=rk(t);
  if(tr==='2')return true;
  if(tr==='7')return val(r)<=val('7');
  return val(r)>=val(tr);
}
function needText(p){
  const t=effTop(p);
  if(!t)return p.length?'8 is see-through: anything goes':'Fresh pile: anything goes';
  const tr=rk(t);
  if(tr==='2')return '2 reset it: anything goes';
  if(tr==='7')return '7 or lower (or a 2, 8 or 10)';
  if(tr==='A')return 'Ace (or a 2, 7, 8 or 10)';
  return `${word(tr)} or higher`;
}
function source(s){return s.hand.length?'hand':s.up.length?'up':s.down.length?'down':null}
const nm=(G,p)=>G.players[p].nick;
function active(G){return G.players.map((_,i)=>i).filter(i=>!G.out.includes(i))}
function nextActive(G,p){const n=G.players.length;for(let k=1;k<=n;k++){const q=(p+k)%n;if(!G.out.includes(q))return q}return p}
function log(G,m){G.log.unshift(m);G.log=G.log.slice(0,6)}
function score(r){return r==='T'?30:r==='2'?29:r==='8'?28:val(r)}
function botSwap(s){const all=[...s.hand,...s.up].sort((a,b)=>score(rk(b))-score(rk(a)));s.up=all.slice(0,3);s.hand=all.slice(3)}

function deal(base){
  const players=base.players,n=players.length,deck=makeDeck(n>=5?2:1);
  const seats=players.map(()=>({hand:[],up:[],down:[]}));
  seats.forEach(s=>s.down=deck.splice(0,3));
  seats.forEach(s=>s.up=deck.splice(0,3));
  seats.forEach(s=>s.hand=deck.splice(0,3));
  seats.forEach((s,i)=>{if(players[i].bot&&base.level!=='easy')botSwap(s);sortHand(s.hand)});
  return {...base,phase:'swap',seats,stock:deck,pile:[],burned:0,turn:0,out:[],shed:null,
    log:['Cards dealt. Swap your face-up cards, then press Ready.'],deal:(base.deal||0)+1};
}
function startPlay(G){
  let best=0,bv=99;
  G.seats.forEach((s,i)=>{sortHand(s.hand);const v=Math.min(...s.hand.map(c=>val(rk(c))),99);if(v<bv){bv=v;best=i}});
  G.phase='play';G.turn=best;log(G,`${nm(G,best)} ${nm(G,best)==='You'?'have':'has'} the lowest card and ${nm(G,best)==='You'?'start':'starts'}.`);return G;
}
function finish(G,p){
  const s=G.seats[p];
  if(!s.hand.length&&!s.up.length&&!s.down.length&&!G.out.includes(p)){
    G.out.push(p);
    const left=active(G);
    if(left.length<=1){G.phase='over';G.shed=left[0]??null}
    return true;
  }
  return false;
}
function draw(G,p){const s=G.seats[p];G.stock=G.stock||[];while(s.hand.length<3&&G.stock.length)s.hand.push(G.stock.pop());sortHand(s.hand)}
function resolve(G,p,r,msg){
  let again=false;draw(G,p);
  if(r==='T'){G.burned+=G.pile.length;G.pile=[];again=true;msg+=' and burned the pile'}
  else{let n=0;for(let i=G.pile.length-1;i>=0&&rk(G.pile[i])===r;i--)n++;
    if(n>=4){G.burned+=G.pile.length;G.pile=[];again=true;msg+=': four of a kind, pile burned'}}
  const out=finish(G,p);
  if(out)msg+=`. ${nm(G,p)} ${nm(G,p)==='You'?'are':'is'} out!`;else if(again)msg+=nm(G,p)==='You'?'. You go again.':'. Goes again.';
  log(G,msg);
  if(G.phase!=='over'&&(!again||out))G.turn=nextActive(G,p);
  return G;
}
function doPlay(G0,p,cards){
  const G=clone(G0),s=G.seats[p],src=source(s),r=rk(cards[0]);
  for(const c of cards){const i=s[src].indexOf(c);if(i<0)return G0;s[src].splice(i,1)}
  G.pile.push(...cards);
  return resolve(G,p,r,`${nm(G,p)} played ${cards.length>1?cards.length+' × ':'a '}${lab(r)}`);
}
function doPickup(G0,p){
  const G=clone(G0),s=G.seats[p],n=G.pile.length;
  s.hand.push(...G.pile);G.pile=[];sortHand(s.hand);
  log(G,`${nm(G,p)} picked up ${n} card${n===1?'':'s'}.`);G.turn=nextActive(G,p);return G;
}
function doBlind(G0,p,i){
  const G=clone(G0),s=G.seats[p],c=s.down.splice(i,1)[0];
  if(!c)return G0;
  if(canPlay(rk(c),G.pile)){G.pile.push(c);return resolve(G,p,rk(c),`${nm(G,p)} flipped a ${lab(rk(c))} and it plays`)}
  const n=G.pile.length+1;s.hand.push(...G.pile,c);G.pile=[];sortHand(s.hand);
  log(G,`${nm(G,p)} flipped a ${lab(rk(c))}. No good, picked up ${n}.`);G.turn=nextActive(G,p);return G;
}
function legalRanks(G,p){const s=G.seats[p],src=source(s);if(!src||src==='down')return[];return[...new Set(s[src].map(rk))].filter(r=>canPlay(r,G.pile))}
function cost(r){return r==='T'?40:r==='2'?32:r==='8'?26:val(r)}
function suggest(){
  const s=G.seats[me],src=source(s);
  if(src==='down')return{type:'blind'};
  const ranks=legalRanks(G,me);if(!ranks.length)return{type:'pickup'};
  ranks.sort((a,b)=>cost(a)-cost(b));
  if(ranks.includes('T')&&G.pile.length>=6&&cost(ranks[0])>=val('Q'))ranks.unshift('T');
  return{type:'play',rank:ranks[0],cards:s[src].filter(c=>rk(c)===ranks[0])};
}
function botAct(G,p){
  const lv=G.level||'normal',s=G.seats[p],src=source(s);
  if(src==='down')return doBlind(G,p,Math.random()*s.down.length|0);
  const ranks=legalRanks(G,p);
  if(!ranks.length)return doPickup(G,p);
  if(lv==='easy'){const r=ranks[Math.random()*ranks.length|0],cards=s[src].filter(c=>rk(c)===r);return doPlay(G,p,Math.random()<.5?cards:[cards[0]])}
  ranks.sort((a,b)=>cost(a)-cost(b));
  if(lv==='normal'&&ranks.length>1&&Math.random()<.2)ranks.unshift(ranks[1+(Math.random()*(ranks.length-1)|0)]);
  // burn a big pile when the alternative is dumping a high card
  if(ranks.includes('T')&&G.pile.length>=6&&cost(ranks[0])>=val('Q'))ranks.unshift('T');
  if(lv==='hard'){
    // complete four of a kind to burn and go again
    if(G.pile.length){const top=rk(G.pile[G.pile.length-1]);let run=0;for(let i=G.pile.length-1;i>=0&&rk(G.pile[i])===top;i--)run++;
      if(ranks.includes(top)&&run+s[src].filter(c=>rk(c)===top).length>=4)ranks.unshift(top)}
    // squeeze an opponent who is nearly out with a 7
    const nx=nextActive(G,p),ns=G.seats[nx],left=ns.hand.length+ns.up.length+ns.down.length;
    if(left<=4&&ranks.includes('7')&&ranks[0]!=='T')ranks.unshift('7');
    if(ranks.includes('T')&&G.pile.length>=9)ranks.unshift('T');
  }
  return doPlay(G,p,s[src].filter(c=>rk(c)===ranks[0]));
}

let db=null, user=null, uid=null, canWrite=null, code=null, unsub=null, unsubSwap=null, swaps={}, mySwap=null, mySwapDeal=0, myReady=false, mergedDeal=0, writeChain=Promise.resolve();

/* ---------- Commit (local or shared) ---------- */
function commit(next){
  next.v=(G?.v||0)+1;
  G=next;sel.clear();
  if(mode==='online'){
    const snap=clone(G);
    writeChain=writeChain.then(()=>db.doc('games/'+code).set(snap)).catch(e=>toast(writeErr(e)));
  }
  render();scheduleBot();
}
function writeErr(e){const c=e&&e.code;return c==='notfound'?'No room with that code. Check it, and that the host still has the game open.':c==='offline'?'Couldn\'t connect. Check your internet connection and try again.':'Lost the connection to the room. Check your internet.'}
function scheduleBot(){
  clearTimeout(botTimer);
  if(!G||G.phase!=='play')return;
  const p=G.turn;if(!G.players[p]?.bot)return;
  if(mode==='online'&&G.host!==uid)return;
  const v=G.v;
  botTimer=setTimeout(()=>{if(G&&G.v===v&&G.phase==='play'&&G.turn===p)commit(botAct(G,p))},({slow:1700,normal:900,fast:350})[SET.speed]||900);
}

async function initCaps(){

function randCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=A[Math.random()*A.length|0];return s}
async function locked(c,fn){
  const ref=db.doc('games/'+c);
  for(let t=0;t<8;t++){
    const l=await ref.acquire({holder:uid,ttlMs:4000});
    if(l.acquired){const snap=await ref.get();const res=fn(snap.exists?clone(snap.data()):null);if(res&&res.doc)await ref.set(res.doc);return res}
    await new Promise(r=>setTimeout(r,400+Math.random()*400));
  }
  throw {message:'busy'};
}
async function createRoom(){
  const nick=($('#nick').value||'').trim().slice(0,16);if(!nick){toast('Pick a nickname first.');$('#nick').focus();return}
  setNick(nick);
  try{
    const c=await NET.host(randCode);
    await db.doc('games/'+c).set({code:c,host:uid,phase:'lobby',players:[{id:uid,nick}],deal:0,v:1,created:Date.now()});
    enter(c);
  }catch(e){toast(writeErr(e))}
}
async function joinRoom(){
  const nick=($('#nick').value||'').trim().slice(0,16);if(!nick){toast('Pick a nickname first.');$('#nick').focus();return}
  const c=($('#jcode').value||'').trim().toUpperCase();if(c.length!==4){toast('Room codes are 4 letters.');return}
  setNick(nick);
  try{await NET.join(c);
    const res=await locked(c,d=>{
      if(!d)return{err:'No room with that code.'};
      if(d.players.some(p=>p.id===uid))return{ok:1};
      if(d.phase!=='lobby')return{err:'That game has already been dealt.'};
      if(d.players.length>=5)return{err:'That room is full (5 players).'};
      d.players.push({id:uid,nick});d.v=(d.v||0)+1;return{doc:d};
    });
    if(res.err){toast(res.err);return}
    enter(c);
  }catch(e){toast(e.message==='busy'?'Room is busy, try again.':writeErr(e))}
}
function enter(c){
  leave(true);mode='online';code=c;screen='table';G=null;swaps={};mergedDeal=0;
  unsub=db.doc('games/'+c).onSnapshot(snap=>{
    if(!snap.exists){toast('That room has closed.');leave();return}
    const d=clone(snap.data());
    if(G&&G.code===d.code&&(d.v||0)<(G.v||0))return;
    G=d;me=G.players.findIndex(p=>p.id===uid);
    if(G.phase==='swap'&&G.deal!==mySwapDeal&&me>=0){mySwap=clone(G.seats[me]);mySwapDeal=G.deal;myReady=false;swapSel=null}
    maybeMerge();render();scheduleBot();
  },()=>{toast('Lost the connection to this room.')});
  unsubSwap=db.collection('games/'+c+'/swap').onSnapshot(qs=>{
    swaps={};qs.docs.forEach(d=>swaps[d.id]=d.data());maybeMerge();if(G&&G.phase==='swap')render();
  },()=>{});
}
function leave(silent){
  unsub&&unsub();unsubSwap&&unsubSwap();unsub=unsubSwap=null;clearTimeout(botTimer);

}
const sameCards=(a,b)=>JSON.stringify([...a].sort())===JSON.stringify([...b].sort());
function maybeMerge(){
  if(mode!=='online'||!G||G.phase!=='swap'||G.host!==uid||mergedDeal===G.deal)return;
  const humans=G.players.map((p,i)=>[p,i]).filter(([p])=>!p.bot);
  for(const[p] of humans){const s=swaps[p.id];if(!s||s.deal!==G.deal||!s.ready)return}
  const N=clone(G);
  for(const[p,i] of humans){const s=swaps[p.id],o=N.seats[i];
    if(Array.isArray(s.hand)&&Array.isArray(s.up)&&s.up.length===o.up.length&&sameCards([...s.hand,...s.up],[...o.hand,...o.up])){o.hand=[...s.hand];o.up=[...s.up]}}
  mergedDeal=G.deal;commit(startPlay(N));
}

/* ---------- Actions ---------- */
function onCard(el){
  const z=el.dataset.z;
  if(!G)return;
  if(G.phase==='swap'){
    const S=mode==='online'?mySwap:G.seats[0];
    if(!S||myReady||(z!=='hand'&&z!=='up'))return;
    const c=el.dataset.c;
    if(!swapSel||swapSel.z===z){swapSel=swapSel&&swapSel.c===c?null:{z,c};render();return}
    const h=z==='hand'?c:swapSel.c,u=z==='up'?c:swapSel.c;
    S.hand[S.hand.indexOf(h)]=u;S.up[S.up.indexOf(u)]=h;sortHand(S.hand);swapSel=null;render();return;
  }
  if(G.phase!=='play'||G.turn!==me)return;
  const s=G.seats[me],src=source(s);
  if(z!==src){toast(src==='hand'?'Play from your hand first.':src==='up'?'Play your face-up cards first.':'');return}
  if(z==='down'){commit(doBlind(G,me,+el.dataset.i));return}
  const c=el.dataset.c,r=rk(c);
  if(!canPlay(r,G.pile)){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');RG.sfx('error');toast(SET.hints?`Can't play a ${lab(r)}. Need: ${needText(G.pile)}.`:`A ${lab(r)} won't go on that.`);return}
  if(SET.quick!=='off'){commit(doPlay(G,me,sel.has(c)?[...sel]:[c]));return}
  if(sel.size&&rk([...sel][0])!==r)sel.clear();
  sel.has(c)?sel.delete(c):sel.add(c);render();
}

  if(mode==='local'){commit(startPlay(clone(G)));return}

}

    <p class="note">Friends open ${G.host===uid?'this game':'the game'} in EveryGame Offline™, tap Join and enter the code.${G.host===uid?' Keep this screen open while you play: your phone is hosting the room.':''}</p></div>
    <div class="panel"><div class="label">Players ${G.players.length}/5</div>
    <ul class="plist">${G.players.map((p,i)=>`<li><span>${esc(p.nick)}${p.id===uid?' <span class="muted">(you)</span>':''}${p.id===G.host?' <span class="muted">· host</span>':''}${p.bot?' <span class="muted">· computer</span>':''}</span>
      ${host&&p.bot?`<button class="ghost" data-act="rmbot" data-i="${i}">Remove</button>`:''}</li>`).join('')}</ul>
    ${host&&G.players.some(p=>p.bot)?`<div class="label">Computer players</div><div class="seg">${[['easy','Easy'],['normal','Normal'],['hard','Hard']].map(([v,l])=>`<button data-act="lvl" data-v="${v}" aria-pressed="${(G.level||'normal')===v}">${l}</button>`).join('')}</div>`:''}
    ${host?`<div class="actions"><button class="ghost" data-act="addbot" ${G.players.length>=5?'disabled':''}>Add computer player</button>
      <button class="btn" data-act="start" ${G.players.length<2?'disabled':''}>Deal</button></div>
      ${G.players.length>=5?'<p class="note">Five players: two decks get shuffled together.</p>':''}`:'<p class="note">Waiting for the host to deal.</p>'}
    </div></section>`;
}
function oppHTML(i){
  const p=G.players[i],s=G.seats[i],out=G.out.indexOf(i);
  const slots=[0,1,2].map(k=>(k<s.down.length||k<s.up.length)?`<div class="slotmini">${k<s.down.length?cardHTML('',{back:1,mini:1}):''}${k<s.up.length?cardHTML(s.up[k],{mini:1,cls:'up'}):''}</div>`:'').join('');
  return `<div class="opp${G.phase==='play'&&G.turn===i?' turn':''}${out>=0?' out':''}">
    <div class="name"><span>${esc(p.nick)}</span><span>${out>=0?`Out ${ord(out+1)}`:G.phase==='play'&&G.turn===i?(p.bot?'Thinking…':'Their turn'):''}</span></div>
    <div class="tc">${slots||'<span class="count">No table cards</span>'}</div>
    <div class="count">${s.hand.length} in hand · ${s.down.length} blind</div></div>`;
}
const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
function tableHTML(){
  const n=G.players.length,others=[];
  for(let k=1;k<n;k++)others.push((Math.max(me,0)+k)%n);
  if(me<0)others.unshift(0);
  const top=G.pile.slice(-4);
  const pile=G.pile.length?top.map((c,k)=>cardHTML(c,{cls:(rk(c)==='8'&&effTop(G.pile)?'ghosted ':'')+(k===top.length-1?'drop':''),attrs:` style="transform:translate(${(k-top.length+1)*7}px,${(k-top.length+1)*-3}px) rotate(${((c.charCodeAt(1)+k*7)%9)-4}deg)"`})).join(''):'<div class="empty">Empty pile</div>';
  const turnName=G.phase==='play'?(G.turn===me?'Your turn':`${esc(nm(G,G.turn))}'s turn`):G.phase==='swap'?'Swap phase':'Game over';
  return `<section class="table">
    <div class="opps">${others.map(oppHTML).join('')}</div>
    <div class="centre">${deckHTML()}<div class="pile">${pile}</div>
      <div><div class="label">${turnName}</div><div class="need">${G.phase==='swap'?'Set up your table':SET.hints?esc(needText(G.pile)):G.pile.length?`On the pile: ${word(rk(G.pile[G.pile.length-1]))}`:'Empty pile'}</div>
      <div class="stats"><span>Pile ${G.pile.length}</span><span>Burned ${G.burned}</span></div>
      <ul class="log">${G.log.slice(0,3).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div></div>
    ${me>=0?mineHTML():'<p class="muted">You\'re watching this game.</p>'}
  </section>`;
}
function mineHTML(){
  const swap=G.phase==='swap';
  const s=swap?(mode==='online'?mySwap:G.seats[0]):G.seats[me];
  if(!s)return'';
  const myTurn=G.phase==='play'&&G.turn===me,src=source(s),out=G.out.indexOf(me);
  const legal=myTurn?legalRanks(G,me):[];
  const clickHand=swap&&!myReady||myTurn&&src==='hand';
  const slots=[0,1,2].map(k=>{
    const d=k<s.down.length,u=k<s.up.length;if(!d&&!u)return'';
    const dClick=myTurn&&src==='down';
    const uClick=swap&&!myReady||myTurn&&src==='up';
    return `<div class="slot">${d?cardHTML('',{back:1,cls:dClick?'clickable':'',attrs:dClick?` data-z="down" data-i="${k}" tabindex="0" role="button" aria-label="Flip blind card ${k+1}"`:''}):''}
      ${u?cardHTML(s.up[k],{cls:'up'+(uClick?' clickable':'')+(sel.has(s.up[k])||swapSel?.c===s.up[k]?' sel':'')+(SET.hints&&myTurn&&src==='up'&&!canPlay(rk(s.up[k]),G.pile)?' dim':''),attrs:uClick?` data-z="up" data-c="${s.up[k]}" tabindex="0" role="button"`:''}):''}</div>`;
  }).join('');
  const hand=s.hand.length?s.hand.map(c=>cardHTML(c,{cls:(clickHand?'clickable':'')+(sel.has(c)||swapSel?.c===c?' sel':'')+(SET.hints&&myTurn&&src==='hand'&&!canPlay(rk(c),G.pile)?' dim':''),attrs:clickHand?` data-z="hand" data-c="${c}" tabindex="0" role="button"`:''})).join(''):`<span class="empty">${src==='up'?'Hand empty. Play your face-up cards.':src==='down'?'Down to the blind cards. Tap one to flip it.':'No cards in hand.'}</span>`;
  let flag,acts='';
  if(swap){
    flag=myReady?'Ready. Waiting for the others…':'Tap a hand card, then a face-up card, to swap them';
    if(!myReady)acts=`<button class="btn" data-act="ready">Ready</button>`;
  }else if(out>=0)flag=`You're out, ${ord(out+1)}. Nice.`;
  else if(myTurn){
    if(src==='down'){flag='Your turn: flip a blind card'}
    else if(!legal.length){flag='Nothing you can play';acts=`<button class="btn" data-act="pickup">Pick up the pile (${G.pile.length})</button>`}
    else if(SET.quick!=='off'){if(sel.size>1){flag=`Your turn: tap the group to play ${sel.size} × ${lab(rk([...sel][0]))}`;acts=`<button class="ghost" data-act="ungroup">Split the group</button>`}else flag='Your turn: tap a card to play it, or drag matching cards together'}
    else{flag=`Your turn: ${sel.size?`play ${sel.size} × ${lab(rk([...sel][0]))}`:'pick your cards'}`;
      const r=sel.size?rk([...sel][0]):null,more=r&&s[src].filter(c=>rk(c)===r).length>sel.size;
      acts=`${more?`<button class="ghost" data-act="all">Select all ${lab(r)}s</button>`:''}<button class="btn" data-act="play" ${sel.size?'':'disabled'}>Play${sel.size?` ${sel.size} card${sel.size>1?'s':''}`:''}</button>`}
  }else flag=G.phase==='play'?`Waiting for ${esc(nm(G,G.turn))}`:'';
  if(myTurn&&G.phase==='play'&&out<0)acts=`<button class="ghost" data-act="hint">Hint</button>`+acts;
  if(swap&&!myReady)acts=`<button class="ghost" data-act="swaphint">Suggest a swap</button>`+acts;
  return `<div class="mine${myTurn?' turn':''}"><div class="head"><span class="turnflag">${flag}</span><span class="count">${s.hand.length} in hand · ${s.up.length} up · ${s.down.length} blind</span></div>
    <div class="slots">${slots}</div><div class="hand" aria-label="Your hand">${hand}</div>${acts?`<div class="actions">${acts}</div>`:''}</div>`;
}
function settingsHTML(){
  const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${String(SET[k])===v}">${l}</button>`).join('')}</div>`;
  return `<div class="overlay" data-act="close"><div class="sheet" data-stop><h2>Settings</h2>
    <div class="label">Hints</div>${seg('hints',[['true','On'],['false','Off']])}<p class="note">Hints show what you need to beat and grey out cards that won't go.</p>
    <div class="label">Tapping a card</div>${seg('quick',[['one','Plays it'],['off','Selects it']])}<p class="note">Plays it: drag matching cards onto each other to group them, then tap the group to play them together. Selects it: pick cards, then press Play.</p>
    <div class="label">Computer speed</div>${seg('speed',[['slow','Slow'],['normal','Normal'],['fast','Fast']])}
    <p class="note">Settings are saved on this device.</p><button class="btn" data-act="close">Done</button></div></div>`;
}
function overlay(){
  const ov=$('#ov');let h='';
  if(setOpen)h=settingsHTML();
  else if(rulesOpen)h=`<div class="overlay" data-act="close"><div class="sheet" data-stop><h2>House rules</h2>
    <ol><li>Everyone gets 3 blind cards face down, 3 face up on top, and 3 in hand. The rest is the deck. Two decks with 5 players.</li>
    <li>After you play, draw back up to 3 cards while the deck lasts. You only hold more than 3 after picking up the pile.</li>
    <li>Before play, swap any hand cards with your face-up cards.</li>
    <li>Lowest card in hand starts. Play one or more cards of the same rank, equal to or higher than the pile. Order: 3 up to King, Ace, then 2.</li>
    <li>To play several of the same rank, drag them onto each other, then tap the group.</li>
    <li>Can't play? Pick up the whole pile.</li>
    <li>Empty hand: play your face-up cards. Then flip blind cards one at a time. A blind card that won't go means you pick up the pile with it.</li></ol>
    <div class="label">Power cards</div>
    <ul><li><b>2</b> goes on anything; anything goes on it.</li><li><b>7</b> goes on anything; next must be 7 or lower, or a power card.</li>
    <li><b>8</b> goes on anything and is invisible: the card beneath still counts.</li><li><b>10</b> goes on anything, burns the pile, and you go again.</li>
    <li>Four of the same rank in a row burns the pile, and you go again.</li></ul>
    <p class="note">First out wins. The last player still holding cards is the Shed.</p>
    <button class="btn" data-act="close">Got it</button></div></div>`;
  else if(G&&G.phase==='over'&&mode&&screen==='table'){
    const canAgain=mode==='local'||G.host===uid;
    h=`<div class="overlay"><div class="sheet"><h2>${G.shed===me?'You\'re the Shed':G.out[0]===me?'You won':'Game over'}</h2>
    <ol>${G.out.map(i=>`<li>${esc(nm(G,i))}${i===me?' (you)':''}</li>`).join('')}</ol>
    ${G.shed!=null?`<p><b>${esc(nm(G,G.shed))}</b> is the Shed.</p>`:''}
    <div class="actions">${canAgain?'<button class="btn" data-act="again">Deal again</button>':'<p class="note">Waiting for the host to deal again.</p>'}<button class="ghost" data-act="leave">Leave</button></div></div></div>`;
  }
  ov.innerHTML=h;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(justDragged)return;
  const card=e.target.closest('.card[data-z]');if(card){onCard(card);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(e.target.closest('[data-stop]')&&b.dataset.act==='close'&&b.tagName!=='BUTTON')return;
  const a=b.dataset.act;
  if(a==='rules'){rulesOpen=true;overlay()}
  else if(a==='close'){rulesOpen=false;setOpen=false;overlay()}
  else if(a==='settings'){setOpen=true;overlay()}
  else if(a==='set'){const k=b.dataset.k,v=b.dataset.v;SET[k]=k==='hints'?v==='true':v;saveSet();sel.clear();render()}
  else if(a==='bots'){nBots=+b.dataset.n;render()}
  else if(a==='lvl'){if(mode==='online')hostEdit(d=>{if(d.phase!=='lobby')return null;d.level=b.dataset.v;return d});else{level=b.dataset.v;try{localStorage.setItem('shed.level',level)}catch(e){}render()}}
  else if(a==='local')startLocal();
  else if(a==='resume'){const g=savedLocal();if(g){mode='local';me=0;code=null;screen='table';G=g;render();scheduleBot()}}
  else if(a==='create')createRoom();
  else if(a==='join')joinRoom();
  else if(a==='leave'){if(mode==='online')leave();else{clearTimeout(botTimer);mode=null;G=null;screen='home';render()}}
  else if(a==='copy'){navigator.clipboard?.writeText(G.code).then(()=>toast('Code copied'),()=>toast('Code: '+G.code))}
  else if(a==='addbot')hostEdit(d=>{if(d.players.length>=5||d.phase!=='lobby')return null;const used=d.players.map(p=>p.nick);const n=BOTNAMES.find(x=>!used.includes(x))||'Bot';d.players.push({id:'bot-'+Date.now().toString(36),nick:n,bot:true});return d});
  else if(a==='rmbot')hostEdit(d=>{const i=+b.dataset.i;if(!d.players[i]?.bot)return null;d.players.splice(i,1);return d});
  else if(a==='start')hostEdit(d=>d.players.length>=2&&d.host===uid?deal(d):null);
  else if(a==='ready')ready();
  else if(a==='play'&&sel.size)commit(doPlay(G,me,[...sel]));
  else if(a==='all'){const r=rk([...sel][0]),s=G.seats[me];s[source(s)].filter(c=>rk(c)===r).forEach(c=>sel.add(c));render()}
  else if(a==='ungroup'){sel.clear();render()}
  else if(a==='hint'){const h=suggest();
    if(h.type==='play'){sel=new Set(h.cards);render();toast(`Hint: play ${h.cards.length>1?`your ${h.cards.length} × ${lab(h.rank)}`:`a ${lab(h.rank)}`}. ${SET.quick!=='off'?'Tap it to play.':'Press Play.'}`)}
    else if(h.type==='pickup')toast('Nothing will go on that. Pick up the pile.');else toast('Flip any blind card. It\'s down to luck now.')}
  else if(a==='swaphint'){const S=mode==='online'?mySwap:G.seats[0];if(S){botSwap(S);sortHand(S.hand);swapSel=null;render();toast('Your strongest cards are now face up: 10s, 2s, 8s first, then high cards.')}}
  else if(a==='pickup')commit(doPickup(G,me));
  else if(a==='again')again();
});
/* Drag matching cards together to group them */
let drag=null,justDragged=false;
function canGroup(el){if(!G||G.phase!=='play'||G.turn!==me||SET.quick==='off')return false;const z=el.dataset.z;return z!=='down'&&z===source(G.seats[me])}
function targetAt(x,y,src){const el=document.elementFromPoint(x,y)?.closest('.card[data-z]');return el&&el!==src&&el.dataset.z===src.dataset.z&&el.dataset.c?el:null}
function clearTargets(){document.querySelectorAll('.droptarget').forEach(x=>x.classList.remove('droptarget'))}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.card[data-z]');if(el&&canGroup(el))drag={el,x:e.clientX,y:e.clientY,id:e.pointerId,ghost:null}});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.ghost){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    const g=drag.el.cloneNode(true);g.className='card dragghost'+(drag.el.classList.contains('red')?' red':'');document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging')}
  e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  clearTargets();const t=targetAt(e.clientX,e.clientY,drag.el);if(t)t.classList.add('droptarget');
},{passive:false});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!d.ghost)return;
  d.ghost.remove();clearTargets();justDragged=true;setTimeout(()=>justDragged=false,60);
  const t=cancel?null:targetAt(e.clientX,e.clientY,d.el);
  if(t){const a=d.el.dataset.c,b=t.dataset.c;
    if(rk(a)!==rk(b)){toast(`Only matching cards group together. Drag a ${lab(rk(a))} onto another ${lab(rk(a))}.`)}
    else{if(sel.size&&rk([...sel][0])!==rk(a))sel.clear();sel.add(a);sel.add(b)}}
  render();
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-z]')){e.preventDefault();onCard(e.target)}
  if(e.key==='Escape'&&(rulesOpen||setOpen)){rulesOpen=false;setOpen=false;overlay()}
  if(e.key==='Enter'&&e.target.id==='jcode')joinRoom();
});
render();initCaps();
</script>
<!--PARTY--><script>
/* Party launch: #party-host-CODE-NAME opens the room with that code; #party-join-CODE-NAME joins it (retrying while the host sets up) */
(()=>{const m=(location.hash||"").match(/^#party-(host|join)-([A-Z]{4})-(.+)$/);if(!m)return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  const [,role,code,raw]=m,nick=decodeURIComponent(raw).slice(0,16);
  const go=async()=>{const n=document.getElementById('nick');if(!n)return setTimeout(go,200);n.value=nick;
    if(role==='host'){const orig=randCode;randCode=()=>code;try{await createRoom()}finally{randCode=orig}return}
    const j=document.getElementById('jcode');if(j)j.value=code;let tries=0;
    const attempt=async()=>{if(mode==='online')return;const jj=document.getElementById('jcode');if(jj)jj.value=code;const nn=document.getElementById('nick');if(nn)nn.value=nick;
      try{await joinRoom()}catch(e){}if(mode!=='online'&&++tries<10)setTimeout(attempt,2500)};
    setTimeout(attempt,1800)};
  setTimeout(go,300)})();
</script>
