<!doctype html><html lang="en-GB" data-game="perfectseason"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d16"><meta name="color-scheme" content="dark"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EveryGame"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}input,textarea{-webkit-user-select:text;user-select:text}body{background:#0b0d16}</style></head><body>
<title>Perfect Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;700&display=swap">
<style>
/* Perfect Season: spin a franchise and a decade, draft a starting five, chase 82-0. Arena-at-night look. */
:root{--bg:#0b0d16;--panel:#141828;--panel2:#1b2036;--line:rgba(255,255,255,.12);--text:#f5f6ff;--muted:#9aa3c7;
  --hot:#ff7a1a;--hot2:#ffb347;--good:#3ddc84;--mid:#ffd34d;--bad:#ff5a6e;--wood:#c98b4e;--wood2:#b97a3f;
  --display:'Lilita One','Arial Black',sans-serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,sans-serif;color-scheme:dark}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1d3f 0,var(--bg) 60%);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:max(8px,env(safe-area-inset-top,0px)) 12px max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--hot2);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
header{display:flex;align-items:center;gap:8px}
.wm{font:400 clamp(21px,6.6vw,27px)/1 var(--display);letter-spacing:.4px;white-space:nowrap;text-shadow:0 3px 0 #3b1a00,0 0 20px rgba(255,122,26,.35)}
.wm b{font-weight:400;color:var(--hot)}
.grow{flex:1}
.hb{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:8px;font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar .rd{color:var(--text)}.bar .rd b{color:var(--hot2);font-weight:800}
.pips{display:flex;gap:4px}.pips i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.on{background:var(--hot)}
.tag{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}
/* slot machine */
.mach{background:linear-gradient(#1b1f33,#10131f);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.reels{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.reel{position:relative;height:64px;overflow:hidden;border-radius:12px;background:#070910;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 8px 14px rgba(0,0,0,.8),inset 0 -8px 14px rgba(0,0,0,.8)}
.reel .lab{position:absolute;top:4px;left:8px;z-index:2;font:800 10px var(--cond);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:64px;display:flex;align-items:center;justify-content:center;padding:12px 8px 0;box-sizing:border-box;text-align:center;font:400 clamp(15px,4.6vw,20px)/1.05 var(--display);letter-spacing:.3px}
.cell.era{font-size:clamp(20px,6vw,26px);color:var(--hot2)}
.reel.done{border-color:rgba(255,179,71,.6);box-shadow:inset 0 8px 14px rgba(0,0,0,.8),0 0 0 2px rgba(255,122,26,.25)}
.ctl{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}
.spin{background:linear-gradient(#ff8f2e,#e85d00);border-radius:12px;padding:12px;font:400 20px var(--display);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 4px 0 #8a3600,0 8px 18px rgba(255,122,26,.35)}
.spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8a3600}
.re{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font:800 12px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.re small{font-weight:700;font-size:10px;color:var(--muted);letter-spacing:.1em}
.re.used small{color:var(--bad)}
/* court */
.court{position:relative;aspect-ratio:1/0.82;border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.4);
  background:repeating-linear-gradient(90deg,var(--wood) 0 22px,var(--wood2) 22px 23px,#cf9356 23px 46px,var(--wood2) 46px 47px);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.court svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0}
.jer{width:72%;aspect-ratio:1/1.08;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.slot .pl{font:800 clamp(11px,3.2vw,13px)/1.05 var(--cond);text-align:center;background:rgba(10,12,22,.82);color:#fff;padding:2px 6px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.slot .sub{font:700 10px var(--cond);color:#2a1606;letter-spacing:.06em;text-transform:uppercase}
.slot.open .jer{opacity:.55}
.slot.pick{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.slot.oop .pl{box-shadow:inset 0 -2px 0 var(--mid)}
/* roster */
.roster{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rh .sw{width:10px;height:34px;border-radius:4px}
.rh h3{margin:0;font:400 18px/1.05 var(--display)}
.rh p{margin:2px 0 0;font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.th,.row{display:grid;grid-template-columns:minmax(0,1fr) 30px repeat(5,minmax(28px,34px));gap:2px;align-items:center;padding:0 10px}
.th{font:800 10px var(--cond);letter-spacing:.12em;color:var(--muted);padding-top:6px;padding-bottom:4px;text-transform:uppercase}
.th span,.row .n{text-align:right}
.row{min-height:44px;width:100%;background:none;text-align:left;border-top:1px solid rgba(255,255,255,.05)}
.row:hover{background:rgba(255,255,255,.04)}
.row.sel{background:rgba(255,122,26,.13)}
.row.gone{opacity:.35}
.row .nm{font:700 15px/1.1 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;font:700 11px var(--cond);color:var(--muted);letter-spacing:.06em}
.row .ps{font:800 12px var(--cond);text-align:center;background:rgba(255,255,255,.08);border-radius:5px;padding:2px 0}
.row .n{font:700 14px var(--cond);font-variant-numeric:tabular-nums}
.row .n.top{color:var(--hot2)}
.place{display:flex;gap:6px;padding:6px 10px 10px;background:rgba(255,122,26,.13);flex-wrap:wrap;align-items:center}
.place span{font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.place button{flex:1;min-width:52px;padding:8px 4px;border-radius:9px;font:800 14px var(--cond);letter-spacing:.06em;background:var(--panel2);border:1.5px solid var(--line)}
.place button[data-f="0"]{border-color:var(--good);color:var(--good)}
.place button[data-f="1"]{border-color:var(--mid);color:var(--mid)}
.place button[data-f="2"],.place button[data-f="3"],.place button[data-f="4"]{border-color:var(--bad);color:var(--bad)}
.hint{padding:12px;text-align:center;color:var(--muted);font:700 14px var(--cond);letter-spacing:.04em}
.foot{font:600 11px var(--body);color:var(--muted);text-align:center;opacity:.8}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,5,12,.78);display:grid;place-items:center;padding:14px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.sheet{width:min(100%,460px);background:linear-gradient(#1a1e33,#11142a);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:calc(100vh - 28px);overflow:auto;box-sizing:border-box}
.sheet h2{margin:0 0 8px;font:400 26px var(--display);text-align:center}
.sheet h2 b{color:var(--hot);font-weight:400}
.sheet ol{padding-left:20px;margin:8px 0;line-height:1.45}
.sheet li{margin:4px 0}
.btns{display:grid;gap:8px;margin-top:12px}
.big{padding:13px;border-radius:12px;font:400 18px var(--display);letter-spacing:.04em;background:var(--panel2);border:1.5px solid var(--line)}
.big.hot{background:linear-gradient(#ff8f2e,#e85d00);border:0;box-shadow:0 4px 0 #8a3600}
.big small{display:block;font:700 12px var(--cond);letter-spacing:.06em;opacity:.85;margin-top:2px}
.stat{display:flex;justify-content:center;gap:14px;font:700 13px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
.stat b{color:var(--text);font-size:16px}
.rec{text-align:center;font:400 clamp(54px,18vw,78px)/1 var(--display);font-variant-numeric:tabular-nums;margin:6px 0 0;text-shadow:0 4px 0 #3b1a00,0 0 28px rgba(255,122,26,.45)}
.rec.perfect{color:var(--hot2)}
.verd{text-align:center;font:800 16px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--hot2)}
.dots{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin:12px 0}
.dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.08);transition:background .1s}
.dots i.w{background:var(--good)}.dots i.l{background:var(--bad)}
.meters{display:grid;gap:7px;margin:10px 0}
.meter{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.meter .t{height:9px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--hot),var(--hot2))}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.five{display:grid;gap:4px;margin-top:8px}
.five div{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font:600 14px var(--body);padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.five .s{font:800 12px var(--cond);color:var(--hot2)}
.five small{font:700 12px var(--cond);color:var(--muted)}
.five .oop{color:var(--mid)}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);z-index:60;opacity:0;pointer-events:none;font:400 26px var(--display);background:linear-gradient(#ff8f2e,#e85d00);padding:10px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (prefers-reduced-motion:reduce){.slot.pick{animation:none}}
</style>
<div id="app">
  <header><div class="wm">Perfect <b>Season</b></div><div class="grow"></div><span id="snd"></span><button class="hb" id="rulesBtn">Rules</button><button class="hb" id="newBtn">New</button></header>
  <div class="bar"><span class="rd" id="rd"></span><span class="pips" id="pips"></span><span class="grow"></span><span class="tag" id="mode"></span></div>
  <div class="mach">
    <div class="reels">
      <div class="reel" id="rT"><span class="lab">Franchise</span><div class="strip"></div></div>

    </div>
    <div class="ctl"><button class="spin" id="spinBtn">SPIN</button><button class="re" id="reT">Team<small>1 respin</small></button><button class="re" id="reE">Era<small>1 respin</small></button></div>
  </div>
  <div class="court" id="court"></div>
  <div class="roster" id="roster"></div>
  <p class="foot">Real per-game stats from Basketball-Reference (via sumitrodatta/bball-reference-datasets). Records are era-adjusted projections, not predictions.</p>
</div>
<div id="ov"></div><div class="toast" id="toast"></div>
<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}

  const t0=performance.now();let last=-1;
  await new Promise(res=>{function step(){const t=(performance.now()-t0)/ms;if(t>=1){res();return}
    const m=new DOMMatrixReadOnly(getComputedStyle(strip).transform),i=Math.floor(-m.m42/H);if(i!==last){last=i;RG.sfx('tick')}requestAnimationFrame(step)}step()});

  else if(kind==='era'){e=pickEra(f,r,e);G.reE--}
  RG.sfx(kind==='spin'?'shuffle':'flip');

  const pT=both?roll($('#rT'),ALLT(),teamLabel(f,e),'',1500):Promise.resolve();

  const canRe=!busy&&G.phase==='pick';
  $('#reT').disabled=!canRe||G.reT<1;$('#reE').disabled=!canRe||G.reE<1||(G.spin&&Object.keys(DB[G.spin.f]).length<2);
  $('#reT').classList.toggle('used',G.reT<1);$('#reE').classList.toggle('used',G.reE<1);
  $('#reT small').textContent=G.reT?'1 respin':'used';$('#reE small').textContent=G.reE?'1 respin':'used';
  $('#court').innerHTML=courtHTML();$('#roster').innerHTML=rosterHTML();
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1300)}
function put(slot){
  const s=DB[G.spin.f][G.spin.e],p=s.p[selP];
  G.team.push({p,s:slot,f:G.spin.f,e:G.spin.e});RG.sfx(dist(p,slot)?'place':'swish');RG.buzz(12);
  if(dist(p,slot)>1)toast('Out of position');
  selP=null;G.round++;G.phase=G.round>=5?'done':'spin';
  if(G.phase==='spin'){G.spin=null}
  render();if(G.phase==='done')setTimeout(finish,500);
}

/* ---------- the season ---------- */
function finish(){
  const w=wins(G.team),T=totals(G.team);
  G.result={w,T};
  if(G.mode==='daily'){daily[G.date]={w,five:G.team.map(t=>[t.p[0],t.s,t.f,t.e])};sv('daily',daily)}
  stats.games++;stats.total+=w;stats.best=Math.max(stats.best,w);if(w===82)stats.perfect++;sv('stats',stats);
  ov='end';overlay(true);
}
function streak(){let n=0,d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(daily[k]){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}return n}
function verdict(w){return w===82?'Perfect season':w>=73?'Greatest team ever':w>=65?'Title favourites':w>=55?'Contenders':w>=45?'Playoff team':w>=35?'Play-in hopefuls':w>=25?'Lottery bound':'Full tank mode'}
function seasonDots(w,seed){const r=rng(seed),idx=[...Array(82).keys()];for(let i=81;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}const L=new Set(idx.slice(0,82-w));return [...Array(82)].map((_,i)=>L.has(i)?'l':'w')}
function overlay(anim){
  let h='';
  if(ov==='rules'||ov==='start'){
    const dd=daily[today()];
    h=`<div class="ov"><div class="sheet" role="dialog" aria-label="How to play"><h2>Perfect <b>Season</b></h2>
    <ol><li><b>Spin</b> for a franchise and a decade, from the 1960s to the 2020s.</li>
    <li>Draft <b>one player</b> from that roster and put him in an open slot: <b>PG, SG, SF, PF or C</b>.</li>
    <li>You get <b>one team respin</b> and <b>one era respin</b> per game. Use them wisely.</li>
    <li>Five picks make your starting five. We project an <b>82-game record</b> from real per-game points, rebounds, assists, steals and blocks.</li>
    <li>Stats are <b>era-adjusted</b>, so 1960s numbers are scaled to the modern game. Balance matters: five scorers fight over one ball, and players out of position lose value.</li></ol>
    <div class="btns">${ov==='start'?`<button class="big hot" data-o="daily">${dd?'Today’s daily: '+dd.w+'–'+(82-dd.w):'Daily challenge'}<small>${dd?'Already played. See your five':'Same spins for everyone today'}</small></button><button class="big" data-o="free">Free play<small>Fresh random spins</small></button>`:`<button class="big hot" data-o="close">Got it</button>`}</div>
    <div class="stat"><span>Best <b>${stats.best}–${82-stats.best}</b></span><span>Games <b>${stats.games}</b></span><span>Daily streak <b>${streak()}</b></span></div></div></div>`;
  }else if(ov==='end'){
    const{w,T}=G.result,dots=seasonDots(w,G.seed);
    const m=(lab,v,max)=>`<div class="meter"><span>${lab}</span><span class="t"><i style="width:${Math.min(100,v/max*100).toFixed(0)}%"></i></span><b>${v.toFixed(0)}</b></div>`;
    h=`<div class="ov"><div class="sheet" role="dialog" aria-label="Season result"><div class="verd">Projected record</div>
    <div class="rec${w===82?' perfect':''}" id="recN">${anim?'0–0':w+'–'+(82-w)}</div><div class="verd">${verdict(w)}</div>
    <div class="dots" id="dots">${dots.map(c=>`<i class="${anim?'':c}"></i>`).join('')}</div>
    <div class="meters">${m('Scoring',T[0],125)}${m('Rebounding',T[1],55)}${m('Playmaking',T[2],32)}${m('Defence',(T[3]+T[4])*10,80)}</div>
    <div class="five">${G.team.slice().sort((a,b)=>a.s-b.s).map(t=>`<div><span class="s">${POS[t.s]}</span><span>${t.p[0]} <small>${t.e}s ${t.f}</small></span><small class="${dist(t.p,t.s)?'oop':''}">${dist(t.p,t.s)?t.p[1]+' playing '+POS[t.s]:t.p[1]}</small></div>`).join('')}</div>
    <div class="btns"><button class="big hot" data-o="again">Play again</button><button class="big" data-o="share">Copy result</button><button class="big" data-o="close">View court</button></div></div></div>`;
  }
  $('#ov').innerHTML=h;
  if(ov==='end'&&anim)animateSeason();
}
async function animateSeason(){
  const{w}=G.result,dots=seasonDots(w,G.seed),is=[...document.querySelectorAll('#dots i')];let W=0,L=0;
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  for(let i=0;i<82;i++){if(!$('#recN'))return;dots[i]==='w'?W++:L++;is[i].className=dots[i];$('#recN').textContent=W+'–'+L;if(!rm&&i%3===0){RG.sfx(dots[i]==='w'?'tick':'clack');await sleep(28)}}
  RG.sfx(w===82?'fanfare':w>=55?'cheer':w>=35?'good':'lose');if(w>=65)RG.buzz(30);
}
function shareText(){const{w}=G.result;return `Perfect Season ${G.mode==='daily'?G.date+' ':''}🏀 ${w}–${82-w}\n`+G.team.slice().sort((a,b)=>a.s-b.s).map(t=>`${POS[t.s]} ${t.p[0]} (${t.e}s ${t.f})`).join('\n')}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const o=e.target.closest('[data-o]');
  if(o){const v=o.dataset.o;RG.sfx('click');
    if(v==='close'){ov=null;overlay()}
    else if(v==='free'){ov=null;overlay();newGame('free')}
    else if(v==='daily'){ov=null;overlay();const dd=daily[today()];newGame('daily');
      if(dd){G.team=dd.five.map(([n,s,f,er])=>({p:DB[f][er].p.find(p=>p[0]===n),s,f,e:er})).filter(t=>t.p);G.round=5;G.phase='done';render();G.result={w:wins(G.team),T:totals(G.team)};ov='end';overlay()}}
    else if(v==='again'){ov='start';overlay()}
    else if(v==='showend'){ov='end';overlay()}
    else if(v==='share'){try{await navigator.clipboard.writeText(shareText());o.textContent='Copied'}catch(err){o.textContent='Copy failed'}}
    return}
  if(busy||!G)return;
  const r=e.target.closest('[data-p]');if(r&&G.phase==='pick'){const i=+r.dataset.p;selP=selP===i?null:i;RG.sfx('tap');render();
    const pl=document.querySelector('.place');pl&&pl.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  const u=e.target.closest('[data-put]');if(u&&selP!=null)return put(+u.dataset.put);
  const sl=e.target.closest('[data-slot]');if(sl&&selP!=null&&openSlots().includes(+sl.dataset.slot))return put(+sl.dataset.slot);
});
$('#spinBtn').onclick=()=>doSpin('spin');
$('#reT').onclick=()=>doSpin('team');
$('#reE').onclick=()=>doSpin('era');
$('#rulesBtn').onclick=()=>{RG.sfx('open');ov='rules';overlay()};
$('#newBtn').onclick=()=>{if(busy)return;RG.sfx('click');ov='start';overlay()};
fillStrip($('#rT'),['?'],'');fillStrip($('#rE'),['?'],'era');
newGame('free');ov='start';overlay();
</script>

/* Back to all games: sits at the start of the game's header; floats top-left on screens without one */
(function(){
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
</script><!--/EGBACK-->
