<!doctype html><html lang="en-GB" data-game="casino"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f1a"><meta name="color-scheme" content="dark"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EveryGame"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}input,textarea{-webkit-user-select:text;user-select:text}body{background:#0a0f1a}</style></head><body>
<title>Rio's Casino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-time card room. Lacquered navy walls, brass fittings, a marquee sign; each game sits on its own table surface (baize, wheel, rail, turf). */
:root{
  --ink:#0d1120; --wall:#151b30; --panel:#1b2340; --line:rgba(216,178,106,.28);
  --brass:#d8b26a; --brass-hi:#f3d89a; --cream:#f3ead8; --muted:#9aa1ba;
  --oxblood:#9b2639; --baize:#1d5a46; --baize-dk:#123b2e; --turf:#2f7a3f;
  --win:#6fdc9a; --lose:#ff7d7d; --red:#c8323f; --black:#16181f;
  --display:'Limelight','Didot','Bodoni 72',Georgia,serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(120% 60% at 50% -10%,#24305a 0%,transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:grid;gap:18px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.wallet{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:#0a0e1a;box-shadow:inset 0 0 0 1px var(--line);font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.wallet .chip{width:22px;height:22px}
.wallet b{color:var(--brass-hi);font-weight:500}
.wallet.flash{animation:wflash .6s}
@keyframes wflash{40%{box-shadow:inset 0 0 0 2px var(--win),0 0 18px rgba(111,220,154,.4)}}
.wallet.flashl{animation:wflashl .6s}
@keyframes wflashl{40%{box-shadow:inset 0 0 0 2px var(--lose)}}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 18px;border-radius:10px;font:600 15px var(--body);background:var(--brass);color:#1c1406;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);text-align:center;user-select:none}
.btn:hover{background:var(--brass-hi)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--brass)}
.btn.red{background:var(--oxblood);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn:focus-visible,.tile:focus-visible,.spot:focus-visible,.chipbtn:focus-visible{outline:3px solid var(--brass-hi);outline-offset:2px}
.link{all:unset;cursor:pointer;color:var(--brass);font-weight:600;font-size:14px}
.link:hover{color:var(--brass-hi)}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
small.muted{font-size:13px}

/* marquee sign */
.sign{position:relative;text-align:center;padding:26px 16px 22px;border-radius:18px;background:linear-gradient(#1d2544,#121830);box-shadow:inset 0 0 0 2px #3a2f17,inset 0 0 0 6px #0c1020,inset 0 0 0 8px var(--brass)}
.sign h1{font:400 clamp(38px,9vw,74px)/1 var(--display);letter-spacing:.02em;color:var(--cream);text-shadow:0 0 18px rgba(243,216,154,.35),0 3px 0 #000;text-wrap:balance}
.sign p{margin:10px 0 0;color:var(--muted);font-size:14px}
.bulbs{position:absolute;inset:7px;pointer-events:none;border-radius:13px}
.bulbs i{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe9b0;box-shadow:0 0 8px #ffcf6a;animation:bulb 1.6s infinite steps(1)}
@keyframes bulb{50%{background:#6b5a35;box-shadow:none}}

/* lobby */
.lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;min-height:230px;padding:16px;border-radius:16px;overflow:hidden;isolation:isolate;box-shadow:inset 0 0 0 1px var(--line);transition:transform .18s}
.tile:hover{transform:translateY(-4px)}
.tile .art{height:110px;border-radius:10px;margin:-4px -4px 4px;position:relative;overflow:hidden}
.tile h2{font:400 26px/1.05 var(--display);letter-spacing:.01em}
.tile p{margin:0;color:#cfd3e2;font-size:14px}
.tile .tag{margin-top:auto;font:500 12px var(--mono);color:var(--brass);letter-spacing:.04em}
.t-bj{background:linear-gradient(160deg,#1f6650,#103a2d)}
.t-ru{background:linear-gradient(160deg,#4a1621,#22090f)}
.t-pk{background:linear-gradient(160deg,#1e2b52,#0f1530)}
.t-hr{background:linear-gradient(160deg,#2d5a2a,#163015)}
.cards-mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:0}
.cards-mini .card{transform:rotate(var(--r)) translateY(var(--y,0));margin:0 -14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.stat span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:500 20px var(--mono);font-variant-numeric:tabular-nums;color:var(--cream)}
.cashier{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.cashier p{margin:0;max-width:60ch}
.foot{font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}

/* table surfaces */
.table{position:relative;border-radius:22px;padding:18px 16px;background:radial-gradient(120% 90% at 50% 20%,var(--baize) 0%,var(--baize-dk) 85%);box-shadow:inset 0 0 0 10px #3b2412,inset 0 0 0 12px #6b4423,0 18px 40px rgba(0,0,0,.45);display:grid;gap:14px}
.table h2{font:400 24px var(--display)}
.felt-text{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:rgba(243,234,216,.55);text-align:center}
.hand{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:96px}
.hand.center{justify-content:center}
.hlabel{display:flex;align-items:center;gap:8px;font:600 14px var(--body)}
.pill{font:500 13px var(--mono);padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.35);color:var(--cream);font-variant-numeric:tabular-nums}
.pill.win{background:#1f6b45;color:#dfffe9}.pill.lose{background:#6b1f2a;color:#ffe3e6}.pill.push{background:#4a4a5c}

/* playing cards */
.card{width:62px;height:88px;border-radius:7px;background:#fbf7ee;color:#16181f;position:relative;box-shadow:0 2px 0 #cfc6b3,0 6px 12px rgba(0,0,0,.35);flex:none;font-family:var(--body);animation:deal .28s ease-out both}
.card.red{color:var(--red)}
.card .ix{position:absolute;top:5px;left:6px;font:700 17px/1 var(--body);text-align:center}
.card .ix small{display:block;font-size:14px;margin-top:1px}
.card .ix.b{top:auto;left:auto;bottom:5px;right:6px;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.card.back{background:var(--cb,repeating-linear-gradient(45deg,#7a1d2b 0 5px,#5f1422 5px 10px));box-shadow:inset 0 0 0 3px #fbf7ee,0 6px 12px rgba(0,0,0,.35)}
.card.back::after{content:"R";position:absolute;inset:0;display:grid;place-items:center;font:400 26px var(--display);color:var(--cbf,var(--brass-hi))}
.card.sm{width:46px;height:66px}.card.sm .ix{font-size:14px}.card.sm .ix small{font-size:11px}.card.sm .pip{font-size:21px}
.card.hi{box-shadow:0 0 0 3px var(--brass-hi),0 6px 14px rgba(0,0,0,.4)}
.card.dim{filter:brightness(.55)}
@keyframes deal{from{transform:translateY(-14px) rotate(-4deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bulbs i{animation:none}.tile{transition:none}}

/* chips and betting */
.chip{display:inline-block;width:40px;height:40px;border-radius:50%;flex:none;background:var(--c,#d8b26a);box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),inset 0 0 0 7px var(--c,#d8b26a),inset 0 0 0 8px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.35);position:relative}
.chip::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.9) 0 12deg,transparent 12deg 45deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 80%,transparent 81%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 80%,transparent 81%)}
.chipbtn{all:unset;cursor:pointer;display:grid;place-items:center;position:relative}
.chipbtn .chip{width:52px;height:52px}
.chipbtn b{position:absolute;font:500 12px var(--mono);color:#fff;text-shadow:0 1px 2px #000;z-index:1}
.chipbtn.on .chip{transform:translateY(-4px);box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),inset 0 0 0 7px var(--c),0 0 0 3px var(--brass-hi),0 6px 10px rgba(0,0,0,.4)}
.chipbtn[disabled]{opacity:.3;pointer-events:none}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.betline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.betamt{font:500 22px var(--mono);font-variant-numeric:tabular-nums;color:var(--brass-hi);min-width:6ch;text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.msg{min-height:26px;text-align:center;font-weight:600}
.msg.win{color:var(--win)}.msg.lose{color:var(--lose)}
.hint{padding:10px 14px;border-radius:10px;background:rgba(6,10,20,.6);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;max-width:62ch;margin:0 auto}
.hint b{color:var(--brass-hi)}
.lvl{display:inline-flex;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.lvl button{all:unset;cursor:pointer;padding:7px 12px;font:600 13px var(--body);color:var(--muted)}
.lvl button[aria-pressed="true"]{background:var(--brass);color:#1c1406}

/* roulette */
.wheelbox{display:grid;place-items:center}
#wheel{width:min(300px,78vw);height:auto;aspect-ratio:1;max-width:100%}
.board{overflow-x:auto;padding-bottom:4px}
.grid{display:grid;grid-template-columns:42px repeat(12,minmax(34px,1fr)) 44px;grid-template-rows:repeat(3,40px) 40px 40px;gap:3px;min-width:560px}
.spot{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;place-items:center;border-radius:5px;font:600 14px var(--body);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.spot.r{background:var(--red)}.spot.k{background:var(--black)}.spot.z{background:#11804f}
.spot.o{background:rgba(0,0,0,.22);font-size:13px}
.spot:hover{box-shadow:inset 0 0 0 2px var(--brass-hi)}
.spot.hit{box-shadow:inset 0 0 0 3px #fff,0 0 14px #fff}
.spot .stack{position:absolute;right:-4px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:500 9px var(--mono);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 2px 4px rgba(0,0,0,.5);z-index:2;pointer-events:none;text-shadow:0 1px 1px #000}
.history{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.history i{font:500 12px var(--mono);font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}

/* poker */
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seat{padding:10px;border-radius:12px;background:rgba(0,0,0,.28);display:grid;gap:6px;justify-items:center;text-align:center;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.seat.turn{box-shadow:inset 0 0 0 2px var(--brass-hi)}
.seat.out{opacity:.45}
.seat .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.seat .st{font:500 13px var(--mono);color:var(--brass-hi)}
.seat .act{font-size:12px;color:#d6dcef;min-height:18px}
.dealer{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font:700 11px var(--body)}
.board5{display:flex;gap:6px;justify-content:center;min-height:88px;flex-wrap:wrap}
.pot{text-align:center;font:500 16px var(--mono);color:var(--brass-hi)}
.me{display:grid;gap:10px;justify-items:center}
.raise{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.raise input[type=range]{width:min(260px,60vw);accent-color:var(--brass)}
.log{max-height:120px;overflow:auto;font-size:13px;color:#c9cfe2;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px}
.log p{margin:0}

/* racing */
.racecard{display:grid;gap:6px}
.runner{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.runner:hover{box-shadow:inset 0 0 0 1px var(--brass)}
.runner.pick{box-shadow:inset 0 0 0 2px var(--brass-hi);background:rgba(216,178,106,.12)}
.runner .silk{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:700 13px var(--body);color:#fff;text-shadow:0 1px 2px #000}
.runner .nm{font-weight:700;min-width:0}
.runner .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.runner .odds{font:500 16px var(--mono);color:var(--brass-hi)}
.runner .mybet{font:500 12px var(--mono);color:var(--win)}
#track{width:100%;height:auto;display:block;border-radius:14px;max-width:100%}
.comm{min-height:24px;text-align:center;font-style:italic;color:#e9f3df}
.seg{display:inline-flex;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font:600 13px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1c1406}
.results{display:grid;gap:4px}
.results div{display:flex;gap:10px;align-items:center;font-size:14px}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,7,14,.72);display:grid;place-items:center;padding:16px}
.sheet>div{background:var(--panel);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.6);padding:20px;width:min(560px,100%);max-height:85vh;overflow:auto;display:grid;gap:10px}
.sheet h3{font:400 24px var(--display)}
.sheet ul{margin:0;padding-left:20px;display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#0a0e1a;box-shadow:inset 0 0 0 1px var(--brass);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center}
@media (max-width:560px){.seats{grid-template-columns:repeat(3,minmax(0,1fr))}.card{width:52px;height:74px}.card .pip{font-size:24px}.card .ix{font-size:15px}.seat .card.sm{width:34px;height:48px}.seat .card.sm .pip{font-size:15px}.seat .card.sm .ix{font-size:11px;top:3px;left:4px}.seat .card.sm .ix small{font-size:9px}.seat .card.sm .ix.b{display:none}}

/* profile, avatars, shop */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.av{display:inline-block;width:var(--s);height:var(--s);flex:none;border-radius:50%;box-shadow:0 0 0 2px rgba(216,178,106,.7),0 3px 8px rgba(0,0,0,.35);vertical-align:middle}
.av svg{display:block;width:100%;height:100%}
.hlabel .av,.seat .nm .av{margin-right:4px}
.profile{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.profile .av{box-shadow:0 0 0 3px var(--brass),0 6px 16px rgba(0,0,0,.4)}
.pinfo{flex:1;min-width:200px;display:grid;gap:6px}
.pinfo input{all:unset;font:400 26px var(--display);color:var(--cream);border-bottom:1.5px dashed var(--line);padding:2px 0;max-width:100%;width:12ch}
.pinfo input:focus{border-bottom-color:var(--brass)}
.lvl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lvl-row b{color:var(--brass-hi);font:500 15px var(--mono)}
.xpbar{flex:1;min-width:120px;height:10px;border-radius:999px;background:#0a0e1a;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{display:grid;justify-items:center;gap:8px;padding:14px 10px;border-radius:14px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-align:center}
.item.on{box-shadow:inset 0 0 0 2px var(--brass-hi)}
.item b{font-size:14px}
.item .card{width:62px;height:88px}
.felt{width:96px;height:64px;border-radius:14px;box-shadow:inset 0 0 0 5px #3b2412,inset 0 0 0 6px #6b4423}
.shop .bar h2{font:400 24px var(--display)}
.croupier{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.bubble{position:relative;background:var(--cream);color:#1c1406;font-weight:700;font-size:14px;padding:6px 12px;border-radius:12px}
.bubble::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:var(--cream)}
.croupier.spin .av{animation:toss .6s ease-in-out 3}
@keyframes toss{30%{transform:rotate(-14deg) translateY(-4px)}60%{transform:rotate(10deg)}}
.wheelbox{display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.croupier.spin .av{animation:none}}
/* ===== The Daily Stock: a trading terminal on the casino floor ===== */
.t-st{background:linear-gradient(160deg,#16243f,#0b1222)}
.stk{display:grid;gap:12px;--up:#3ecf8e;--dn:#ff5d6c}
.stk .up{color:var(--up)}.stk .dn{color:var(--dn)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.fine{font-size:12.5px;margin:0}
.sh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;padding:16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.sh p{margin:6px 0 0;max-width:60ch;font-size:14px}
.tkr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tkr b{font:500 30px var(--mono);letter-spacing:.04em;color:var(--brass-hi)}
.tkr span{font:400 22px var(--display)}
.quote{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.quote b{font:500 34px var(--mono);line-height:1}
.quote span{font-size:15px}.quote small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctabs{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.readout{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:18px;padding:0 4px}
.readout b{color:var(--cream);font-weight:500}.readout b.up{color:var(--up)}.readout b.dn{color:var(--dn)}

  const eqKey={av:"avatar",cb:"back",fe:"felt"};
  function render(){
    const items=SHOP[tab].items,cur=W[eqKey[tab]]||items[0].id;
    el.innerHTML=`<section class="table shop" style="background:radial-gradient(120% 90% at 50% 10%,#2a3460,#121830 85%)" aria-label="Shop">

    $$("[data-tab]",el).forEach(b=>b.onclick=()=>{tab=b.dataset.tab;confirmId=null;RG.sfx("click");render()});

  /* data <-> screen. x unit: intraday = tick, daily = slot offset from the last bar */
  function toScr(pt){const g=cv._geo;const slot=g.intra?pt.x/g.ch:pt.x+(DAY.hist.length-1);return{x:g.L+(slot-g.vs)*g.cw+g.cw/2,y:g.top+(g.hi-pt.p)/(g.hi-g.lo)*g.ph}}
  function toData(P){const g=cv._geo;const slot=(P.x-g.L-g.cw/2)/g.cw+g.vs;return{x:g.intra?slot*g.ch:slot-(DAY.hist.length-1),p:g.hi-(P.y-g.top)/g.ph*(g.hi-g.lo)}}
  function local(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
  function zoomAt(px0,f){const g=cv._geo;if(!g)return;const slot=(px0-g.L)/g.cw+g.vs;
    if(g.intra){const v=VP.intra,ch=g.ch,i=S.phase==="pre"?0:tickNow(),n=Math.max(ch*8,Math.min(DAY.T*1.1,v.tn*f)),c0=v.follow?Math.min(slot*ch,i):slot*ch;v.t0=c0-(c0-v.t0)*n/v.tn;v.tn=n;clampIntra()}

  /* keep the intraday view on traded time: at most 30% of it can be empty future */

  function hitTest(P){const its=items();for(let j=its.length-1;j>=0;j--){const d=its[j],A=toScr(d.a),B=toScr(d.b),near=(Q)=>Math.hypot(Q.x-P.x,Q.y-P.y)<12;

  function wireChart(){if(!cv)return;

      if(PTS.size===2){const [a,b]=[...PTS.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2};drag=null;return}

  function toolsHTML(){const T=[["pan","✥","Move and select"],["line","╱","Trend line"],["hline","─","Horizontal line"],["box","▭","Box"]];

  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
</script><!--/EGBACK-->
