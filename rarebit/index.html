<style>
/* Layout: full-screen pixel-art cross-section of the earth on canvas; HUD pinned top, answer bar pinned bottom, results float over the rock. Deliberately single dark theme: you are underground. */

}

.px>*{position:relative}
.prompt{position:absolute;left:0;right:0;margin:0 auto;top:calc(76px + var(--safe-t));width:min(540px,calc(100% - 2*var(--gut)));padding:0;transition:top var(--dur-2) var(--ease-out);box-shadow:none;filter:drop-shadow(0 10px 0 rgba(5,8,14,.35))}

function texture(k,row,t,pu){
  const r=rng(row*131+k*7),y0=sy(row),hh=4*pu,n=Math.ceil(W/42),z=Z[k];
  for(let i=0;i<n;i++){const x=r()*W,y=y0+r()*hh,s=1+r()*2.5,q=r();
    switch(k){
      case 0: if(q<.05){cx.strokeStyle="rgba(150,120,80,.45)";cx.lineWidth=1;cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(x+6,y+6,x+r()*12-6,y+14);cx.stroke()}else{cx.fillStyle=z.hi;cx.globalAlpha=.6;cx.fillRect(x,y,s,s*.8);cx.globalAlpha=1}break;
      case 1: cx.fillStyle=z.hi;cx.globalAlpha=.35;cx.fillRect(x,y,10+s*5,1.2);cx.globalAlpha=1;break;
      case 2: if(q<.025){cx.fillStyle="#4b4740";ell(x,y,6,3.5,q*40);cx.fill()}else if(q<.04){cx.strokeStyle="#8f877a";cx.lineWidth=1.3;cx.beginPath();for(let a=0;a<13;a+=.4){const rr=a*.75;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.stroke()}else{cx.fillStyle="#a59d8e";cx.globalAlpha=.35;cx.fillRect(x,y,s,s);cx.globalAlpha=1}break;
      case 3: if(q<.14){cx.fillStyle="#6a4626";cx.globalAlpha=.55;cx.fillRect(x,y,30+r()*40,1);cx.globalAlpha=1}else if(q<.17){cx.fillStyle=`rgba(255,204,77,${.4+.5*Math.abs(Math.sin(t/500+i))})`;cx.fillRect(x,y,2,2)}else{cx.fillStyle=z.hi;cx.globalAlpha=.5;cx.fillRect(x,y,s,s);cx.globalAlpha=1}break;
      case 4: {const c=["#c99a8f","#16161b","#d9d6d0","#8a8d97"][Math.floor(q*4)];for(let j=0;j<3;j++){cx.fillStyle=c;cx.fillRect(x+j*7*r(),y+r()*6,s*1.2,s*1.2)}}break;
      case 5: cx.fillStyle="rgba(255,120,40,.10)";ell(x+Math.sin(t/2600+i+row)*10,y,6+s*4,3+s*2);cx.fill();cx.fillStyle="rgba(20,6,2,.35)";cx.fillRect(x,y,s,s);break;
      case 6: {const x2=((x+t*.03*(1+q))%(W+80))-40;cx.fillStyle="rgba(255,210,130,.35)";cx.fillRect(x2,y,22+s*12,2)}break;
      case 7: cx.strokeStyle="rgba(150,80,0,.22)";cx.lineWidth=1;hexa(x,y,5+s);cx.stroke();break;
    }}
}

function lg(x0,y0,x1,y1,stops){const g=cx.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rg(x,y,r0,r1,stops){const g=cx.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function seg(pts,w,c){cx.strokeStyle=c;cx.lineWidth=w;cx.lineCap="round";cx.lineJoin="round";cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke()}
function drawAnt(t,moving){
  const ph=moving?t/70:0, idle=moving?0:Math.sin(t/420);
  const dark="#1b0b06",mid="#4a2414";
  // legs: tripod gait. pairs attach at thorax
  const att=[[-24,1],[-28,0],[-32,-1]];
  for(let j=0;j<3;j++)for(const sd of [-1,1]){
    const phase=ph+(j%2===0?0:Math.PI)+(sd>0?Math.PI:0);
    const sw=Math.sin(phase)*(moving?6:0), lift=Math.max(0,Math.cos(phase))*(moving?2:0);
    const [ay]=att[j],base=[sd*3,ay];
    const knee=[sd*(12+lift),ay+(j===0?6:j===1?-2:-9)+sw*.4];
    const foot=[sd*(19-lift*.5),ay+(j===0?16:j===1?2:-18)+sw];
    seg([base,knee],2.2,dark);seg([knee,foot],1.5,dark);seg([foot,[foot[0]+sd*2.5,foot[1]+(j===0?3:j===2?-3:1)]],1,dark);
  }
  // antennae: scape then elbowed funiculus, curving ahead of the head
  for(const sd of [-1,1]){const tw=moving?Math.sin(ph*2+sd)*2:idle*1.6*sd;
    seg([[sd*3,-14],[sd*9,-11],[sd*(13+tw),-2],[sd*(12+tw),6]],1.3,dark)}
  // mandibles
  const m=moving?Math.abs(Math.sin(ph*1.4))*2.5:.6;
  for(const sd of [-1,1]){cx.fillStyle=dark;cx.beginPath();cx.moveTo(sd*2,-5);cx.quadraticCurveTo(sd*(5+m),-1,sd*(1+m*.4),2);cx.lineTo(sd*1,-2);cx.closePath();cx.fill()}
  // head
  cx.fillStyle=rg(-2,-14,1,9,[[0,"#7a3a22"],[.6,mid],[1,dark]]);ell(0,-11,6.5,7.2);cx.fill();
  cx.fillStyle="#0a0503";ell(-5,-13,1.6,2.4,.3);cx.fill();ell(5,-13,1.6,2.4,-.3);cx.fill();
  // thorax (mesosoma)
  cx.fillStyle=lg(-5,0,5,0,[[0,dark],[.45,"#6b3420"],[1,dark]]);
  cx.beginPath();cx.moveTo(0,-18);cx.bezierCurveTo(6,-20,5,-30,3,-34);cx.bezierCurveTo(2,-37,-2,-37,-3,-34);cx.bezierCurveTo(-5,-30,-6,-20,0,-18);cx.fill();
  // petiole node
  cx.fillStyle=mid;ell(0,-38.5,2.2,2.4);cx.fill();
  // gaster with segment bands and sheen
  const gy=-52+(moving?Math.sin(ph*2)*.6:idle*.4);
  cx.fillStyle=rg(-3,gy-4,1,13,[[0,"#8a4426"],[.5,"#4e2414"],[1,"#1b0b06"]]);ell(0,gy,9,12.5);cx.fill();
  cx.strokeStyle="rgba(0,0,0,.35)";cx.lineWidth=1;for(let b=0;b<3;b++){cx.beginPath();cx.ellipse(0,gy+5-b*5,8.3-b*.6,3,0,0,Math.PI);cx.stroke()}
  cx.fillStyle="rgba(255,220,190,.35)";ell(-3.5,gy-4,2,4,-.3);cx.fill();
}

  cx.fillStyle="#efebe3";ell(-10.5,-31,1.6,1);cx.fill();ell(10.5,-31,1.6,1);cx.fill();
  cx.fillStyle="#0a0908";ell(0,-.5,2.6,2);cx.fill();
}

function drawProbe(t,moving,sp){

function drawDigger(k,x,y,t,moving){
  const s=Math.max(.8,Math.min(1.2,H/860));const sp=moving?2.4:0;
  cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle="rgba(0,0,0,.28)";ell(0,2,k<2?10:24,3);cx.fill();
  if(k===0){cx.scale(1.25,1.25);drawAnt(t,moving)}
  else if(k===1)drawBadger(t,moving);
  else if(k===2)drawTBM(t,moving,sp);
  else if(k===3)drawRig(t,moving,sp);
  else if(k===4)drawSuperdeep(t,moving,sp);
  else if(k===5)drawPod(t,moving,sp);
  else drawProbe(t,moving,sp);
  cx.restore();
}

  <div class="row"><button class="btn" id="startpack">Start digging</button><button class="btn ghost" data-go="title">Surface</button></div></section></div></div>`}
function howView(){const nq=IDX?IDX.questions.length:0,na=IDX?IDX.questions.reduce((s,m)=>s+m.n,0):0;
  return `<div class="sheet"><div class="sheet-in"><section class="card how"><h3 style="margin:0">How to play</h3><ol>
  <li>Each prompt has a bank of accepted answers${nq?` - ${fmt(nq)} questions and ${fmt(na)} answers in all`:""}. Tap “What counts?” for the exact rules of a question.</li>
  <li>You get ${SECS} seconds to lock in one answer. The rarer it is, the deeper your digger goes. Each prompt starts again from the surface.</li>
  <li>Six tiers: Obvious 10, Fool's Gold 15 (sounds clever, but lots of people say it), Solid 30, Rare 60, Deep Cut 85, and Rarebit 100 - standout answers picked by our editors.</li>
  <li>Close misspellings get a suggestion and don't use a try. Wordplay questions are stricter about spelling.</li>
  <li>The daily dig has ${PER_DAY} prompts from different subjects and ${TRIES} tries each. Practice runs until you lose 3 lives, by pack.</li>
  <li>Think a real answer was missed? Tap “Should it count?” to report it. Approved answers go live for everyone.</li>
  <li><b>About the numbers.</b> Until enough people have played a question, its rarity is an estimate from editors' judgement, word frequency and dataset popularity. Once 30 or more answers have been given, real answer counts from earlier days take over. Player counts and the “better than” graph only ever use real players.</li></ol>
  ${tiersHTML()}</section>
  ${IDX&&IDX.credits?`<section class="card"><div class="eyebrow"><span>Data sources</span><span>With thanks</span></div><p class="muted">${IDX.credits.map(c=>`${esc(c.name)} (${esc(c.licence)})`).join(" · ")}</p></section>`:""}
  <section class="card"><div class="eyebrow"><span>The journey down</span><span>Real depths</span></div>${journeyHTML(null)}<p class="muted">Depths and facts are real. The picture isn't to scale.</p></section>
  <div class="row"><button class="btn" data-go="daily">Start today's dig</button>${OWNER?`<button class="btn ghost" data-go="editor">Review reports</button>`:""}<button class="btn ghost" data-go="title">Surface</button></div></div></div>`}
function revealView(){
  const pk=picksNow(),pick=pk[pk.length-1];
  const last=game.mode==="daily"&&game.rec.done;
  const u=uOf(pick),z=Z[zoneIdx(Math.min(u,END.u-1))];
  const no=game.mode==="daily"?String(pk.length).padStart(2,"0")+" / "+String(PER_DAY).padStart(2,"0"):"#"+String(game.i+1).padStart(2,"0");
  const rq=`<div class="rq"><span>${no}</span><q>${esc(qText(pick.q))}</q></div>`;
  const meter=pick.t?`<div class="meter" role="img" aria-label="Rarity ${TIERS.indexOf(pick.t)+1} of ${TIERS.length}: ${T[pick.t].n}">${TIERS.map((t,k)=>`<i style="--c:var(--t${t});--k:${k}" class="${t<=pick.t?"on":""}${t===pick.t?" me":""}"></i>`).join("")}</div><div class="meterl" aria-hidden="true"><span>${T[TIERS[0]].n}</span><span>${T[TIERS[TIERS.length-1]].n}</span></div>`:"";
  const res=pick.t?`<div class="res" style="--tc:var(--t${pick.t});color:var(--t${pick.t})">${rq}<div class="rhead"><span class="glyph">${glyph(pick.t)}</span><div><div class="tierword">${T[pick.t].n}</div><div class="ansq">“${esc(pick.a)}”</div></div><div class="score-chip"><b>+<span data-count="${ptsOf(pick)}">${ptsOf(pick)}</span></b><small>pts</small></div></div>${meter}<div class="rmeta">Dug ${fmtD(realDepth(u))} · ${u>=END.u?"the centre of the Earth":esc(z.name.toLowerCase())}</div>${pick.w?`<div class="why">${esc(pick.w)}</div>`:""}<div class="crowd">${esc(crowdLine(pick))}</div><div class="flv">${T[pick.t].f}</div></div>`
    :`<div class="res">${rq}<div class="tierword none">${pick.why==="Time ran out"?"Nothing dug":pick.why==="Gave up"?"Gave up":"No dig"}</div><div class="ansq">${pick.a?"“"+esc(pick.a)+"”":"—"}</div>${pick.reason?`<div class="why">${esc(pick.reason)}</div>`:""}<div class="rmeta">+0 pts · ${pick.why==="Time ran out"?"The clock beat you to it.":"Here's what was down there."}</div></div>`;
  const missed=!pick.t&&(pick.typed||game.lastMiss)&&!pick.reason;
  const fact=!pick.t?"":u>=END.u?`<div class="newzone"><h3 style="color:var(--t100);margin:0 0 4px">You reached the centre of the Earth</h3><p class="flav">6,371 km down, in the solid iron inner core. Nothing has ever been here.</p></div>`
    :`<div class="newzone"><h3 style="color:var(--cyan);margin:0 0 4px">${z.name} · ${z.dig}</h3><p class="flav">${z.fact}</p></div>`;
  const drawer=drawerOpen&&game.mode!=="daily"?`<div class="drawer"><div class="top"><h3 style="margin:0">${esc(qText(pick.q))}</h3><button class="link" id="closeins">Close ✕</button></div>${fact}${insights(pick)}<div class="row" style="justify-content:center"><button class="btn" id="next2">${last?"See results":"Next ▼"}</button></div></div>`:"";
  return `${res}<div class="actions"><button class="btn" id="next">${last?"See today's results":"Next prompt"}</button><div class="row" style="justify-content:center;gap:16px">${game.mode==="daily"?"":`<button class="link" id="ins">Answer insights ↑</button>`}${missed?`<button class="link rep" data-rep="${esc(pick.typed||game.lastMiss)}">Should “${esc(pick.typed||game.lastMiss)}” count?</button>`:""}</div></div>${drawer}${reportFor?reportView():""}`;
}
function reportView(){const r=reportFor;
  return `<div class="drawer"><div class="top"><h3 style="margin:0">Report a missing answer</h3><button class="link" id="closerep">Close ✕</button></div>
  ${r.sent?`<p class="flav">${r.sent==="sent"?"Thanks - it's in the review queue. If it's approved it counts for everyone from then on.":"Thanks - saved on this device. Sending to the shared review queue needs Contributor access to this game."}</p>`:
  `<p class="flav">“${esc(r.a)}” for <b>${esc(qText(r.q))}</b>. Our editors check reports against the question's rules before adding anything.</p>
  <label class="muted" for="repnote">Why should it count? (optional)</label><textarea id="repnote" rows="3" maxlength="280" placeholder="e.g. it's a breed recognised by the Kennel Club"></textarea>
  <div class="row"><button class="btn" id="sendrep">Send report</button></div>`}</div>`}
function editorView(){
  const list=(REPORTS||[]).filter(r=>(r.st||"new")===editorTab);
  const groups=new Map();for(const r of list){const k=r.q+"~"+norm(r.a);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
  const rows=[...groups.values()].sort((a,b)=>b.length-a.length).map(g=>{const r=g[0],p=Q(r.q);let check="";
    if(p){build(p);const hit=lookup(p,r.a),nr=nearAll(p,r.a),rej=rejected(p,r.a);
      check=hit?`Already accepted as ${esc(hit.d)} (${hit.t})`:rej?`On the reject list: ${esc(rej)}`:nr.length?`Close to: ${nr.map(x=>esc(x.d)).join(", ")}`:"No close match in the bank"}
    return `<div class="rep-item"><b>${esc(r.a)}</b> <span class="muted">for</span> ${esc(qText(r.q))} <span class="chip">${g.length} ${g.length===1?"report":"reports"}</span>
    ${g.filter(x=>x.note).slice(0,3).map(x=>`<p class="muted">“${esc(x.note)}”</p>`).join("")}<p class="muted">Check: ${check||"open the question to check"}</p>
    ${editorTab==="new"&&OWNER?`<div class="row">${[30,60,85,100].map(t=>`<button class="btn ghost small" data-ok="${esc(r.id)}" data-t="${t}">Add as ${T[t].n} (${t})</button>`).join("")}<button class="btn ghost small" data-no="${esc(r.id)}">Reject</button></div>`:""}</div>`}).join("");
  return `<div class="sheet"><div class="sheet-in"><section class="card"><div class="eyebrow"><span>Review queue</span><span>${OWNER?"Owner":"This device"}</span></div>
  <div class="row">${["new","approved","rejected"].map(t=>`<button class="btn ghost small ${editorTab===t?"on":""}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
  ${REPORTS==null?`<p class="muted">Loading reports…</p>`:rows||`<p class="muted">Nothing here.</p>`}
  <p class="muted">Approved answers are added to the live bank for everyone at once. They're also exported for the next data build, so the source files can be updated.</p></section>
  <div class="row"><button class="btn ghost" data-go="title">Surface</button></div></div></div>`}
function titleView(){const r=S.days[TODAY],done=r&&r.done,mid=r&&!done&&r.picks.length;
  const inApp=document.documentElement.dataset.game==="rarebit";
  const label=loading?"Loading":done?"See today's results":mid?"Resume today's dig":"Start today's dig";
  const meta=loading?"Fetching the answer bank":done?`${scoreOf(r.picks)} pts · deepest ${fmtD(realDepth(deepest(r.picks)))}`:mid?`Prompt ${r.picks.length+1} of ${PER_DAY} · ${scoreOf(r.picks)} pts so far`:`${PER_DAY} prompts · ${SECS} seconds each`;
  const arrow=done||loading?"":"<i></i>";
  return `<div class="topbar"><div class="grp">${inApp?`<a class="iconbtn" href="../index.html" aria-label="All games">${ICONS.grid}</a>`:""}</div><div class="grp">${done?`<button class="iconbtn" id="tshare" type="button" aria-label="Share today's result">${ICONS.share}</button>`:""}<span id="sndslot"></span></div></div>
  <div class="title"><div class="daychip"><i class="${done?"done":""}" aria-hidden="true"></i>Daily dig <b>#${dayNum(TODAY)+1}</b>${done?" · dug":mid?" · in progress":""}</div><h1 class="logo" data-t="Rarebit">Rarebit</h1><h2 class="subt"><span>The daily dig</span></h2><p class="tagl">rarer answers <b>dig deeper</b></p></div>
  <div class="start">${loadErr?`<div class="note-pop err" role="alert">${esc(loadErr)}</div>`:""}<button class="btn big" data-go="daily" ${loading?"disabled":""}><span class="cta-l">${arrow}${label}${arrow}</span><span class="cta-m">${meta}</span></button>
  <div class="sec"><button class="btn ghost" data-go="packs">Practice</button><button class="btn ghost" data-go="arch">Archive</button><button class="btn ghost" data-go="how">How to play</button>${OWNER?`<button class="btn ghost" data-go="editor">Reports</button>`:""}</div></div>`}
function render(shake){
  renderHud();
  ui.innerHTML=screen==="title"?titleView():loading&&screen!=="title"?`<div class="digbar"><span>Loading…</span></div>`:screen==="digging"?`<div class="digbar"><span id="dz">Digging</span><button class="btn ghost" id="skipdig">Skip</button></div>`:screen==="play"?playView():screen==="reveal"?revealView():screen==="summary"?summaryView():screen==="unlover"?unlOverView():screen==="arch"?archView():screen==="packs"?packsView():screen==="editor"?editorView():howView();
  wire(shake);
}
function go(v){if(loading)return;
  if(v==="daily")return startDaily(TODAY);
  if(v==="unl")return startUnl(packPick);
  if(v==="title")return goTitle();
  if(v==="packs"||v==="how"){withBank(async()=>{screen=v;game=null;digDepth=0;shown=0;camTarget=-18});return}
  if(v==="editor"){screen="editor";game=null;REPORTS=null;render();withBank(async()=>{await loadReports();await ensure([...new Set((REPORTS||[]).map(r=>r.q))].filter(id=>QM.has(id)))});return}
  screen=v;game=null;digDepth=0;shown=0;camTarget=-18;render()}
function wire(shake){
  const f=document.getElementById("f");
  if(f){const i=document.getElementById("ans");f.onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(v)submit(v)};if(!reportFor)i.focus({preventScroll:true});if(i.value)i.setSelectionRange(i.value.length,i.value.length);if(shake)i.classList.add("shake")}
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
  on("skip",()=>lock(null,"","Gave up"));on("tshare",()=>shareDay(TODAY));on("hint",()=>{const i=document.getElementById("ans");if(i)fill=i.value;hintOn=true;render()});
  on("rules",()=>{const i=document.getElementById("ans");if(i)fill=i.value;rulesOn=!rulesOn;render()});
  on("skipdig",()=>{if(dig){dig.t0=-1e9}});on("next",next);on("next2",next);on("ins",()=>{drawerOpen=true;render()});on("closeins",()=>{drawerOpen=false;render()});on("again",()=>startUnl(game.pack));
  on("review",()=>{reviewing=true;render()});
  const keepScroll=fn=>{const sh=document.querySelector(".sheet"),y=sh?sh.scrollTop:0;fn();const s2=document.querySelector(".sheet");if(s2)s2.scrollTop=y};
  const pkNow=()=>game?(game.mode==="daily"?game.rec.picks:game.picks):[];
  document.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{const k=+b.dataset.round;openRound=openRound===k?-1:k;catchF={t:0,q:"",n:100};
    const p=pkNow()[k];if(p&&!Q(p.q)&&openRound===k){loadQ(p.q).then(()=>keepScroll(render),()=>{})}keepScroll(render)});
  const panel=()=>{const el=document.getElementById("chp"),p=pkNow()[openRound];if(!el||!p)return;el.innerHTML=catchPanel(p);wirePanel()};
  const wirePanel=()=>{const p=pkNow()[openRound];if(!p)return;
    document.querySelectorAll("[data-tier]").forEach(b=>b.onclick=()=>{catchF.t=+b.dataset.tier;catchF.n=100;panel()});
    const i=document.getElementById("chq");if(i)i.oninput=()=>{catchF.q=i.value;catchF.n=100;document.getElementById("chl").innerHTML=catchList(p);wireMore()};
    wireMore()};
  const wireMore=()=>{const m=document.getElementById("chmore"),p=pkNow()[openRound];if(m&&p)m.onclick=()=>{catchF.n+=100;document.getElementById("chl").innerHTML=catchList(p);wireMore()}};
  wirePanel();on("back",()=>{reviewing=false;render()});
  on("startpack",()=>startUnl(packPick));
  on("closerep",()=>{reportFor=null;render()});
  on("sendrep",async e=>{e.currentTarget.disabled=true;const n=(document.getElementById("repnote")||{}).value||"";reportFor.sent=await sendReport(reportFor.q,reportFor.a,n);render()});
  on("copy",async e=>{const b=e.currentTarget,t=document.getElementById("sh").textContent;try{await navigator.clipboard.writeText(t);b.textContent="Copied"}catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("sh"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected, now copy"}});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>startDaily(b.dataset.day));
  document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>{packPick=b.dataset.pack;render()});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{editorTab=b.dataset.tab;render()});
  document.querySelectorAll("[data-rep]").forEach(b=>b.onclick=e=>{e.preventDefault();const id=screen==="reveal"?picksNow().slice(-1)[0].q:curId();reportFor={q:id,a:b.dataset.rep};if(screen==="play"){const i=document.getElementById("ans");if(i)fill=i.value}render()});
  document.querySelectorAll("[data-ok],[data-no]").forEach(b=>b.onclick=async()=>{const id=b.dataset.ok||b.dataset.no,r=(REPORTS||[]).find(x=>x.id===id);if(!r)return;b.disabled=true;
    const t=b.dataset.ok?+b.dataset.t:0;const ok=await decideReport(r,t);if(ok){(REPORTS||[]).filter(x=>x.q===r.q&&norm(x.a)===norm(r.a)).forEach(x=>{x.st=t?"approved":"rejected";x.tier=t})}render()});
  cd();
}
function cd(){const el=document.getElementById("cd");if(!el)return;const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((m-n)/1000);el.textContent=`Next daily dig in ${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,"0")}m.`}
setInterval(cd,30000);
render();
initShared().then(()=>{if(OWNER&&screen==="title")render()});
loadIndex().catch(()=>{});
</script>
