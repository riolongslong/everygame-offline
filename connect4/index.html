<style>
/* Layout: a chunky toy board on a deep teal table. Players strip on top, the 7×6 frame, then controls. Deliberately one dark look. */
:root{
  --bg:#06282b; --panel:#0b3a3e; --line:#155a5f; --text:#eafcf8; --muted:#8fc2bb;
  --frame:#1f7a8c; --frame-2:#155f6e; --hole:#04211f; --p1:#ff6b4a; --p1d:#c9432a; --p2:#ffc93c; --p2d:#d39b12; --win:#ffffff;
  --display:'Rubik', 'Arial Black', sans-serif; color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:15px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(80% 60% at 50% 20%,#0d4a4f 0%,transparent 70%)}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:.55em 1em;color:inherit}
button:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.wm{font-weight:900;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wm i{width:18px;height:18px;border-radius:50%;display:inline-block;background:var(--p1);box-shadow:10px 0 0 var(--p2)}
.wm b{margin-left:12px}
header .grow{flex:1}
header a{color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:transparent;color:var(--muted);font-size:13px;padding:.45em .7em;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.players{display:flex;gap:8px}
.pl{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:8px 12px;min-width:0;transition:border-color .2s}
.pl.on{border-color:var(--text)}
.pl .d{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;color:rgba(0,0,0,.55)}
.pl span{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.boardwrap{position:relative}
.arrows{display:grid;grid-template-columns:repeat(7,1fr);padding:0 3.5%;height:30px}
.arrows i{display:grid;place-items:center;opacity:0;transition:opacity .15s;font-style:normal}
.arrows i.on{opacity:1}
.arrows i::after{content:"";width:46%;max-width:34px;aspect-ratio:1;border-radius:50%;background:var(--cur);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.arrows i.hinted::after{box-shadow:0 0 0 3px #fff,0 0 18px #fff}
.board{position:relative;background:linear-gradient(var(--frame),var(--frame-2));border-radius:20px;padding:3.5%;display:grid;grid-template-columns:repeat(7,1fr);gap:2.4%;box-shadow:0 14px 0 #0c4752,0 24px 40px rgba(0,0,0,.45);touch-action:manipulation;cursor:pointer}
.cell{aspect-ratio:1;border-radius:50%;background:var(--hole);box-shadow:inset 0 5px 0 rgba(0,0,0,.45);position:relative;overflow:visible}
.disc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,4vw,20px);color:rgba(0,0,0,.45);font-weight:900}
.disc.p1{background:radial-gradient(circle at 38% 32%,#ff9a80,var(--p1) 55%,var(--p1d));box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 0 0 5px rgba(255,255,255,.08)}
.disc.p2{background:radial-gradient(circle at 38% 32%,#ffe28a,var(--p2) 55%,var(--p2d));box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 0 0 5px rgba(255,255,255,.1)}
.disc.drop{animation:drop var(--dur,.4s) cubic-bezier(.45,0,.9,.6) both}
@keyframes drop{from{transform:translateY(var(--from))}}
.disc.landed{animation:land .2s ease-out}
@keyframes land{40%{transform:scaleY(.9) translateY(4%)}}
.disc.win{box-shadow:0 0 0 4px var(--win),0 0 22px rgba(255,255,255,.8);animation:winpulse .9s ease-in-out infinite}
@keyframes winpulse{50%{transform:scale(1.07)}}
.disc .sym{display:none}
html:not([data-cb="off"]) .disc .sym{display:block}
html:not([data-cb="off"]) .pl .d::after{content:attr(data-s)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{flex:1;font-weight:700;min-width:150px}
.hintb{background:transparent;border:1.5px dashed var(--p2);color:var(--p2)}
.hintb:disabled{opacity:.4;cursor:default}
.alt{background:transparent;border:1.5px solid var(--line)}
.new{background:var(--text);color:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(2,16,18,.7);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center;box-sizing:border-box}
.sheet h2{font-size:32px;font-weight:900;margin:0}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.disc.drop,.disc.landed,.disc.win{animation:none}}

<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){
      const o=ac.createOscillator();wave(o,type);const d=stack>1?(k/(stack-1)-.5)*2*det:det;o.detune.value=d;
      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}
      o.connect(n);o.start(t);o.stop(end+.05);into.push(o)}
    const v=vol/Math.sqrt(stack);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,end);
    out=panTo(g,pan);out.connect(bus);sends(g,{echo,rev});
  }
  function noise(bus,{t,dur=.1,vol=.2,a=.002,hp=null,bp=null,bp2=null,lp=null,lp2=null,q=1,pan=0,echo=0,rev=0}){
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=noiseBuf;let n=s;
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;n.connect(fl);n=fl}
    if(bp){const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(bp,t);if(bp2)fl.frequency.exponentialRampToValueAtTime(bp2,t+dur);n.connect(fl);n=fl}
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,t+dur);n.connect(fl);n=fl}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(g);panTo(g,pan).connect(bus);sends(g,{echo,rev});s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---------- sound effects: a clean sci-fi palette (same names the games already call) ---------- */
  const B=()=>sfxBus,V=(o)=>voice(sfxBus,o),Nz=(o)=>noise(sfxBus,o);

  function startMusic(){

document.getElementById('snd').appendChild(RG.button());
const W=7,H=6,$=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('c4.'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('c4.'+k,JSON.stringify(v))}catch(e){}};
let cfg=ld('cfg',{mode:'cpu',level:'normal',first:'you'}),score=ld('score',{a:0,b:0,d:0});
let B,turn,hist,over,busy=false,ov=null,hintCol=-1,startTurn=1;
const names=()=>cfg.mode==='cpu'?['You','Computer']:['Player 1','Player 2'];
const SYM=['●','★'];

/* ---------- rules and computer player ---------- */
function newBoard(){return Array.from({length:H},()=>Array(W).fill(0))}
const rowFor=(b,c)=>{for(let r=H-1;r>=0;r--)if(!b[r][c])return r;return -1};
function winLine(b){
  const D=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=b[r][c];if(!p)continue;
    for(const[dr,dc] of D){const line=[[r,c]];for(let k=1;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=H||cc<0||cc>=W||b[rr][cc]!==p)break;line.push([rr,cc])}if(line.length===4)return{p,line}}}
  return null;
}
const full=b=>b[0].every(x=>x);
function evalWin(w,p){let s=0;const me=w.filter(x=>x===p).length,op=w.filter(x=>x===3-p).length,em=4-me-op;
  if(me===4)s+=1e5;else if(me===3&&em===1)s+=6;else if(me===2&&em===2)s+=2;if(op===3&&em===1)s-=8;return s}
function heur(b,p){let s=0;for(let r=0;r<H;r++)if(b[r][3]===p)s+=3;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    if(c<=W-4)s+=evalWin([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]],p);
    if(r<=H-4)s+=evalWin([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]],p);
    if(r<=H-4&&c<=W-4)s+=evalWin([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]],p);
    if(r>=3&&c<=W-4)s+=evalWin([b[r][c],b[r-1][c+1],b[r-2][c+2],b[r-3][c+3]],p)}
  return s}
const ORDER=[3,2,4,1,5,0,6];
function negamax(b,depth,a,bt,p){
  const w=winLine(b);if(w)return w.p===p?1e6+depth:-1e6-depth;
  if(full(b))return 0;if(depth===0)return heur(b,p)-heur(b,3-p);
  let best=-Infinity;
  for(const c of ORDER){const r=rowFor(b,c);if(r<0)continue;b[r][c]=p;const v=-negamax(b,depth-1,-bt,-a,3-p);b[r][c]=0;
    if(v>best)best=v;if(v>a)a=v;if(a>=bt)break}
  return best}
function bestMove(b,p,depth,noise=0){
  let best=-Infinity,cols=[];
  for(const c of ORDER){const r=rowFor(b,c);if(r<0)continue;b[r][c]=p;let v=-negamax(b,depth-1,-Infinity,Infinity,3-p);b[r][c]=0;v+=noise?(Math.random()-.5)*noise:0;
    if(v>best+1e-9){best=v;cols=[c]}else if(Math.abs(v-best)<1e-9)cols.push(c)}

function cpuMove(){
  const L=cfg.level;
  if(L==='easy'){ // takes a win if it sees one, otherwise plays loosely

    return bestMove(B,2,2,40)}
  if(L==='normal')return bestMove(B,2,4,6);
  return bestMove(B,2,7);
}

/* ---------- game flow ---------- */
function newGame(){
  B=newBoard();hist=[];over=null;busy=false;hintCol=-1;
  startTurn=cfg.mode==='cpu'?(cfg.first==='you'?1:cfg.first==='cpu'?2:(Math.random()<.5?1:2)):(startTurn===1&&hist.length===0?1:startTurn);
  turn=startTurn;buildBoard();render();setMsg(cfg.mode==='cpu'?(turn===1?'Your move. Tap a column.':'Computer goes first.'):`${names()[turn-1]} to play.`);

function buildBoard(){
  $('#board').innerHTML=Array.from({length:W*H},(_,i)=>`<div class="cell" data-c="${i%W}" role="gridcell"></div>`).join('');
  $('#arrows').innerHTML=Array.from({length:W},(_,c)=>`<i data-c="${c}"></i>`).join('');
}
function drop(c,who){
  const r=rowFor(B,c);if(r<0||over)return false;
  B[r][c]=turn;hist.push([r,c]);hintCol=-1;
  const cell=$('#board').children[r*W+c];const d=document.createElement('div');d.className=`disc p${turn} drop`;
  d.innerHTML=`<span class="sym">${SYM[turn-1]}</span>`;
  d.style.setProperty('--from',`-${(r+1)*112}%`);d.style.setProperty('--dur',(.18+r*.06)+'s');cell.appendChild(d);

function after(){

  if(full(B)){over={p:0};setMsg('Board full. It\'s a draw.');score.d++;sv('score',score);RG.sfx('bad');render();setTimeout(()=>{ov='end';overlay()},600);return}
  turn=3-turn;render();
  if(cfg.mode==='cpu'&&turn===2){setMsg('Computer is thinking…');setTimeout(cpu,380)}

}
function cpu(){if(over||turn!==2)return;drop(cpuMove(),'cpu')}
function play(c){if(busy||over)return;if(cfg.mode==='cpu'&&turn!==1)return;if(rowFor(B,c)<0){RG.sfx('error');return}drop(c)}
function undo(){
  if(busy||!hist.length)return;
  const steps=cfg.mode==='cpu'?(over&&over.p===1?1:(turn===1?2:1)):1;
  for(let k=0;k<steps&&hist.length;k++){const[r,c]=hist.pop();B[r][c]=0;$('#board').children[r*W+c].innerHTML='';turn=3-turn}
  if(over){over=null;$('#board').querySelectorAll('.win').forEach(e=>e.classList.remove('win'))}
  if(cfg.mode==='cpu')turn=1;RG.sfx('slide');render();setMsg('Move taken back.');
}
function hint(){if(busy||over||(cfg.mode==='cpu'&&turn!==1))return;hintCol=bestMove(B,turn,6);RG.sfx('hint');render();setMsg(`Try column ${hintCol+1}.`)}
function setMsg(m){$('#msg').textContent=m}
function render(){
  const n=names(),cur=turn===1?'var(--p1)':'var(--p2)';
  document.documentElement.style.setProperty('--cur',cur);
  $('#players').innerHTML=[1,2].map(p=>`<div class="pl${!over&&turn===p?' on':''}"><i class="d" data-s="${SYM[p-1]}" style="background:var(--p${p})"></i><span>${n[p-1]}</span><b>${p===1?score.a:score.b}</b></div>`).join('');
  [...$('#arrows').children].forEach((a,c)=>{a.classList.toggle('hinted',c===hintCol);a.classList.toggle('on',c===hintCol)});
  $('#hint').disabled=!!over||(cfg.mode==='cpu'&&turn!==1);$('#undo').disabled=!hist.length;
  const seg=(k,l)=>`<div class="seg">${l.map(([v,t])=>`<button data-k="${k}" data-v="${v}" aria-pressed="${cfg[k]===v}">${t}</button>`).join('')}</div>`;
  $('#opts').innerHTML=seg('mode',[['cpu','Vs computer'],['two','Two players']])+(cfg.mode==='cpu'?seg('level',[['easy','Easy'],['normal','Normal'],['hard','Hard']])+seg('first',[['you','You start'],['cpu','It starts'],['random','Random']]):'');
}
function overlay(){
  let h='';
  if(ov==='end'){const p=over.p,n=names();const t=p===0?"It's a draw":cfg.mode==='cpu'?(p===1?'You win!':'Computer wins'):`${n[p-1]} wins!`;
    h=`<div class="overlay"><div class="sheet"><h2>${t}</h2><p>${n[0]} ${score.a} · ${n[1]} ${score.b} · draws ${score.d}</p><div class="row"><button class="new" data-a="again">Play again</button><button class="alt" data-a="close">Look at the board</button></div></div></div>`}

/* hover preview */
$('#board').addEventListener('pointermove',e=>{const c=e.target.closest('.cell');if(!c||busy||over)return;[...$('#arrows').children].forEach((a,i)=>a.classList.toggle('on',i==c.dataset.c||i===hintCol))});

document.addEventListener('click',e=>{

newGame();

  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
</script><!--/EGBACK-->
