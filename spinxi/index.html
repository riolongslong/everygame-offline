<!doctype html><html lang="en-GB" data-game="spinxi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06120c"><meta name="color-scheme" content="dark"><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EveryGame"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}input,textarea{-webkit-user-select:text;user-select:text}body{background:#06120c}</style></head><body>
<title>Spin XI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;700&display=swap">
<style>
/* Spin XI: spin a league or nation, draft a real XI into your formation, then survive the Gauntlet. */
:root{--bg:#06120c;--panel:#0e1f17;--panel2:#152c21;--line:rgba(255,255,255,.12);--text:#f2fff7;--muted:#93b8a3;
  --lime:#c6ff3d;--lime2:#8fe000;--good:#3ddc84;--mid:#ffd34d;--bad:#ff5a6e;
  --display:'Lilita One','Arial Black',sans-serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,sans-serif;color-scheme:dark}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#123826 0,var(--bg) 60%);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:max(8px,env(safe-area-inset-top,0px)) 12px max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
header{display:flex;align-items:center;gap:8px}
.wm{font:400 clamp(21px,6.6vw,27px)/1 var(--display);letter-spacing:.4px;white-space:nowrap;text-shadow:0 3px 0 #02200f,0 0 20px rgba(198,255,61,.3)}
.wm b{font-weight:400;color:var(--lime)}
.grow{flex:1}
.hb{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font:700 13px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:8px;font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar .rd{color:var(--text)}.bar .rd b{color:var(--lime);font-weight:800}
.tag{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);font-size:11px}
.ovr{font:400 16px var(--display);color:var(--lime);letter-spacing:.02em}
.ovr small{font:800 11px var(--cond);color:var(--muted);letter-spacing:.1em;margin-right:4px}
.mach{background:linear-gradient(#13291e,#0a1711);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.reels{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
.reel{position:relative;height:64px;overflow:hidden;border-radius:12px;background:#030a06;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 8px 14px rgba(0,0,0,.8),inset 0 -8px 14px rgba(0,0,0,.8)}
.reel .lab{position:absolute;top:4px;left:8px;z-index:2;font:800 10px var(--cond);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:64px;display:flex;align-items:center;justify-content:center;padding:12px 8px 0;box-sizing:border-box;text-align:center;font:400 clamp(15px,4.4vw,19px)/1.05 var(--display);letter-spacing:.3px}
.cell.a{color:var(--lime)}
.reel.done{border-color:rgba(198,255,61,.55);box-shadow:inset 0 8px 14px rgba(0,0,0,.8),0 0 0 2px rgba(198,255,61,.2)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.spin{background:linear-gradient(#d4ff5c,#86d600);color:#0b2a05;border-radius:12px;padding:12px;font:400 20px var(--display);letter-spacing:.06em;box-shadow:0 4px 0 #3f6b00,0 8px 18px rgba(198,255,61,.25)}
.spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #3f6b00}
.re{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font:800 12px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.re small{font-weight:700;font-size:10px;color:var(--muted);letter-spacing:.1em}
.pitch{position:relative;aspect-ratio:1/1.08;border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.4);box-shadow:0 10px 26px rgba(0,0,0,.5);
  background:repeating-linear-gradient(180deg,#2f8a3c 0 9.09%,#38994a 9.09% 18.18%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:19%;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0}
.shirt{width:56%;aspect-ratio:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.slot .pl{font:800 clamp(10px,3vw,12px)/1.05 var(--cond);background:rgba(4,14,9,.85);padding:2px 5px;border-radius:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.slot .pl b{color:var(--lime);margin-right:3px}
.slot .sub{font:800 10px var(--cond);color:rgba(255,255,255,.85);letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.slot.oop .pl b{color:var(--mid)}
.slot.pick{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
.roster{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rh .sw{width:10px;height:34px;border-radius:4px}
.rh h3{margin:0;font:400 18px/1.05 var(--display)}
.rh p{margin:2px 0 0;font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rh button{margin-left:auto}
.th,.row{display:grid;grid-template-columns:minmax(0,1fr) 34px 30px 38px;gap:4px;align-items:center;padding:0 10px}
.th{font:800 10px var(--cond);letter-spacing:.12em;color:var(--muted);padding-top:6px;padding-bottom:4px;text-transform:uppercase}
.th span{text-align:center}
.row{min-height:44px;width:100%;background:none;text-align:left;border-top:1px solid rgba(255,255,255,.05)}
.row:hover{background:rgba(255,255,255,.04)}
.row.sel{background:rgba(198,255,61,.1)}
.row .nm{font:700 15px/1.1 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;font:700 11px var(--cond);color:var(--muted);letter-spacing:.06em}
.row .ps{font:800 12px var(--cond);text-align:center;background:rgba(255,255,255,.08);border-radius:5px;padding:2px 0}
.row .ag{font:700 13px var(--cond);text-align:center;color:var(--muted)}
.row .rt{font:400 17px var(--display);text-align:center;border-radius:7px;padding:3px 0;color:#08200a}
.place{display:flex;gap:6px;padding:6px 10px 10px;background:rgba(198,255,61,.1);flex-wrap:wrap;align-items:center}
.place span{font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.place button{flex:1;min-width:58px;padding:7px 4px;border-radius:9px;font:800 13px/1.1 var(--cond);letter-spacing:.06em;background:var(--panel2);border:1.5px solid var(--line)}
.place button i{display:block;font-style:normal;font-size:11px;opacity:.85}
.place button[data-f="0"]{border-color:var(--good);color:var(--good)}
.place button[data-f="1"],.place button[data-f="2"]{border-color:var(--mid);color:var(--mid)}
.place button[data-f="3"],.place button[data-f="4"]{border-color:var(--bad);color:var(--bad)}
.hint{padding:12px;text-align:center;color:var(--muted);font:700 14px var(--cond);letter-spacing:.04em}
.foot{font:600 11px var(--body);color:var(--muted);text-align:center;opacity:.8}
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,8,5,.8);display:grid;place-items:center;padding:14px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto}
.sheet{width:min(100%,460px);background:linear-gradient(#132a1f,#0b1a13);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:calc(100vh - 28px);overflow:auto;box-sizing:border-box}
.sheet h2{margin:0 0 8px;font:400 26px var(--display);text-align:center}
.sheet h2 b{color:var(--lime);font-weight:400}
.sheet h3{margin:12px 0 6px;font:800 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet ol{padding-left:20px;margin:8px 0;line-height:1.45}
.sheet li{margin:4px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:64px;padding:9px 6px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);font:800 15px var(--cond);letter-spacing:.06em}
.seg button[aria-pressed=true]{border-color:var(--lime);color:var(--lime);background:rgba(198,255,61,.08)}
.btns{display:grid;gap:8px;margin-top:12px}
.big{padding:13px;border-radius:12px;font:400 18px var(--display);letter-spacing:.04em;background:var(--panel2);border:1.5px solid var(--line)}
.big.hot{background:linear-gradient(#d4ff5c,#86d600);color:#0b2a05;border:0;box-shadow:0 4px 0 #3f6b00}
.big small{display:block;font:700 12px var(--cond);letter-spacing:.06em;opacity:.85;margin-top:2px}
.stat{display:flex;justify-content:center;gap:14px;font:700 13px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:10px;flex-wrap:wrap}
.stat b{color:var(--text);font-size:16px}
.big-n{text-align:center;font:400 clamp(48px,15vw,66px)/1 var(--display);margin:4px 0 0;text-shadow:0 4px 0 #02200f,0 0 26px rgba(198,255,61,.4)}
.verd{text-align:center;font:800 15px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.fx{display:grid;gap:5px;margin:12px 0}
.fx div{display:grid;grid-template-columns:22px 1fr auto 26px;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.04);font:600 14px var(--body);opacity:.35;transition:opacity .2s}
.fx div.on{opacity:1}
.fx .k{font:800 11px var(--cond);color:var(--muted)}
.fx .sc{font:400 17px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.fx .r{font:800 12px var(--cond);text-align:center;border-radius:5px;padding:2px 0}
.fx .r.w{background:var(--good);color:#04210f}.fx .r.d{background:var(--mid);color:#2b2200}.fx .r.l{background:var(--bad);color:#2a0008}
.fx small{font:700 11px var(--cond);color:var(--muted);letter-spacing:.04em}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);z-index:60;opacity:0;pointer-events:none;font:400 24px var(--display);background:linear-gradient(#d4ff5c,#86d600);color:#0b2a05;padding:10px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (prefers-reduced-motion:reduce){.slot.pick{animation:none}}
</style>
<div id="app">
  <header><div class="wm">Spin <b>XI</b></div><div class="grow"></div><span id="snd"></span><button class="hb" id="rulesBtn">Rules</button><button class="hb" id="newBtn">New</button></header>
  <div class="bar"><span class="rd" id="rd"></span><span class="grow"></span><span class="ovr" id="ovr"></span><span class="tag" id="mode"></span></div>
  <div class="mach">
    <div class="reels">
      <div class="reel" id="rA"><span class="lab">League or nation</span><div class="strip"></div></div>
      <div class="reel" id="rB"><span class="lab">Squad</span><div class="strip"></div></div>
    </div>
    <div class="ctl"><button class="spin" id="spinBtn">SPIN</button><button class="re" id="reBtn">Respin<small>2 left</small></button></div>
  </div>
  <div class="pitch" id="pitch"></div>
  <div class="roster" id="roster"></div>
  <p class="foot">Real players and clubs at the start of 2025/26 (Transfermarkt data via salimt/football-datasets). Ratings are our own, worked out from market value and age.</p>
</div>
<div id="ov"></div><div class="toast" id="toast"></div>
<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){

  $('#ovr').innerHTML=n?`<small>OVR</small>${teamOVR().toFixed(1)}`:'';
  $('#mode').textContent=G.mode==='daily'?'Daily':'Free';
  const sb=$('#spinBtn');sb.disabled=busy||G.phase!=='spin';sb.textContent=G.phase==='done'?'DONE':'SPIN';
  $('#reBtn').disabled=busy||G.phase!=='pick'||G.re<1;$('#reBtn small').textContent=G.re?G.re+' left':'used';
  $('#pitch').innerHTML=pitchHTML();$('#roster').innerHTML=rosterHTML();
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1300)}
function put(i){
  const p=P[selP],sp=FORM[G.form][i][0],before=chem();G.xi[i]={p};RG.sfx(fitLvl(p.pos,sp)?'place':'kick');RG.buzz(12);
  const c=chem();if(c>before)toast('Chemistry +'+(c-before).toFixed(1));else if(fitLvl(p.pos,sp)>=3)toast('Out of position');
  selP=null;G.round++;G.spin=null;G.phase=G.xi.every(Boolean)?'done':'spin';render();
  if(G.phase==='done')setTimeout(finish,500);
}

/* ---------- the gauntlet ---------- */
function runGauntlet(){const r=rng(hash(G.seed+':run')),Y=teamOVR(),opp=gauntlet(r),res=[];
  for(const o of opp){const m=play(Y,o.r,r);res.push({o,m});if(!m.win)break}return res}
function finish(){
  const res=runGauntlet(),w=res.filter(x=>x.m.win).length;G.res=res;G.wins=w;
  if(G.mode==='daily'){daily[G.date]={w,form:G.form,xi:G.xi.map(t=>t.p.i)};sv('daily',daily)}
  stats.runs++;stats.wins+=w;stats.best=Math.max(stats.best,w);if(w===10)stats.champ++;sv('stats',stats);
  ov='end';overlay(true);
}
function streak(){let n=0;const d=new Date();if(!daily[dkey(d)])d.setDate(d.getDate()-1);while(daily[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
const verdict=w=>w===10?'Gauntlet champions':w>=8?'Final-day heartbreak':w>=6?'Deep run':w>=3?'Respectable':w>=1?'Early exit':'Out at the first hurdle';
function overlay(anim){
  let h='';
  if(ov==='rules'||ov==='start'){
    const dd=daily[today()];
    const seg=`<div class="seg">${Object.keys(FORM).map(f=>`<button data-form="${f}" aria-pressed="${cfg.form===f}">${f}</button>`).join('')}</div>`;
    h=`<div class="ov"><div class="sheet" role="dialog" aria-label="How to play"><h2>Spin <b>XI</b></h2>
    <ol><li><b>Spin</b> to land on a league or a nation. Leagues then spin a club. Nations give you their best 26.</li>
    <li>Draft <b>one player</b> and put him in an open slot. Out of position costs rating, shown on each button.</li>
    <li>Players from the <b>same club</b>, or three or more from <b>one nation</b>, add chemistry.</li>
    <li>You get <b>2 respins</b>. Eleven picks make your XI.</li>
    <li>Then the <b>Gauntlet</b>: ten matches against real clubs, each tougher than the last. Lose once and you're out. Draws go to penalties.</li></ol>
    ${ov==='start'?`<h3>Formation for free play</h3>${seg}`:''}
    <div class="btns">${ov==='start'?`<button class="big hot" data-o="daily">${dd?'Today’s daily: '+dd.w+' win'+(dd.w===1?'':'s'):'Daily challenge'}<small>${dd?'Already played. See your XI':'Same spins, formation and fixtures for everyone'}</small></button><button class="big" data-o="free">Free play<small>${cfg.form} · fresh spins</small></button>`:`<button class="big hot" data-o="close">Got it</button>`}</div>
    <div class="stat"><span>Best run <b>${stats.best}</b></span><span>Titles <b>${stats.champ}</b></span><span>Daily streak <b>${streak()}</b></span></div></div></div>`;
  }else if(ov==='end'){
    const res=G.res,w=G.wins;
    h=`<div class="ov"><div class="sheet" role="dialog" aria-label="Gauntlet result"><div class="verd">The Gauntlet · OVR ${teamOVR().toFixed(1)}</div>
    <div class="big-n" id="bn">${anim?0:w}<span style="font-size:.4em">/10</span></div><div class="verd" id="vd">${anim?'&nbsp;':verdict(w)}</div>
    <div class="fx" id="fx">${res.map((x,k)=>{const{m,o}=x,c=m.win?'w':m.a===m.b?'d':'l';return `<div class="${anim?'':'on'}"><span class="k">${k+1}</span><span>${o.n}<small> · ${o.r.toFixed(0)}</small></span><span class="sc">${m.a}–${m.b}${m.pens?` <small>(${m.pens[0]}–${m.pens[1]} p)</small>`:''}</span><span class="r ${c==='d'?(m.win?'w':'l'):c}">${m.win?'W':'L'}</span></div>`}).join('')}
    ${res.length<10?`<div class="on" style="opacity:.5"><span class="k">${res.length+1}–10</span><span>Not reached</span><span></span><span></span></div>`:''}</div>
    <div class="btns"><button class="big hot" data-o="again">Play again</button><button class="big" data-o="share">Copy result</button><button class="big" data-o="close">View XI</button></div></div></div>`;
  }
  $('#ov').innerHTML=h;
  if(ov==='end'&&anim)animateRun();
}
async function animateRun(){
  const rows=[...document.querySelectorAll('#fx > div')];let w=0;
  for(let k=0;k<G.res.length;k++){if(!$('#bn'))return;RG.sfx('whistle');await sleep(420);const m=G.res[k].m;rows[k].classList.add('on');
    if(m.win){w++;RG.sfx(m.a-m.b>=2?'cheer':'good')}else RG.sfx('lose');$('#bn').firstChild.textContent=w;await sleep(380)}
  rows.slice(G.res.length).forEach(r=>r.classList.add('on'));
  $('#vd').textContent=verdict(G.wins);if(G.wins===10){RG.sfx('fanfare');RG.buzz(40)}
}
function shareText(){return `Spin XI ${G.mode==='daily'?G.date+' ':''}⚽ ${G.wins}/10 (${G.form}, OVR ${teamOVR().toFixed(1)})\n`+G.res.map(x=>x.m.win?'🟩':'🟥').join('')+'⬛'.repeat(10-G.res.length)+'\n'+G.xi.map((t,i)=>FORM[G.form][i][0]+' '+t.p.n).join(', ')}

document.addEventListener('click',async e=>{
  const fm=e.target.closest('[data-form]');if(fm){cfg.form=fm.dataset.form;sv('cfg',cfg);RG.sfx('click');return overlay()}
  const o=e.target.closest('[data-o]');
  if(o){const v=o.dataset.o;RG.sfx('click');
    if(v==='close'){ov=null;overlay()}
    else if(v==='free'){ov=null;overlay();newGame('free')}
    else if(v==='daily'){ov=null;overlay();const dd=daily[today()];newGame('daily');
      if(dd){G.form=dd.form;G.xi=dd.xi.map(i=>({p:P[i]}));G.phase='done';render();G.res=runGauntlet();G.wins=dd.w;ov='end';overlay()}}
    else if(v==='again'){ov='start';overlay()}
    else if(v==='showend'){ov='end';overlay()}
    else if(v==='all'){showAll=!showAll;render()}
    else if(v==='share'){try{await navigator.clipboard.writeText(shareText());o.textContent='Copied'}catch(err){o.textContent='Copy failed'}}
    return}
  if(busy||!G)return;
  const r=e.target.closest('[data-p]');if(r&&G.phase==='pick'){const i=+r.dataset.p;selP=selP===i?null:i;RG.sfx('tap');render();
    const pl=document.querySelector('.place');pl&&pl.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  const u=e.target.closest('[data-put]');if(u&&selP!=null)return put(+u.dataset.put);
  const sl=e.target.closest('[data-slot]');if(sl&&selP!=null&&openSlots().includes(+sl.dataset.slot))return put(+sl.dataset.slot);
});
$('#spinBtn').onclick=()=>doSpin(false);
$('#reBtn').onclick=()=>doSpin(true);
$('#rulesBtn').onclick=()=>{RG.sfx('open');ov='rules';overlay()};
$('#newBtn').onclick=()=>{if(busy)return;RG.sfx('click');ov='start';overlay()};
fillStrip($('#rA'),['?'],'a');fillStrip($('#rB'),['?'],'');
newGame('free');ov='start';overlay();
</script>

<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("../sw.js").catch(()=>{});</script>

/* Back to all games: sits at the start of the game's header; floats top-left on screens without one */
(function(){
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
</script><!--/EGBACK-->
