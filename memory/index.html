<style>
/* Layout: a night-time games table. Wordmark and settings across the top, score chips, then the glowing card grid with the hint bar under it. Deliberately one dark look. */
:root{
  --bg:#120f24; --panel:#1d1838; --panel-2:#262048; --line:#352d63; --text:#f4f1ff; --muted:#a59fc9;
  --pink:#ff5fa2; --gold:#ffd166; --ok:#4ade80;
  --back-a:#ff9a3c; --back-b:#ff5fa2;
  --display:'Unbounded', 'Arial Black', sans-serif; --body:'DM Sans', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(90% 60% at 50% 0%,#2a1f5c 0%,transparent 70%),radial-gradient(70% 50% at 100% 100%,#3a1640 0%,transparent 70%);background-attachment:fixed}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:.6em 1em;color:inherit}
button:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.wm{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.02em;background:linear-gradient(90deg,#ffd166,#ff5fa2 60%,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
header .grow{flex:1}
header a,header button{background:transparent;border:1.5px solid var(--line);font-size:12px;padding:.45em .75em;border-radius:9px;color:var(--text);text-decoration:none;font-weight:700}
.themes{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.themes button{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);font-size:13px;padding:.4em .8em .4em .45em;border-radius:999px}
.themes button img{width:26px;height:26px}
.themes button[aria-pressed="true"]{border-color:var(--pink);background:var(--panel-2);box-shadow:0 0 0 3px rgba(255,95,162,.18)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:transparent;font-size:12.5px;padding:.45em .7em;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.score{display:flex;gap:8px}
.pl{flex:1;background:var(--panel);border-radius:12px;padding:8px 12px;border:1.5px solid transparent;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0;transition:border-color .2s}
.pl.on{border-color:var(--pink)}
.pl span{font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:clamp(6px,1.6vw,10px);margin:4px auto 0;width:100%}
.card{aspect-ratio:3/4;perspective:800px;cursor:pointer;background:none;padding:0;border-radius:12px;position:relative}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.3,1.15)}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .b,.card .f{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .b{background:linear-gradient(145deg,var(--back-a),var(--back-b));box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.18)}
.card .b::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 6px,transparent 6px 14px)}
.card .b::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border-radius:22%;border:3px solid rgba(255,255,255,.55)}
.card:hover:not(.up):not(.done) .in{transform:translateY(-3px) rotateY(8deg)}
.card .f{transform:rotateY(180deg);display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,hsl(var(--h) 90% 82%),hsl(var(--h) 70% 58%) 70%,hsl(var(--h) 60% 40%));box-shadow:0 6px 14px rgba(0,0,0,.35)}
.card .f img{width:78%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transform:translateY(-2%)}
.card.done .f{box-shadow:0 0 0 3px var(--ok),0 0 22px rgba(74,222,128,.45)}
.card.pop .in{animation:pop .5s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
.card.miss .f{box-shadow:0 0 0 3px #ff6b6b}
.card.hint .b,.card.hint .f{box-shadow:0 0 0 4px var(--gold),0 0 24px rgba(255,209,102,.6)}
.card.done{cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{flex:1;min-width:140px;font-weight:700;min-height:1.4em}
.btn{background:var(--text);color:var(--bg)}
.alt{background:transparent;border:1.5px solid var(--line)}
.hintb{background:transparent;border:1.5px dashed var(--gold);color:var(--gold)}
.hintb:disabled{opacity:.4;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(8,6,20,.7);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:420px;width:100%;display:grid;gap:12px;box-sizing:border-box;text-align:center}
.sheet h2{font-family:var(--display);font-weight:900;font-size:28px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:600;font-size:34px;font-variant-numeric:tabular-nums}
.trophy{width:96px;margin:0 auto}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:30;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.card.pop .in,.confetti{animation:none}}
</style>

<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){
      const o=ac.createOscillator();wave(o,type);const d=stack>1?(k/(stack-1)-.5)*2*det:det;o.detune.value=d;
      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}
      o.connect(n);o.start(t);o.stop(end+.05);into.push(o)}
    const v=vol/Math.sqrt(stack);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,end);
    out=panTo(g,pan);out.connect(bus);sends(g,{echo,rev});
  }
  function noise(bus,{t,dur=.1,vol=.2,a=.002,hp=null,bp=null,bp2=null,lp=null,lp2=null,q=1,pan=0,echo=0,rev=0}){
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=noiseBuf;let n=s;
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;n.connect(fl);n=fl}
    if(bp){const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(bp,t);if(bp2)fl.frequency.exponentialRampToValueAtTime(bp2,t+dur);n.connect(fl);n=fl}
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,t+dur);n.connect(fl);n=fl}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(g);panTo(g,pan).connect(bus);sends(g,{echo,rev});s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---------- sound effects: a clean sci-fi palette (same names the games already call) ---------- */
  const B=()=>sfxBus,V=(o)=>voice(sfxBus,o),Nz=(o)=>noise(sfxBus,o);
  const FX={
    click:t=>{V({f:2600,f2:1800,t,dur:.014,type:'sine',vol:.09,r:.02});Nz({t,dur:.012,vol:.04,hp:7000})},
    tap:t=>V({f:880,f2:1500,t,dur:.035,type:'triangle',vol:.11,r:.04,echo:.12}),
    ui:t=>V({f:1200,f2:1700,t,dur:.03,type:'sine',vol:.08,r:.04}),
    tab:t=>{V({f:1500,t,dur:.02,type:'sine',vol:.07,r:.03});V({f:2250,t:t+.03,dur:.02,type:'sine',vol:.05,r:.04})},
    open:t=>{V({f:500,f2:1400,t,dur:.12,type:'sine',vol:.09,r:.06,echo:.15});Nz({t,dur:.14,vol:.035,bp:1500,bp2:6000,q:2})},
    close:t=>{V({f:1400,f2:500,t,dur:.1,type:'sine',vol:.08,r:.06});Nz({t,dur:.1,vol:.03,bp:5000,bp2:1200,q:2})},
    flip:t=>{Nz({t,dur:.07,vol:.12,bp:1600,bp2:7000,q:1.4});V({f:1600,f2:2400,t,dur:.03,type:'sine',vol:.06,r:.03})},
    deal:t=>{Nz({t,dur:.06,vol:.14,bp:3500,bp2:8000,q:1.6,pan:(Math.random()-.5)*.6});V({f:3200,t:t+.01,dur:.01,type:'sine',vol:.04,r:.03})},
    place:t=>{V({f:190,f2:70,t,dur:.07,type:'sine',vol:.3});V({f:3000,t,dur:.008,type:'square',vol:.04,r:.02,lp:5000})},
    shuffle:t=>{for(let i=0;i<7;i++)V({f:hz(84+[0,3,7,10,12,15,19][i]),t:t+i*.032,dur:.02,type:'sine',vol:.06,r:.03,pan:i%2?.4:-.4})},
    good:t=>{V({f:hz(79),t,dur:.06,type:'sine',vol:.14,r:.12,fm:.6,fmr:2,echo:.2});V({f:hz(86),t:t+.07,dur:.1,type:'sine',vol:.14,r:.25,fm:.6,fmr:2,echo:.25})},
    bad:t=>V({f:260,f2:110,t,dur:.24,type:'sawtooth',vol:.11,stack:2,det:18,lp:1400,lp2:300,q:6}),
    miss:t=>V({f:260,f2:110,t,dur:.22,type:'sawtooth',vol:.1,stack:2,det:18,lp:1400,lp2:300,q:6}),
    error:t=>{V({f:210,t,dur:.07,type:'square',vol:.07,lp:1500});V({f:175,t:t+.09,dur:.11,type:'square',vol:.07,lp:1200})},
    pop:t=>V({f:1500,f2:420,t,dur:.06,type:'sine',vol:.2,fm:1.2,fmr:1.5,r:.05}),
    merge:t=>{V({f:300,f2:960,t,dur:.1,type:'sine',vol:.18,fm:.8,fmr:2,r:.08,echo:.15});Nz({t:t+.04,dur:.08,vol:.03,hp:6000})},

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- sound ---------- */
let ac=null;
function tone(f,d,type='sine',vol=.08,delay=0){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={flip:()=>RG.sfx('flip'),match:()=>RG.sfx('good'),miss:()=>RG.sfx('bad'),win:()=>RG.sfx('fanfare')};

/* ---------- game ---------- */
function start(){
  save('cfg',cfg);cpuMem=new Map();
  const z=SIZES[cfg.size];
  const pool=cfg.theme==='mixed'?shuffle(ALL.slice()):shuffle(ART[cfg.theme].items.slice());
  const faces=pool.slice(0,z.pairs);
  const deck=shuffle(faces.flatMap((f,i)=>[i,i]));
  const players=cfg.mode==='solo'?['You']:cfg.mode==='cpu'?['You','Computer']:['Player 1','Player 2'];
  S={faces,deck,up:[],done:new Set(),turn:0,scores:players.map(()=>0),players,moves:0,hints:0,hintAt:new Set(),t0:0,end:0,streak:0,best:0};
  const [a,b]=THEMES[cfg.theme];document.documentElement.style.setProperty('--back-a',a);document.documentElement.style.setProperty('--back-b',b);
  clearInterval(timer);timer=setInterval(()=>{if(cfg.mode==='solo'&&S.t0&&!S.end)renderScore()},1000);
  lock=false;renderControls();buildGrid();renderScore();setMsg(cfg.mode==='solo'?'Turn over two cards to start.':`${S.players[0]==='You'?'You go':S.players[0]+' goes'} first.`);
}
function buildGrid(){
  const z=SIZES[cfg.size],g=$('#grid');
  g.style.gridTemplateColumns=`repeat(${z.cols},minmax(0,1fr))`;g.style.maxWidth=(z.cols*(cfg.size==='l'?84:108))+'px';
  g.innerHTML='';cards=[];
  S.deck.forEach((v,i)=>{
    const [name,src]=S.faces[v];const h=(v*47+cfg.theme.length*31)%360;
    const b=document.createElement('button');b.className='card';b.dataset.i=i;b.setAttribute('aria-label','Hidden card');
    b.innerHTML=`<div class="in"><div class="b"></div><div class="f" style="--h:${h}"><img src="${src}" alt="" draggable="false"></div></div>`;
    g.appendChild(b);cards.push(b);
  });
}
function sync(){
  cards.forEach((c,i)=>{
    const up=S.up.includes(i),done=S.done.has(i);
    c.classList.toggle('up',up);c.classList.toggle('done',done);c.classList.toggle('hint',S.hintAt.has(i));
    c.setAttribute('aria-label',up||done?S.faces[S.deck[i]][0]+(done?', matched':''):'Hidden card');
  });
  $('#hintBtn').disabled=!!S.end||S.hints>=HINTS;$('#hintBtn').textContent=`Hint (${HINTS-S.hints})`;
}
function setMsg(m){$('#msg').textContent=m}
const who=p=>S.players[p];
const isYou=p=>S.players[p]==='You';
function flip(i){
  if(lock||S.end||S.up.includes(i)||S.done.has(i))return;
  if(cfg.mode==='cpu'&&S.turn===1)return;
  doFlip(i);
}
function doFlip(i){
  if(!S.t0)S.t0=Date.now();
  S.up.push(i);S.hintAt.clear();sfx.flip();
  if(cfg.mode==='cpu'&&Math.random()<BRAINS[cfg.level])cpuMem.set(i,S.deck[i]);
  sync();
  if(S.up.length<2)return;
  S.moves++;lock=true;const[a,b]=S.up;
  if(S.deck[a]===S.deck[b]){
    setTimeout(()=>{
      S.done.add(a);S.done.add(b);S.up=[];S.scores[S.turn]++;S.streak++;S.best=Math.max(S.best,S.streak);
      [a,b].forEach(k=>{cards[k].classList.remove('pop');void cards[k].offsetWidth;cards[k].classList.add('pop')});
      sfx.match();lock=false;sync();renderScore();
      const nm=S.faces[S.deck[a]][0];
      if(cfg.mode==='solo')setMsg(S.streak>1?`${S.streak} in a row!`:'Pair found.');
      else setMsg(isYou(S.turn)?'Pair found. Go again.':`${who(S.turn)} found a pair and goes again.`);
      if(S.done.size===S.deck.length)finish();else cpu();
    },420);
  }else{
    setTimeout(()=>{[a,b].forEach(k=>cards[k].classList.add('miss'));sfx.miss()},350);
    setTimeout(()=>{
      [a,b].forEach(k=>cards[k].classList.remove('miss'));
      S.up=[];S.streak=0;if(cfg.mode!=='solo')S.turn=(S.turn+1)%S.players.length;
      lock=false;sync();renderScore();
      setMsg(cfg.mode==='solo'?'No match. Remember where they were.':isYou(S.turn)?'Your turn.':`${who(S.turn)}'s turn.`);
      cpu();
    },1100);
  }
}
const secs=()=>Math.round(((S.end||Date.now())-(S.t0||Date.now()))/1000);
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function finish(){
  S.end=Date.now();sfx.win();confetti();
  if(cfg.mode==='solo'){const best=load('best',{}),k=cfg.size+'.'+cfg.theme,cur=best[k];
    if(!cur||S.moves<cur.moves||S.moves===cur.moves&&secs()<cur.secs){best[k]={moves:S.moves,secs:secs()};save('best',best);S.newBest=true}}
  setTimeout(()=>{ov='end';overlay()},900);
}
function cpu(){
  if(cfg.mode!=='cpu'||S.turn!==1||S.end)return;
  const p=BRAINS[cfg.level];
  for(const i of [...cpuMem.keys()])if(S.done.has(i)||Math.random()>p+.25)cpuMem.delete(i);
  const open=S.deck.map((_,i)=>i).filter(i=>!S.done.has(i));
  const byFace={};cpuMem.forEach((v,i)=>{(byFace[v]=byFace[v]||[]).push(i)});
  const pair=Object.values(byFace).find(l=>l.length>=2);
  let first,second=null;
  if(pair){first=pair[0];second=pair[1]}
  else{const unknown=open.filter(i=>!cpuMem.has(i));const pool=unknown.length?unknown:open;first=pool[Math.random()*pool.length|0]}
  setTimeout(()=>{
    if(S.turn!==1||S.end)return;
    doFlip(first);
    if(second==null){const v=S.deck[first];const known=[...cpuMem.entries()].find(([i,f])=>f===v&&i!==first);
      if(known)second=known[0];else{let pool=open.filter(i=>i!==first&&!cpuMem.has(i));if(!pool.length)pool=open.filter(i=>i!==first);second=pool[Math.random()*pool.length|0]}}
    setTimeout(()=>{if(S.turn===1&&S.up.length===1)doFlip(second)},750);
  },800);
}
function hint(){
  if(S.end||lock||S.hints>=HINTS||(cfg.mode==='cpu'&&S.turn===1))return;
  S.hints++;
  const open=S.deck.map((_,i)=>i).filter(i=>!S.done.has(i));
  if(S.up.length===1){const i=S.up[0];S.hintAt=new Set([S.deck.findIndex((v,k)=>v===S.deck[i]&&k!==i)]);setMsg('Its match is glowing.')}
  else{const v=S.deck[open[Math.random()*open.length|0]];S.hintAt=new Set(open.filter(i=>S.deck[i]===v));setMsg('One pair is glowing. Remember where.')}
  sync();setTimeout(()=>{S.hintAt.clear();sync()},1700);
}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#ffd166','#ff5fa2','#4ade80','#7bb8ff','#b98bff'];
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}

/* ---------- render ---------- */
function renderControls(){
  $('#themes').innerHTML=Object.keys(THEMES).map(k=>{const icon=k==='mixed'?ALL[5][1]:ART[k].items[0][1];return `<button data-theme="${k}" aria-pressed="${cfg.theme===k}"><img src="${icon}" alt="">${k==='mixed'?'Mixed':ART[k].name}</button>`}).join('');
  const seg=(k,list)=>`<div class="seg">${list.map(([v,l])=>`<button data-k="${k}" data-v="${v}" aria-pressed="${cfg[k]===v}">${l}</button>`).join('')}</div>`;
  $('#opts').innerHTML=seg('mode',[['solo','Solo'],['cpu','Vs computer'],['two','Two players']])+seg('size',Object.entries(SIZES).map(([k,v])=>[k,v.label]))+(cfg.mode==='cpu'?seg('level',[['easy','Easy'],['normal','Normal'],['hard','Hard']]):'');
}
function renderScore(){
  $('#score').innerHTML=cfg.mode==='solo'
    ?`<div class="pl"><span>Moves</span><b>${S.moves}</b></div><div class="pl"><span>Time</span><b>${fmt(secs())}</b></div><div class="pl"><span>Pairs</span><b>${S.done.size/2}/${S.deck.length/2}</b></div>`
    :S.players.map((p,i)=>`<div class="pl${S.turn===i&&!S.end?' on':''}"><span>${p}</span><b>${S.scores[i]}</b></div>`).join('');
  sync();
}
function overlay(){
  let h='';
  if(ov==='help')h=`<div class="overlay" data-a="close"><div class="sheet" data-stop><h2>How to play</h2>
    <p>Tap a card to turn it over, then tap another. A match stays face up. If they don't match, both flip back, so remember where they were.</p>
    <p>Solo: clear the grid in as few moves as you can. Against the computer or a friend, finding a pair gives you another go. Most pairs wins.</p>
    <p>Hint makes a pair glow for a moment. With one card already turned, it shows where its match is. Three per game.</p>
    <div class="row"><button class="btn" data-a="close">Got it</button></div></div></div>`;
  else if(ov==='end'){
    const trophy=ART.fun.items.find(x=>x[0]==='🏆')[1];let title,body;
    if(cfg.mode==='solo'){title=S.newBest?'New best!':'Cleared';const b=load('best',{})[cfg.size+'.'+cfg.theme];
      body=`<div class="big">${S.moves} moves</div><p>${fmt(secs())} · best run ${S.best} in a row${S.hints?` · ${S.hints} hint${S.hints>1?'s':''}`:''}</p>${b?`<p class="label">Best on ${SIZES[cfg.size].label} ${cfg.theme}: ${b.moves} moves, ${fmt(b.secs)}</p>`:''}`}
    else{const [a,b]=S.scores;title=a===b?"It's a draw":`${S.players[a>b?0:1]==='You'?'You win':S.players[a>b?0:1]+' wins'}`;body=`<div class="big">${a} – ${b}</div>`}
    h=`<div class="overlay"><div class="sheet"><img class="trophy" src="${trophy}" alt=""><h2>${title}</h2>${body}<div class="row"><button class="btn" data-a="new">Play again</button><button class="alt" data-a="close">Close</button></div></div></div>`;
  }
  $('#ov').innerHTML=h;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(c){flip(+c.dataset.i);return}
  const t=e.target.closest('[data-theme]');if(t){cfg.theme=t.dataset.theme;start();return}
  const k=e.target.closest('[data-k]');if(k){cfg[k.dataset.k]=k.dataset.v;start();return}
  if(e.target.closest('#hintBtn')){hint();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  if(e.target.closest('[data-stop]')&&b.tagName!=='BUTTON')return;
  const a=b.dataset.a;
  if(a==='new'){ov=null;overlay();start()}
  else if(a==='help'){ov='help';overlay()}
  else if(a==='close'){ov=null;overlay()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov){ov=null;overlay()}});
start();
</script>

/* Back to all games: sits at the start of the game's header; floats top-left on screens without one */
(function(){
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const make=f=>{const a=document.createElement('a');a.href='../index.html';a.className='eg-back'+(f?' float':'');a.setAttribute('aria-label','Back to all games');a.title='All games';a.innerHTML=ICON;return a};
  const vis=e=>!!(e&&e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden');
  const G=document.documentElement.dataset.game||'',TGT={casino:'#app > .bar',wildtrumps:'.brand'};
  if(G==='rarebit'||G==='cambio')return; // these two already have their own back-to-games icon
  let busy=false;
  function place(){
    if(busy)return;busy=true;
    try{
      const ex=document.querySelector('.eg-back');
      const h=[...document.querySelectorAll((TGT[G]?TGT[G]+',':'')+'header')].find(vis);
      if(h){if(ex&&ex.parentNode===h)return;ex&&ex.remove();h.prepend(make(false))}
      else if(!ex||!vis(ex)){ex&&ex.remove();document.body.appendChild(make(true))}
    }finally{busy=false}
  }
  const go=()=>{place();let q=false;new MutationObserver(()=>{if(busy||q)return;q=true;requestAnimationFrame(()=>{q=false;place()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class','style']})};
  document.body?go():addEventListener('DOMContentLoaded',go);
})();
</script><!--/EGBACK-->
