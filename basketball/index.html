<style>
/* Layout: an outdoor court at dusk seen from the side. Scoreboard on top, the court, then big thumb buttons: move on the left, action on the right. Deliberately one dark look. */
:root{
  --bg:#1a0f2e; --panel:#24173f; --line:#3d2b66; --text:#fff4e8; --muted:#bfaedc; --orange:#ff7a1a; --you:#2fb8ff; --cpu:#ff3f6c; --gold:#ffd23f; --ok:#57e39b;
  --display:'Bungee', Impact, sans-serif; --body:'Outfit', system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 10px;box-sizing:border-box}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:.5em .9em;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:8px}
.wm{font-family:var(--display);font-size:20px;color:var(--orange);text-shadow:0 3px 0 #6b2600;line-height:1}
header .grow{flex:1}
header a,header .hb{color:var(--muted);text-decoration:none;font-weight:800;font-size:12px;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;background:transparent}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#0d0719;border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.team{display:flex;align-items:center;gap:8px;font-weight:800}
.team.r{justify-content:flex-end}
.team i{width:14px;height:14px;border-radius:4px}
.team.on span{color:var(--gold)}
.sc{font-family:var(--display);font-size:30px;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.5);font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.sc small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);text-shadow:none;letter-spacing:.1em}
canvas{width:100%;height:100%;display:block;min-height:0;border-radius:16px}
.msg{font-weight:800;text-align:center;min-height:1.3em}
.pad{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;touch-action:none}
.k{width:58px;height:58px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:26px;display:grid;place-items:center;padding:0;touch-action:none}
.k.on{background:var(--line)}
.act{width:76px;height:76px;border-radius:50%;font-family:var(--display);font-size:15px;color:#2a1000;background:radial-gradient(circle at 35% 30%,#ffb066,var(--orange));box-shadow:0 5px 0 #8a3500;touch-action:none;padding:0}
.act.alt{background:radial-gradient(circle at 35% 30%,#a8e7ff,var(--you));color:#04223a;box-shadow:0 5px 0 #0b5c8a;width:60px;height:60px;font-size:12px}
.act:active,.act.on{transform:translateY(4px);box-shadow:0 1px 0 #8a3500}
.act:disabled{opacity:.35}
.hintb{background:transparent;border:1.5px dashed var(--gold);color:var(--gold);justify-self:center;padding:.45em .7em}
.overlay{position:fixed;inset:0;background:rgba(10,4,20,.75);display:grid;place-items:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:400px;width:100%;display:grid;gap:12px;text-align:center;box-sizing:border-box}
.sheet h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--orange)}
.sheet p{margin:0;color:var(--muted)}
.seg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.seg button{background:transparent;border:1.5px solid var(--line);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.go{background:var(--orange);color:#2a1000;font-size:18px;box-shadow:0 4px 0 #8a3500}
.alt2{background:transparent;border:1.5px solid var(--line)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.keys{font-size:12px;color:var(--muted)}
</style>

<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){
      const o=ac.createOscillator();wave(o,type);const d=stack>1?(k/(stack-1)-.5)*2*det:det;o.detune.value=d;
      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}
      o.connect(n);o.start(t);o.stop(end+.05);into.push(o)}
    const v=vol/Math.sqrt(stack);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,end);
    out=panTo(g,pan);out.connect(bus);sends(g,{echo,rev});
  }
  function noise(bus,{t,dur=.1,vol=.2,a=.002,hp=null,bp=null,bp2=null,lp=null,lp2=null,q=1,pan=0,echo=0,rev=0}){
    const s=ac.createBufferSource(),g=ac.createGain();s.buffer=noiseBuf;let n=s;
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;n.connect(fl);n=fl}
    if(bp){const fl=ac.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(bp,t);if(bp2)fl.frequency.exponentialRampToValueAtTime(bp2,t+dur);n.connect(fl);n=fl}
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(lp2,t+dur);n.connect(fl);n=fl}
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(g);panTo(g,pan).connect(bus);sends(g,{echo,rev});s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);

  /* ---------- sound effects: a clean sci-fi palette (same names the games already call) ---------- */
  const B=()=>sfxBus,V=(o)=>voice(sfxBus,o),Nz=(o)=>noise(sfxBus,o);
  const FX={
    click:t=>{V({f:2600,f2:1800,t,dur:.014,type:'sine',vol:.09,r:.02});Nz({t,dur:.012,vol:.04,hp:7000})},
    tap:t=>V({f:880,f2:1500,t,dur:.035,type:'triangle',vol:.11,r:.04,echo:.12}),
    ui:t=>V({f:1200,f2:1700,t,dur:.03,type:'sine',vol:.08,r:.04}),
    tab:t=>{V({f:1500,t,dur:.02,type:'sine',vol:.07,r:.03});V({f:2250,t:t+.03,dur:.02,type:'sine',vol:.05,r:.04})},
    open:t=>{V({f:500,f2:1400,t,dur:.12,type:'sine',vol:.09,r:.06,echo:.15});Nz({t,dur:.14,vol:.035,bp:1500,bp2:6000,q:2})},
    close:t=>{V({f:1400,f2:500,t,dur:.1,type:'sine',vol:.08,r:.06});Nz({t,dur:.1,vol:.03,bp:5000,bp2:1200,q:2})},
    flip:t=>{Nz({t,dur:.07,vol:.12,bp:1600,bp2:7000,q:1.4});V({f:1600,f2:2400,t,dur:.03,type:'sine',vol:.06,r:.03})},
    deal:t=>{Nz({t,dur:.06,vol:.14,bp:3500,bp2:8000,q:1.6,pan:(Math.random()-.5)*.6});V({f:3200,t:t+.01,dur:.01,type:'sine',vol:.04,r:.03})},
    place:t=>{V({f:190,f2:70,t,dur:.07,type:'sine',vol:.3});V({f:3000,t,dur:.008,type:'square',vol:.04,r:.02,lp:5000})},
    shuffle:t=>{for(let i=0;i<7;i++)V({f:hz(84+[0,3,7,10,12,15,19][i]),t:t+i*.032,dur:.02,type:'sine',vol:.06,r:.03,pan:i%2?.4:-.4})},
    good:t=>{V({f:hz(79),t,dur:.06,type:'sine',vol:.14,r:.12,fm:.6,fmr:2,echo:.2});V({f:hz(86),t:t+.07,dur:.1,type:'sine',vol:.14,r:.25,fm:.6,fmr:2,echo:.25})},
    bad:t=>V({f:260,f2:110,t,dur:.24,type:'sawtooth',vol:.11,stack:2,det:18,lp:1400,lp2:300,q:6}),
    miss:t=>V({f:260,f2:110,t,dur:.22,type:'sawtooth',vol:.1,stack:2,det:18,lp:1400,lp2:300,q:6}),
    error:t=>{V({f:210,t,dur:.07,type:'square',vol:.07,lp:1500});V({f:175,t:t+.09,dur:.11,type:'square',vol:.07,lp:1200})},
    pop:t=>V({f:1500,f2:420,t,dur:.06,type:'sine',vol:.2,fm:1.2,fmr:1.5,r:.05}),

RG.init({game:'basketball',accent:'#ff7a1a',cbFilter:false});
document.getElementById('snd').appendChild(RG.button());
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
/* court units: x 0–100 left to right, y up from the floor */
const HOOP={x:88,y:30},ARC=65,G=110,SPEED=30,JUMP=40;
const ld=(k,d)=>{try{const v=localStorage.getItem('sb.'+k);return v?JSON.parse(v):d}catch(e){return d}};

let cfg=ld('cfg',{level:'normal',to:11});
const LV={easy:{chase:.68,block:.12,steal:.08,shot:.55,smart:.4},normal:{chase:.85,block:.28,steal:.18,shot:.75,smart:.7},hard:{chase:.97,block:.45,steal:.3,shot:.9,smart:1}}[cfg.level];
let P,score,poss,ball,clock,ov='menu',over=null,paused=true,flash=null,keys={l:false,r:false},hold=null,stealCool=0;
const names=['You','CPU'];
const COL=()=>({you:RG.c('#2fb8ff'),cpu:RG.c('#ff3f6c'),ball:RG.c('#ff7a1a'),court:RG.c('#c98a4b'),court2:RG.c('#b67a3e'),paint:RG.c('#7a3fd1')});
function lvl(){return{easy:{chase:.68,block:.12,steal:.08,shot:.55},normal:{chase:.85,block:.28,steal:.18,shot:.75},hard:{chase:.97,block:.45,steal:.3,shot:.9}}[cfg.level]}

function player(t,x){return{t,x,y:0,vy:0,vx:0,stun:0,shoot:null,face:1,anim:0}}
function newGame(){score=[0,0];over=null;P=[player(0,40),player(1,72)];poss=0;setup(0);paused=false;say('Your ball. Drive to the hoop, hold SHOOT and let go at the top of your jump.')}
function setup(team){poss=team;const a=P[team],d=P[1-team];a.x=36;d.x=58;for(const p of P){p.y=0;p.vy=0;p.vx=0;p.stun=0;p.shoot=null}
  ball={state:'held',by:team,x:a.x,y:10,vx:0,vy:0,spin:0};clock=12;hold=null;stealCool=0;updButtons()}
function say(t){$('#msg').textContent=t}

/* ---------- shooting ---------- */
function baseChance(x){const d=HOOP.x-x;if(d<7)return .88;if(d<HOOP.x-ARC)return .62-(d-7)*.012;return Math.max(.04,.42-(d-(HOOP.x-ARC))*.022)}
function contest(sh){const o=P[1-sh.t],d=Math.abs(o.x-sh.x);if(d>7)return 1;return o.y>4?.3:.72}
function release(p,quality){
  const timing=.45+.7*quality,chance=Math.min(.97,baseChance(p.x)*timing*contest(p));
  const pts=p.x<ARC?3:2,make=Math.random()<chance;
  // ball flies from the hands to the rim along an arc
  const sx=p.x+1.5,sy=p.y+19,T=.75+Math.abs(HOOP.x-sx)/120;
  ball={state:'flight',by:p.t,x:sx,y:sy,sx,sy,t:0,T,make,pts,from:p.x,shooter:p.t,vx:0,vy:0,spin:0};
  RG.sfx('swish');setTimeout(()=>{},0);p.shoot=null;say(quality>.8?'Perfect release!':quality>.5?'Good release.':'Early release…');
}
function startShot(p){if(p.y>0||p.stun>0||ball.state!=='held'||ball.by!==p.t)return;p.vy=JUMP;p.shoot={t:0};RG.sfx('tap')}
function shotQuality(t){return Math.max(0,1-Math.abs(t-.36)/.36)}

/* ---------- loop ---------- */
let last=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(!paused&&!ov)update(dt);draw();requestAnimationFrame(loop)}
function update(dt){
  const me=P[0],cpu=P[1],L=lvl();
  if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
  stealCool=Math.max(0,stealCool-dt);
  // you
  let mv=(keys.r?1:0)-(keys.l?1:0);if(me.stun>0){me.stun-=dt;mv=0}
  if(me.y===0&&!me.shoot)me.vx=mv*SPEED;
  // computer
  cpuThink(dt,L);
  for(const p of P){
    p.x=Math.max(XMIN+4,Math.min(96,p.x+p.vx*dt));if(p.vx)p.face=Math.sign(p.vx);p.anim+=Math.abs(p.vx)*dt*.35;
    if(p.y>0||p.vy>0){p.vy-=G*dt;p.y+=p.vy*dt;if(p.y<=0){p.y=0;p.vy=0}}
    if(p.shoot){p.shoot.t+=dt;if(p.t===1&&p.shoot.t>=p.shoot.at)release(p,p.shoot.q);else if(p.t===0&&p.shoot.t>.75)release(p,shotQuality(p.shoot.t))}
  }
  // players don't pass through each other on the ground
  if(Math.abs(me.x-cpu.x)<3.2&&me.y<6&&cpu.y<6){const push=(3.2-Math.abs(me.x-cpu.x))/2,s=Math.sign(me.x-cpu.x)||1;me.x+=push*s;cpu.x-=push*s}
  // ball
  if(ball.state==='held'){const h=P[ball.by];ball.x=h.x+h.face*1.8;const bounce=Math.abs(Math.sin(performance.now()/170));ball.y=h.shoot||h.y>0?h.y+18:2+bounce*8;
    clock-=dt;if(clock<=0){RG.sfx('buzzer');say('Shot clock! Turnover.');turnover(1-ball.by,900)}}
  else if(ball.state==='flight'){ball.t+=dt;const f=Math.min(1,ball.t/ball.T),ex=HOOP.x,ey=HOOP.y+1;
    const apex=Math.max(ball.sy,ey)+14+Math.abs(ex-ball.sx)*.18;
    ball.x=ball.sx+(ex-ball.sx)*f;ball.y=(1-f)*(1-f)*ball.sy+2*(1-f)*f*apex+f*f*ey;
    // blocks: a defender rising near the shooter early in the flight
    const d=P[1-ball.shooter];if(f<.35&&d.y>6&&Math.abs(d.x-ball.x)<3&&Math.abs(d.y+20-ball.y)<6&&!ball.checked){ball.checked=true;
      if(Math.random()<(ball.shooter===0?lvl().block*1.6:.55)){RG.sfx('hit');flash={t:1,txt:'BLOCKED!'};ball={state:'loose',x:ball.x,y:ball.y,vx:(d.t===0?-1:1)*-18,vy:6,spin:0,by:-1};say(d.t===0?'You blocked it!':'Blocked by the CPU!');return}}
    if(f>=1){if(ball.make){score[ball.shooter]+=ball.pts;RG.sfx('swish');setTimeout(()=>RG.sfx(ball.shooter===0?'cheer':'bad'),120);RG.buzz(20);
        flash={t:1.2,txt:ball.pts===3?'THREE!':'BUCKET!'};say(`${names[ball.shooter]} scored ${ball.pts}.`);ball={state:'net',x:HOOP.x,y:HOOP.y,vy:-4,shooter:ball.shooter,t:0}}
      else{RG.sfx('rim');const out=(Math.random()<.5?-1:1);ball={state:'loose',x:HOOP.x-1,y:HOOP.y+1,vx:out*(6+Math.random()*14)-6,vy:12+Math.random()*10,spin:0,by:-1};say('Off the rim! Rebound!')}}}
  else if(ball.state==='net'){ball.t+=dt;ball.y-=24*dt;if(ball.y<2){ball.y=2}if(ball.t>.9){const s=ball.shooter;if(score[s]>=cfg.to){end(s);return}turnover(1-s,0)}}
  else if(ball.state==='loose'){ball.vy-=G*.8*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.y<2){ball.y=2;ball.vy=Math.abs(ball.vy)*.6;ball.vx*=.85;if(ball.vy>4)RG.sfx('bounce');if(ball.vy<3)ball.vy=0}
    if(ball.x<XMIN+3||ball.x>97){ball.vx=-ball.vx*.6;ball.x=Math.max(XMIN+3,Math.min(97,ball.x))}
    for(const p of P){if(p.stun>0)continue;if(Math.abs(p.x-ball.x)<3.2&&ball.y<p.y+22){RG.sfx('bounce');
      if(p.t===poss){ball={state:'held',by:p.t,x:p.x,y:10};clock=Math.max(clock,6);say(p.t===0?'Your rebound. Go again.':'CPU keeps it.');updButtons()}

}
function turnover(team,delay){paused=true;updButtons();setTimeout(()=>{if(over)return;setup(team);paused=false;say(team===0?'Your ball.':'CPU\'s ball. Defend!')},delay||700)}
function end(w){over=w;paused=true;RG.sfx(w===0?'fanfare':'lose');setTimeout(()=>{ov='end';overlay()},900)}

/* ---------- computer ---------- */
let cpuPlan={tx:70,wait:0};
function cpuThink(dt,L){
  const c=P[1],me=P[0];if(c.stun>0){c.stun-=dt;c.vx=0;return}
  if(c.shoot||c.y>0)return;
  if(ball.state==='held'&&ball.by===1){ // attack
    cpuPlan.wait-=dt;
    if(cpuPlan.wait<=0){cpuPlan.tx=55+Math.random()*32;cpuPlan.wait=.6+Math.random()*1.2}
    const gap=Math.abs(me.x-c.x),open=gap>6||me.x<c.x,inRange=HOOP.x-c.x<26;
    const wantShot=(inRange&&Math.random()<dt*(open?2.6:.7))||(HOOP.x-c.x<7&&Math.random()<dt*4)||clock<2.2;
    if(wantShot){c.vx=0;c.vy=JUMP;const q=Math.min(1,Math.max(0,L.shot+(Math.random()-.5)*.5));c.shoot={t:0,at:.36+(1-q)*.3*(Math.random()<.5?-1:1),q};return}
    c.vx=Math.sign(cpuPlan.tx-c.x)*SPEED*(Math.abs(cpuPlan.tx-c.x)>1?.9:0);
  } else if(ball.state==='held'&&ball.by===0){ // defend: stay between you and the hoop
    const tx=Math.min(HOOP.x-3,me.x+5.5);c.vx=Math.max(-1,Math.min(1,(tx-c.x)/2))*SPEED*L.chase;
    if(me.shoot&&Math.abs(me.x-c.x)<7&&c.y===0&&Math.random()<L.block*3*dt*10){c.vy=JUMP*.95}
    if(!me.shoot&&Math.abs(me.x-c.x)<4&&Math.random()<L.steal*dt){if(Math.random()<.5){RG.sfx('slide');flash={t:.9,txt:'STOLEN!'};say('The CPU stole it!');turnover(1,700)}else{c.stun=.5}}
  } else if(ball.state==='loose'){c.vx=Math.sign(ball.x-c.x)*SPEED*L.chase}
  else c.vx=0;
}

/* ---------- your controls ---------- */
function updButtons(){const off=ball&&ball.state==='held'&&ball.by===0;$('#act').textContent=off?'SHOOT':'BLOCK';$('#act2').textContent=off?'FAKE':'STEAL';$('#act2').disabled=false}
function actDown(){if(paused||ov)return;const me=P[0];
  if(ball.state==='held'&&ball.by===0)startShot(me);
  else if(me.y===0&&me.stun<=0){me.vy=JUMP;RG.sfx('tap')}}
function actUp(){const me=P[0];if(me.shoot&&ball.state==='held'&&ball.by===0)release(me,shotQuality(me.shoot.t))}
function act2(){if(paused||ov)return;const me=P[0],c=P[1];
  if(ball.state==='held'&&ball.by===0){ // pump fake: the CPU may jump
    if(Math.abs(me.x-c.x)<8&&c.y===0&&Math.random()<.55){c.vy=JUMP*.9;say('Pump fake! They bit.')}else say('Fake.');RG.sfx('slide');return}
  if(stealCool>0)return;stealCool=1;
  if(ball.state==='held'&&ball.by===1&&Math.abs(me.x-c.x)<5){if(Math.random()<.35+.15*(cfg.level==='easy')-.1*(cfg.level==='hard')){RG.sfx('good');flash={t:.9,txt:'STEAL!'};say('You stole it!');turnover(0,600)}else{me.stun=.7;RG.sfx('error');say('Missed the steal. Reach!')}}
  else{RG.sfx('click');say('Get closer to steal.')}}
function hint(){if(!ball||over)return;const me=P[0];
  if(ball.state==='held'&&ball.by===0){const ch=Math.round(baseChance(me.x)*contest(me)*100);say(`From here: about ${ch}% with a perfect release. ${HOOP.x-me.x<7?'Lay it up!':contest(me)<1?'Step away from the defender first.':me.x<ARC?'This would be a three.':'Get closer for a higher percentage.'}`)}
  else say('Stay between the CPU and the hoop. Tap BLOCK when they jump; STEAL when you are right next to them.');RG.sfx('hint')}

/* ---------- drawing ---------- */
let S=1,DPR=1,W=0,H=0,XMIN=0;
function size(){DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(W/78,H/62);XMIN=Math.max(0,99-W/S)}
const X=x=>W-(99-x)*S,Y=y=>H-6*S-y*S;
function draw(){
  const k=COL();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  // dusk sky, skyline and fence
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3b1d6e');sky.addColorStop(.55,'#c4467a');sky.addColorStop(1,'#ff9a52');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(30,10,50,.75)';for(let i=0;i<14;i++){const bw=W/14,bh=H*(.18+((i*37)%11)/30);ctx.fillRect(i*bw,Y(14)-bh,bw-2,bh)}
  ctx.fillStyle='rgba(255,220,140,.5)';for(let i=0;i<40;i++){const x=((i*97)%100)/100*W,y=Y(14)-((i*53)%40)/100*H*.5;ctx.fillRect(x,y,2,3)}
  ctx.strokeStyle='rgba(20,8,35,.6)';ctx.lineWidth=1;for(let x=0;x<W;x+=10){ctx.beginPath();ctx.moveTo(x,Y(14));ctx.lineTo(x+10,Y(26));ctx.stroke()}
  // court floor in perspective strip
  const fl=ctx.createLinearGradient(0,Y(14),0,H);fl.addColorStop(0,k.court2);fl.addColorStop(1,k.court);ctx.fillStyle=fl;ctx.fillRect(0,Y(14),W,H-Y(14));
  ctx.fillStyle=k.paint+'aa';ctx.fillRect(X(74),Y(5),(96-74)*S,4*S);
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(ARC),Y(14));ctx.lineTo(X(ARC),Y(-2));ctx.stroke();
  ctx.font=`800 ${3*S}px Outfit,system-ui`;ctx.fillStyle='rgba(255,255,255,.55)';ctx.textAlign='center';ctx.fillText('3PT',X(ARC-5),Y(8));
  // hoop
  ctx.fillStyle='#2b2b33';ctx.fillRect(X(95),Y(44),1.4*S,44*S);ctx.fillRect(X(90.5),Y(44),5.5*S,1.4*S);
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(X(90.5),Y(43),1.2*S,15*S);ctx.strokeStyle='#ff3f6c';ctx.lineWidth=2;ctx.strokeRect(X(90.5)+1,Y(36),1.2*S-2,6*S);
  ctx.strokeStyle='#ff5a1a';ctx.lineWidth=Math.max(2,S*.6);ctx.beginPath();ctx.moveTo(X(84.5),Y(30));ctx.lineTo(X(90.5),Y(30));ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(X(84.5+i*1.5),Y(30));ctx.lineTo(X(85.5+i*1.1),Y(23));ctx.stroke()}
  // shadows and players
  for(const p of P){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(X(p.x),Y(0),4*S*(1-p.y/80),1*S,0,0,7);ctx.fill()}
  P.forEach(p=>drawPlayer(p,p.t===0?k.you:k.cpu));
  // ball
  if(ball){const bx=X(ball.x),by=Y(ball.y),br=1.6*S;const g=ctx.createRadialGradient(bx-br*.3,by-br*.3,br*.2,bx,by,br);g.addColorStop(0,'#ffb26b');g.addColorStop(1,k.ball);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();ctx.strokeStyle='#5a2500';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx-br,by);ctx.lineTo(bx+br,by);ctx.moveTo(bx,by-br);ctx.lineTo(bx,by+br);ctx.stroke()}
  // front of the rim over the ball
  ctx.strokeStyle='#ff5a1a';ctx.lineWidth=Math.max(2,S*.6);ctx.beginPath();ctx.moveTo(X(84.5),Y(30));ctx.lineTo(X(86),Y(30));ctx.stroke();
  // shot meter
  const me=P[0];if(me&&me.shoot){const q=shotQuality(me.shoot.t),mx=X(me.x)-6*S,my=Y(me.y+30);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(mx,my,12*S,1.6*S);
    ctx.fillStyle=RG.c('#57e39b');ctx.fillRect(mx+12*S*.42,my,12*S*.16,1.6*S);ctx.fillStyle='#fff';ctx.fillRect(mx+Math.min(1,me.shoot.t/.72)*12*S-1,my-2,3,1.6*S+4)}
  if(flash){ctx.save();ctx.globalAlpha=Math.min(1,flash.t*2);ctx.font=`${9*S}px Bungee,Impact`;ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.strokeStyle='#3b1d6e';ctx.lineWidth=S*1.2;ctx.strokeText(flash.txt,W/2,H*.32);ctx.fillText(flash.txt,W/2,H*.32);ctx.restore()}
  // shot clock
  if(ball&&ball.state==='held'){ctx.font=`800 ${3.4*S}px Outfit,system-ui`;ctx.textAlign='left';ctx.fillStyle=clock<4?'#ff5a5a':'#fff';ctx.fillText('⏱ '+Math.ceil(clock),X(XMIN+3),Y(52))}
  $('#board').innerHTML=`<div class="team${poss===0?' on':''}"><i style="background:${k.you}"></i><span>You</span></div><div class="sc">${score?score[0]:0} – ${score?score[1]:0}<small>FIRST TO ${cfg.to}</small></div><div class="team r${poss===1?' on':''}"><span>CPU</span><i style="background:${k.cpu}"></i></div>`;
}
function drawPlayer(p,c){
  const x=X(p.x),y=Y(p.y),s=S,leg=Math.sin(p.anim)*(p.y>0?0:1),f=p.face;
  ctx.lineCap='round';ctx.strokeStyle='#3a2318';ctx.lineWidth=2.2*s;
  ctx.beginPath();ctx.moveTo(x-1*s,y-8*s);ctx.lineTo(x-1*s+leg*2*s,y);ctx.moveTo(x+1*s,y-8*s);ctx.lineTo(x+1*s-leg*2*s,y);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(x-2.2*s+leg*2*s,y-1*s,2.6*s,1.1*s);ctx.fillRect(x-.4*s-leg*2*s,y-1*s,2.6*s,1.1*s);
  ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x-3*s,y-19*s,6*s,11.5*s,2*s);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`800 ${3.6*s}px Outfit,system-ui`;ctx.textAlign='center';ctx.fillText(p.t===0?'7':'23',x,y-11.5*s);
  if(RG.prefs.cb!=='off'&&p.t===1){ctx.fillStyle='#fff';ctx.fillRect(x-3*s,y-19*s,6*s,1.2*s)}
  const up=(p.shoot||p.y>4);ctx.strokeStyle='#3a2318';ctx.lineWidth=1.6*s;ctx.beginPath();
  if(up){ctx.moveTo(x-2*s,y-17*s);ctx.lineTo(x-1*s+f*.5*s,y-25*s);ctx.moveTo(x+2*s,y-17*s);ctx.lineTo(x+1*s+f*.5*s,y-25*s)}else{ctx.moveTo(x-2.5*s,y-17*s);ctx.lineTo(x-3.5*s,y-10*s);ctx.moveTo(x+2.5*s,y-17*s);ctx.lineTo(x+3.2*s*f,y-11*s)}ctx.stroke();
  ctx.fillStyle='#6b4029';ctx.beginPath();ctx.arc(x,y-22*s,2.6*s,0,7);ctx.fill();
  ctx.fillStyle=c;ctx.fillRect(x-2.6*s,y-23.5*s,5.2*s,1*s);
  if(p.stun>0){ctx.fillStyle='#ffd23f';ctx.font=`${3*s}px system-ui`;ctx.fillText('✦',x,y-27*s)}
}
