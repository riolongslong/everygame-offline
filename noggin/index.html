<style>
/* Noggin League: one-on-one big-head football under the floodlights. Canvas match, DOM menus. Deliberately one dark look. */
:root{--night:#050b17;--panel:#0d1830;--line:rgba(255,255,255,.16);--text:#f3f7ff;--muted:#9fb1d4;--gold:#ffd84d;--gold-d:#b8860b;--you:#38bdf8;--cpu:#fb7185;
  --display:'Lilita One','Arial Black',sans-serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-sizing:border-box;gap:6px;
  background:radial-gradient(70% 50% at 50% 0%,#1b2f5c 0%,transparent 70%),var(--night)}
header{width:100%;max-width:1100px;display:flex;align-items:center;gap:8px}
.wm{font:400 clamp(20px,6vw,28px) var(--display);white-space:nowrap;color:#fff;text-shadow:0 3px 0 #1a2c66,0 0 18px rgba(56,189,248,.35)}

button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.hb{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font:800 13px var(--cond);letter-spacing:.08em;text-transform:uppercase}
.stage{position:relative;width:100%;max-width:1100px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.cv{position:relative;width:100%;max-height:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:#000}
.cv canvas{width:100%;height:100%;display:block;touch-action:none}
/* touch pads */
.pads{width:100%;max-width:1100px;display:flex;justify-content:space-between;gap:10px;user-select:none;-webkit-user-select:none}
.pad{display:flex;gap:10px;align-items:center}
.pad button{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);font:400 26px var(--display);display:grid;place-items:center;touch-action:none}
.pad button.on{background:rgba(255,255,255,.25)}
.pad button.k{width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#ffe98a,var(--gold));color:#2a1d00;border-color:#fff;font-size:20px;box-shadow:0 5px 0 var(--gold-d)}
.pad button.k.on{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.pad button.j{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.6)}
.pad.p2 button.j{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.6)}
.pad.p2 button.k{background:radial-gradient(circle at 35% 30%,#ffc0cb,var(--cpu));color:#3a0612;box-shadow:0 5px 0 #9f1239}
@media (orientation:landscape) and (max-height:560px){
  header{position:absolute;top:max(4px,env(safe-area-inset-top,0px));left:0;right:0;padding:0 12px;z-index:5;pointer-events:none;max-width:none}header>*{pointer-events:auto}.wm{display:none}
  .stage{max-width:none}.cv{height:100%;width:auto;max-width:100%}
  .pads{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom,0px));padding:0 max(14px,env(safe-area-inset-left,0px));box-sizing:border-box;max-width:none;pointer-events:none;z-index:4}.pad{pointer-events:auto}
  .pad button{opacity:.75;width:58px;height:58px}.pad button.k{width:70px;height:70px}}
@media (hover:hover) and (pointer:fine){.pads.auto{display:none}}
.keys{color:var(--muted);font:600 13px var(--cond);letter-spacing:.06em;text-align:center}

.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:14px;background:rgba(3,7,16,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

.sheet p{margin:0;line-height:1.45}
.big{display:grid;gap:10px}
.btn{background:var(--gold);color:#2a1d00;font:400 19px var(--display);letter-spacing:.4px;padding:12px 18px;border-radius:14px;box-shadow:0 5px 0 var(--gold-d)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn.alt{background:rgba(255,255,255,.07);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.title{text-align:center;display:grid;gap:4px;justify-items:center}

.heads{display:flex;justify-content:center;margin-top:-4px}

.pick span{font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pick i{font-style:normal;font:600 12px var(--cond);color:var(--gold)}
.fl{display:inline-block;width:18px;height:12px;border-radius:2px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.f-ENG{background:linear-gradient(90deg,transparent 42%,#ce1124 42% 58%,transparent 58%),linear-gradient(transparent 38%,#ce1124 38% 62%,transparent 62%),#fff}
.f-FRA{background:linear-gradient(90deg,#0055a4 33.3%,#fff 33.3% 66.6%,#ef4135 66.6%)}
.f-BRA{background:radial-gradient(circle,#002776 0 18%,transparent 19%),linear-gradient(#fedf00,#fedf00) center/58% 58% no-repeat,#009c3b}
.f-ARG{background:linear-gradient(#74acdf 33.3%,#fff 33.3% 66.6%,#74acdf 66.6%)}
.f-ESP{background:linear-gradient(#aa151b 25%,#f1bf00 25% 75%,#aa151b 75%)}
.f-GER{background:linear-gradient(#000 33.3%,#dd0000 33.3% 66.6%,#ffce00 66.6%)}
.f-ITA{background:linear-gradient(90deg,#009246 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%)}
.f-NED{background:linear-gradient(#ae1c28 33.3%,#fff 33.3% 66.6%,#21468b 66.6%)}
table.lg{width:100%;border-collapse:collapse;font:600 15px var(--cond);letter-spacing:.02em}
table.lg th{font-size:11px;letter-spacing:.12em;color:var(--muted);text-align:right;padding:4px 5px;font-weight:800}
table.lg td{text-align:right;padding:6px 5px;border-top:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
table.lg td.t,table.lg th.t{text-align:left}
table.lg tr.me td{background:rgba(56,189,248,.14);color:#fff}
table.lg td.pts{font-weight:800;color:var(--gold)}
.fix{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05)}
.fix img{width:58px;height:58px}
.fix .v{font:400 22px var(--display);color:var(--gold)}
.fix .n{font:400 17px var(--display);display:grid;line-height:1.05}.fix .n span{font:700 12px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.shop{display:grid;gap:8px}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.up .ic{font-size:26px}
.up b{font:400 17px var(--display)}.up .bars{display:flex;gap:3px;margin-top:4px}.up .bars i{width:18px;height:7px;border-radius:3px;background:rgba(255,255,255,.15)}.up .bars i.on{background:var(--gold)}
.up button{min-width:96px}
.cash{font:400 22px var(--display);color:#7dfa9a}
.res{text-align:center;display:grid;gap:4px}
.res .sc{font:400 64px var(--display);line-height:1}.res .sc span{color:var(--you)}.res .sc em{font-style:normal;color:var(--cpu)}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font:800 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1d00}
.note{color:var(--muted);font:600 13px var(--cond);letter-spacing:.04em}
.trophy{font-size:64px;text-align:center;filter:drop-shadow(0 6px 14px rgba(255,216,77,.5))}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

<div id="app">
  <header><div class="wm">Noggin <b>League</b></div><div class="grow"></div><span id="snd"></span><button class="hb" id="pauseBtn">Pause</button><button class="hb" id="menuBtn">Menu</button></header>
  <div class="stage">

    <div class="pads auto" id="pads">
      <div class="pad p1"><button data-p="0" data-c="l" aria-label="Left">◀</button><button data-p="0" data-c="r" aria-label="Right">▶</button><button class="j" data-p="0" data-c="j" aria-label="Jump">▲</button><button class="k" data-p="0" data-c="k" aria-label="Kick">KICK</button></div>
      <div class="pad p2" id="pad2" hidden><button class="k" data-p="1" data-c="k" aria-label="Player 2 kick">KICK</button><button class="j" data-p="1" data-c="j" aria-label="Player 2 jump">▲</button><button data-p="1" data-c="l" aria-label="Player 2 left">◀</button><button data-p="1" data-c="r" aria-label="Player 2 right">▶</button></div>
    </div>

  </div>
</div>
<div id="ov"></div>

<script>
/* ===== EveryGame Offline™ kit: synth soundtrack, your own music, sound effects, colourblind modes, settings ===== */
const RG=(()=>{
  const KEY='rg.prefs';
  const DEF={music:true,sfx:true,cb:'off',vol:.7,mv:.8,src:'built'};
  let P=(()=>{try{return{...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return{...DEF}}})();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  const listeners=[];let cfg={game:'hub',accent:'#ffd166'};

  /* ---------- colourblind ---------- */
  const I3=[[1,0,0],[0,1,0],[0,0,1]];
  const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,v,k)=>s+v*B[k][j],0)));
  const sub=(A,B)=>A.map((r,i)=>r.map((v,j)=>v-B[i][j]));
  const add=(A,B)=>A.map((r,i)=>r.map((v,j)=>v+B[i][j]));
  // daltonise: out = rgb + C·(rgb − sim(rgb)), moving lost contrast into channels the viewer can see
  const SIM={rg:[[.625,.375,0],[.7,.3,0],[0,.3,.7]],by:[[.95,.05,0],[0,.433,.567],[0,.475,.525]]};
  const COR={rg:[[0,0,0],[.7,1,0],[.7,0,1]],by:[[1,0,.7],[0,1,.7],[0,0,0]]};
  const MAT={};for(const k of ['rg','by'])MAT[k]=add(I3,mul(COR[k],sub(I3,SIM[k])));
  MAT.mono=[[.3,.59,.11],[.3,.59,.11],[.3,.59,.11]];
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}
  function color(hex){ // for canvas games: pass a colour through the active mode
    if(P.cb==='off'||typeof hex!=='string'||hex[0]!=='#')return hex;
    let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const a=h.length===8?h.slice(6):'';const v=[0,2,4].map(i=>parseInt(h.substr(i,2),16));
    const m=MAT[P.cb];let o=m.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
    if(P.cb==='mono'){const l=o[0];const c=l<128?l*.85:Math.min(255,l*1.12);o=[c,c,c]}
    return '#'+o.map(x=>clamp(x).toString(16).padStart(2,'0')).join('')+a;
  }
  function svgFilters(){
    if(document.getElementById('rg-cb-svg'))return;
    const row=m=>m.map(r=>r.map(n=>n.toFixed(3)).join(' ')+' 0 0').join(' ')+' 0 0 0 1 0';
    const d=document.createElement('div');d.id='rg-cb-svg';d.setAttribute('aria-hidden','true');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg width="0" height="0"><filter id="rg-cb-rg" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.rg)}"/></filter><filter id="rg-cb-by" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${row(MAT.by)}"/></filter><filter id="rg-cb-mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.25" intercept="-.1"/><feFuncG type="linear" slope="1.25" intercept="-.1"/><feFuncB type="linear" slope="1.25" intercept="-.1"/></feComponentTransfer></filter></svg>`;
    document.body.appendChild(d);
  }
  function applyCb(){
    const r=document.documentElement;r.dataset.cb=P.cb;
    if(cfg.cbFilter===false){r.style.filter='';return}
    r.style.filter=P.cb==='off'?'':`url(#rg-cb-${P.cb})`;
  }

  /* ---------- audio graph ----------
     Everything is synthesised with WebAudio, styled as a neon synth score: detuned saw pads, glassy arps,
     sub bass with sidechain pump, gated drums, stereo ping-pong delay and a generated reverb.
     music: voices -> (pad bus, ducked by the kick) -> music bus -> master -> limiter -> speakers
     sfx:   voices -> sfx bus -> master.  Your own track: <audio> -> own bus -> master.
     No AudioContext is created before the player's first touch, click or key press. */
  let ac=null,master=null,musicBus=null,padBus=null,sfxBus=null,ownBus=null,noiseBuf=null,dl=null,dr=null,verb=null,gestured=false;
  const mGain=()=>P.music&&P.src!=='own'?.3*P.mv:0, oGain=()=>P.music&&P.src==='own'?.95*P.mv:0;
  function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
  function audio(){
    if(ac)return ac;if(!gestured)return null;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{ac=new C()}catch(e){return null}
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;lim.connect(ac.destination);
    master=ac.createGain();master.gain.value=P.vol;master.connect(lim);
    musicBus=ac.createGain();musicBus.gain.value=mGain();musicBus.connect(master);
    padBus=ac.createGain();padBus.connect(musicBus);
    sfxBus=ac.createGain();sfxBus.gain.value=P.sfx?.85:0;sfxBus.connect(master);
    ownBus=ac.createGain();ownBus.gain.value=oGain();ownBus.connect(master);
    // ping-pong delay, shared by music and sfx sends
    dl=ac.createDelay(1);dr=ac.createDelay(1);const fl=ac.createGain(),fr=ac.createGain(),tone=ac.createBiquadFilter(),wet=ac.createGain();
    dl.delayTime.value=.24;dr.delayTime.value=.36;fl.gain.value=.38;fr.gain.value=.38;tone.type='lowpass';tone.frequency.value=3800;wet.gain.value=.5;
    let pl=wet,pr=wet;if(ac.createStereoPanner){const a=ac.createStereoPanner(),b=ac.createStereoPanner();a.pan.value=-.7;b.pan.value=.7;a.connect(master);b.connect(master);pl=a;pr=b}
    dl.connect(tone);tone.connect(fl).connect(dr);dr.connect(fr).connect(dl);dl.connect(pl);dr.connect(pr);if(pl===wet)wet.connect(master);
    // reverb
    verb=ac.createConvolver();verb.buffer=impulse(2.4,2.6);const vg=ac.createGain();vg.gain.value=.55;verb.connect(vg).connect(master);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const ch=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    bindOwn();
    return ac;
  }
  const pulse={};
  function wave(o,type){
    if(type==='pulse'||type==='pulse25'){const d=type==='pulse'?.125:.25;
      if(!pulse[d]){const N=32,re=new Float32Array(N),im=new Float32Array(N);for(let k=1;k<N;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);pulse[d]=ac.createPeriodicWave(re,im)}
      o.setPeriodicWave(pulse[d])}
    else o.type=type;
  }
  function sends(g,{echo=0,rev=0}){
    if(echo&&dl){const s=ac.createGain();s.gain.value=echo;g.connect(s).connect(dl)}
    if(rev&&verb){const s=ac.createGain();s.gain.value=rev;g.connect(s).connect(verb)}
  }
  function panTo(node,pan){if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);return p}return node}
  /* one voice: oscillators (optionally a detuned stack), filter with its own envelope, amp envelope, pan, sends */
  function voice(bus,{f,t,dur=.2,type='sine',vol=.2,a=.005,r=.1,f2=null,glide=null,det=0,stack=1,lp=null,lp2=null,q=1,hp=null,vib=0,fm=0,fmr=2,pan=0,echo=0,rev=0}){
    const g=ac.createGain(),end=t+dur+r;let out=g;
    let n=g;const into=[];
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.Q.value=q;fl.frequency.setValueAtTime(lp,t);if(lp2)fl.frequency.exponentialRampToValueAtTime(Math.max(40,lp2),t+Math.max(.02,dur));fl.connect(n);n=fl}
    if(hp){const fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;fl.connect(n);n=fl}
    for(let k=0;k<stack;k++){
      const o=ac.createOscillator();wave(o,type);const d=stack>1?(k/(stack-1)-.5)*2*det:det;o.detune.value=d;
      o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+(glide||dur));
      if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg).connect(o.frequency);l.start(t);l.stop(end)}
      if(fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=f*fmr;mg.gain.setValueAtTime(f*fm,t);mg.gain.exponentialRampToValueAtTime(Math.max(1,f*fm*.05),t+dur+r);m.connect(mg).connect(o.frequency);m.start(t);m.stop(end+.05)}
      o.connect(n);o.start(t);o.stop(end+.05);into.push(o)}
    const v=vol/Math.sqrt(stack);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,end);

  if(big){ctx.fillStyle='#ef4444';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,b.r,i*2.09,i*2.09+.7);ctx.fill()}}
  else{ctx.fillStyle='#111';ctx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;ctx.lineTo(Math.cos(a)*b.r*.38,Math.sin(a)*b.r*.38)}ctx.fill();
    for(let i=0;i<5;i++){const a=i*1.2566+.31;ctx.beginPath();ctx.arc(Math.cos(a)*b.r*.92,Math.sin(a)*b.r*.92,b.r*.26,0,7);ctx.fill()}}
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.stroke();ctx.restore()}
function hud(t){
  const [a,b]=M.p;ctx.save();ctx.textBaseline='alphabetic';ctx.lineJoin='round';
  const label=(txt,x,y,size,fill,align,stroke='#3a0000',lw=5)=>{ctx.font=`${size}px "Lilita One","Arial Black",sans-serif`;ctx.textAlign=align;ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y)};
  // dark corner panels like a stadium scoreboard
  ctx.fillStyle='rgba(20,22,26,.82)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(240,0);ctx.lineTo(196,96);ctx.lineTo(0,96);ctx.fill();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-240,0);ctx.lineTo(W-196,96);ctx.lineTo(W,96);ctx.fill();
  label(a.team.nation.toUpperCase(),14,28,22,'#ff3b30','left','#2a0000',4);label(b.team.nation.toUpperCase(),W-14,28,22,'#ff3b30','right','#2a0000',4);
  label(String(M.score[0]),16,84,50,'#fff','left','#000',6);label(String(M.score[1]),W-16,84,50,'#fff','right','#000',6);
  ctx.font='bold 14px "Barlow Condensed",sans-serif';ctx.fillStyle='#cfd8dc';ctx.textAlign='left';ctx.fillText(short(a.team.star.name).toUpperCase(),62,82);ctx.textAlign='right';ctx.fillText(short(b.team.star.name).toUpperCase(),W-62,82);
  const tm=Math.max(0,Math.ceil(M.time));
  label(M.state==='golden'?'GOLDEN GOAL':`${Math.floor(tm/60)}:${String(tm%60).padStart(2,'0')}`,W/2,40,34,tm<=10&&M.state!=='golden'?'#ff5252':'#5dff6a','center','#0b3d14',6);
  if(M.msgT>0){ctx.globalAlpha=Math.min(1,M.msgT*2);label(M.msg,W/2,H*.4,M.msg==='GOAL!'?104:56,'#ffd84d','center','#7a1d00',12)}
  if(M.state==='paused'){ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);label('PAUSED',W/2,H/2,64,'#fff','center','#000',8)}
  ctx.restore()}

/* ---------- loop ---------- */
let lastT=0,raf=0;
function loop(now){raf=requestAnimationFrame(loop);let dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;if(!M)return;
  if(M.state!=='paused'){
    if(M.msgT>0)M.msgT-=dt;if(M.flash>0)M.flash-=dt*2;if(M.shake>0)M.shake-=dt;
    for(const q of M.parts){q.vy+=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt*1.2}M.parts=M.parts.filter(q=>q.life>0);
    for(const g of [0,1])if(!(M.fx['goal'+g]>0))M.gt[g]+=(BASE_GT-M.gt[g])*Math.min(1,dt*4);
    if(M.state==='ready'){M.t-=dt;M.p.forEach(p=>{p.vx=0});if(M.t<=0)M.state=M.time<=0?'golden':'play'}
    else if(M.state==='goal'){M.t-=dt;const n=6;for(let i=0;i<n;i++)stepBallOnly(dt/n);if(M.t<=0){if(M.time<=0){return finish()}kickoff(M.conceder,false)}}
    else if(M.state==='play'||M.state==='golden'){
      for(const p of M.p)if(p.ctrl==='cpu')think(p,dt);else readInput(p);
      const n=6;for(let i=0;i<n;i++){step(dt/n);if(M.state==='goal')break}
      if(M.state==='play'){const before=Math.ceil(M.time);M.time-=dt;if(Math.ceil(M.time)!==before&&M.time<=5&&M.time>0)RG.sfx('tick');
        if(M.time<=0){M.time=0;if(M.score[0]===M.score[1]&&M.mode==='league'){M.state='golden';M.msg='GOLDEN GOAL';M.msgT=1.4;RG.sfx('buzzer')}else{RG.sfx('buzzer');return finish()}}}
    }
  }
  draw()}
function stepBallOnly(dt){const b=M.ball;b.vy+=GRAV*.44*dt;b.vx*=1-1.5*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y+b.r>GROUND){b.y=GROUND-b.r;b.vy*=-.5}b.x=Math.max(b.r,Math.min(W-b.r,b.x))}
function finish(){if(M.state==='over')return;M.state='over';M.msg='FULL TIME';M.msgT=2;RG.sfx('whistle');const sc=M.score.slice();setTimeout(()=>M.onEnd&&M.onEnd(sc),1400)}

/* ---------- input ---------- */
const KEYS={0:{l:['ArrowLeft'],r:['ArrowRight'],j:['ArrowUp'],k:[' ','Space']},1:{l:['a','A'],r:['d','D'],j:['w','W'],k:['s','S','f','F']}};
const held=new Set(),touch=[{l:0,r:0,j:0,k:0},{l:0,r:0,j:0,k:0}];
addEventListener('keydown',e=>{if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();held.add(e.key);if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause()});
addEventListener('keyup',e=>held.delete(e.key));
addEventListener('blur',()=>held.clear());
function keyFor(slot,c){return KEYS[slot][c].some(k=>held.has(k))}
function readInput(p){
  // one player: arrows or WASD both drive you. Two players: left uses WASD, right uses the arrows.
  const two=M.mode==='two',slots=two?(p.side===0?[1]:[0]):[0,1],t=touch[two?p.side:0];
  for(const c of ['l','r','j','k'])p.inp[c]=(slots.some(s=>keyFor(s,c))||t[c])?1:0}
document.querySelectorAll('.pad button').forEach(btn=>{const p=+btn.dataset.p,c=btn.dataset.c;
  const on=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);touch[p][c]=1;btn.classList.add('on')},off=()=>{touch[p][c]=0;btn.classList.remove('on')};
  btn.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>btn.addEventListener(t,off));btn.addEventListener('contextmenu',e=>e.preventDefault())});
function togglePause(){if(!M||M.state==='over')return;if(M.state==='paused'){M.state=M.resume;RG.sfx('click')}else if(!ov){M.resume=M.state;M.state='paused';RG.sfx('click')}}
$('#pauseBtn').onclick=togglePause;
$('#menuBtn').onclick=()=>{if(M&&M.state!=='over'&&M.state!=='paused'){M.resume=M.state;M.state='paused'}show('menu')};

/* ================= LEAGUE ================= */
let L=ld('league',null),opts=ld('opts',{len:60,level:'normal'});
const COST=[200,350,550,800,1100];
function newLeague(code){
  const teams=TEAMS.map(t=>t.code);const others=teams.filter(c=>c!==code);
  L={team:code,cash:L?L.cash:0,up:L&&L.team===code?L.up:{speed:0,jump:0,kick:0},season:(L?L.season:0)+1,round:0,
     order:others.sort(()=>Math.random()-.5),table:Object.fromEntries(teams.map(c=>[c,{p:0,w:0,d:0,l:0,f:0,a:0,pts:0}])),done:false,last:null};
  if(L.season===1)L.cash=0;sv('league',L)}
function strength(code){const t=T[code];return(t.star.v-60)/35}
function aiSkill(code){const div=Math.min(.3,(L?L.season-1:0)*.08);return Math.max(.15,Math.min(.97,.25+strength(code)*.45+div+({easy:-.18,normal:0,hard:.15}[opts.level]||0)))}
function record(a,b,ga,gb){const A=L.table[a],B=L.table[b];A.p++;B.p++;A.f+=ga;A.a+=gb;B.f+=gb;B.a+=ga;
  if(ga>gb){A.w++;B.l++;A.pts+=3}else if(gb>ga){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
function simGoals(code){const s=strength(code);let g=0;const lam=.9+s*1.6;let p=Math.exp(-lam),c=p,u=Math.random();while(u>c&&g<7){g++;p*=lam/g;c+=p}return g}
function simRound(){ // the other six teams play each other this round
  const me=L.team,opp=L.order[L.round],rest=TEAMS.map(t=>t.code).filter(c=>c!==me&&c!==opp).sort(()=>Math.random()-.5);
  const res=[];for(let i=0;i<rest.length;i+=2){const a=rest[i],b=rest[i+1],ga=simGoals(a),gb=simGoals(b);record(a,b,ga,gb);res.push([a,b,ga,gb])}return res}
const sorted=()=>Object.entries(L.table).sort((x,y)=>y[1].pts-x[1].pts||(y[1].f-y[1].a)-(x[1].f-x[1].a)||y[1].f-x[1].f);
function tableHTML(){return`<table class="lg"><tr><th class="t">#</th><th class="t">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${sorted().map(([c,r],i)=>`<tr class="${c===L.team?'me':''}"><td class="t">${i+1}</td><td class="t"><i class="fl f-${c}"></i> ${T[c].nation}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.f-r.a>0?'+':''}${r.f-r.a}</td><td class="pts">${r.pts}</td></tr>`).join('')}</table>`}
function playLeagueMatch(){
  const opp=L.order[L.round];
  start({mode:'league',home:T[L.team],away:T[opp],homeUp:L.up,c0:'human',c1:'cpu',s1:aiSkill(opp),len:opts.len,onEnd:sc=>{
    record(L.team,opp,sc[0],sc[1]);const others=simRound();
    const earn=(sc[0]>sc[1]?300:sc[0]===sc[1]?120:40)+sc[0]*25;L.cash+=earn;L.round++;L.last={opp,sc,earn,others};
    if(L.round>=L.order.length)L.done=true;sv('league',L);show(L.done?'season':'result')}})}

/* ================= SCREENS ================= */
let ov=null,pick={};
function show(name){ov=name;render();if(name&&M&&M.state!=='over'&&M.state!=='paused'){M.resume=M.state;M.state='paused'}}
function close(){ov=null;$('#ov').innerHTML='';if(M&&M.state==='paused')M.state=M.resume||'play'}
const teamPick=(sel,key)=>`<div class="picks">${TEAMS.map(t=>`<button class="pick" data-pick="${key}" data-v="${t.code}" aria-pressed="${sel===t.code}"><img src="${headURL(t)}" alt=""><b>${short(t.star.name)}</b><span><i class="fl f-${t.code}"></i> ${t.nation}</span><i>${t.nick}</i></button>`).join('')}</div>`;
function render(){
  let h='';const seg=(k,l)=>`<div class="seg">${l.map(([v,t])=>`<button data-opt="${k}" data-v="${v}" aria-pressed="${String(opts[k])===String(v)}">${t}</button>`).join('')}</div>`;
  if(ov==='menu'){const heads=['BRA','ENG','ARG'].map(c=>`<img src="${headURL(T[c])}" alt="">`).join('');
    h=`<div class="sheet"><div class="title"><div class="heads">${heads}</div><div class="logo">Noggin<b>LEAGUE</b></div><p class="note">Big heads. One minute. No mercy.</p></div>
      <div class="big">${L&&!L.done?`<button class="btn" data-go="league">Continue league<small>Season ${L.season} · ${T[L.team].nation} · £${L.cash}</small></button>`:''}
      <button class="btn${L&&!L.done?' alt':''}" data-go="newleague">${L?'New league':'Start a league'}<small>Pick a star, play every nation, earn cash for upgrades</small></button>
      <div class="row"><button class="btn alt" data-go="quick">Quick match<small>Vs computer</small></button><button class="btn alt" data-go="two">2 players<small>Same device</small></button></div>
      <button class="btn alt" data-go="how">How to play</button></div>
      <h3>Match length</h3>${seg('len',[[45,'45 s'],[60,'60 s'],[90,'90 s']])}<h3>Computer</h3>${seg('level',[['easy','Easy'],['normal','Normal'],['hard','Hard']])}
      ${M&&M.state==='paused'?'<button class="btn alt" data-go="resume">Back to the match</button>':''}</div>`}
  if(ov==='how')h=`<div class="sheet"><h2>How to play</h2>
    <p><b>Score more goals than your opponent before the clock runs out.</b> Head it, volley it, lob the keeper. A league draw goes to a golden goal.</p>
    <p><b>Keyboard:</b> ← → move, ↑ jump, Space kick. In 2 players, the left player uses A D, W to jump and S to kick; the right player uses the arrows and Space.</p>
    <p><b>Touch:</b> use the buttons under the pitch. Turn your phone sideways for a bigger pitch.</p>
    <p><b>Kicks:</b> kick a low ball to drive it, or a ball above your boot to lob it. Jump into the ball for a header.</p>
    <p><b>Power-ups</b> parachute in. Grab one with your head or body, or hit it with the ball:</p>
    <p>${Object.values(POWERS).map(p=>`${p.ic} ${p.name}`).join(' · ')}</p>
    <p><b>League:</b> play the other seven nations. Wins earn £300, draws £120, plus £25 a goal. Spend it on speed, jump and kick power between matches.</p>
    <button class="btn" data-go="menu">Back</button></div>`;
  if(ov==='newleague')h=`<div class="sheet"><h2>Pick your star</h2><p class="note">Upgrades carry on if you keep the same star next season.</p>${teamPick(pick.home||L?.team||'BRA','home')}
    <button class="btn" data-go="startleague">Start the season</button><button class="btn alt" data-go="menu">Back</button></div>`;
  if(ov==='league'&&L){const opp=L.order[L.round];
    h=`<div class="sheet"><h2>Season ${L.season}</h2><div class="row" style="align-items:center"><span class="cash">£${L.cash}</span><span class="note" style="text-align:right">Match ${L.round+1} of ${L.order.length}</span></div>
      <div class="fix"><img src="${headURL(T[L.team])}" alt=""><span class="n">${short(T[L.team].star.name)}<span>${T[L.team].nation}</span></span><span class="v">VS</span><span class="n" style="text-align:right">${short(T[opp].star.name)}<span>${T[opp].nation} · ${T[opp].nick}</span></span><img src="${headURL(T[opp])}" alt=""></div>
      <div class="row"><button class="btn" data-go="play">Kick off</button><button class="btn alt" data-go="shop">Upgrades</button></div>${tableHTML()}<button class="btn alt" data-go="menu">Menu</button></div>`}
  if(ov==='shop'&&L){const row=(k,ic,nm,desc)=>{const lv=L.up[k],cost=COST[lv];return`<div class="up"><span class="ic">${ic}</span><div><b>${nm}</b><div class="note">${desc}</div><div class="bars">${[0,1,2,3,4].map(i=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>
      <button class="btn${lv>=5||L.cash<cost?' alt':''}" data-buy="${k}" ${lv>=5||L.cash<cost?'disabled':''}>${lv>=5?'Max':'£'+cost}</button></div>`};
    h=`<div class="sheet"><h2>Upgrades</h2><span class="cash">£${L.cash}</span><div class="shop">${row('speed','👟','Rush speed','Faster across the pitch')}${row('jump','🦘','Jump height','Win more headers')}${row('kick','💥','Kick power','Harder shots and lobs')}</div>
      <button class="btn" data-go="league">Done</button></div>`}
  if(ov==='result'&&L&&L.last){const r=L.last,res=r.sc[0]>r.sc[1]?'Win!':r.sc[0]<r.sc[1]?'Defeat':'Draw';
    h=`<div class="sheet"><div class="res"><h2>${res}</h2><div class="sc"><span>${r.sc[0]}</span>–<em>${r.sc[1]}</em></div><p class="note">vs ${T[r.opp].nation} · you earned <b style="color:#7dfa9a">£${r.earn}</b></p></div>
      <h3>Other results</h3><p class="note">${r.others.map(([a,b,x,y])=>`${T[a].nation} ${x}–${y} ${T[b].nation}`).join(' · ')}</p>${tableHTML()}
      <div class="row"><button class="btn" data-go="league">Next match</button><button class="btn alt" data-go="shop">Upgrades</button></div></div>`}
  if(ov==='season'&&L){const pos=sorted().findIndex(([c])=>c===L.team)+1;
    h=`<div class="sheet"><div class="trophy">${pos===1?'🏆':pos<=3?'🥈':'⚽'}</div><h2 style="text-align:center">${pos===1?'Champions!':`Finished ${pos}${['th','st','nd','rd'][pos]||'th'}`}</h2>
      <p class="note" style="text-align:center">Season ${L.season} · £${L.cash} in the bank. Next season the other stars play sharper.</p>${tableHTML()}
      <button class="btn" data-go="nextseason">Start season ${L.season+1}</button><button class="btn alt" data-go="shop2">Upgrades first</button><button class="btn alt" data-go="menu">Menu</button></div>`}
  if(ov==='quick'||ov==='two'){const two=ov==='two';pick.home=pick.home||'ENG';pick.away=pick.away||'BRA';
    h=`<div class="sheet"><h2>${two?'2 players':'Quick match'}</h2><h3>${two?'Left player':'You'}</h3>${teamPick(pick.home,'home')}<h3>${two?'Right player':'Opponent'}</h3>${teamPick(pick.away,'away')}
      <button class="btn" data-go="${two?'start2':'start1'}">Kick off</button><button class="btn alt" data-go="menu">Back</button></div>`}
  if(ov==='qres'){const s=pick.qs;h=`<div class="sheet"><div class="res"><h2>${pick.two?(s[0]>s[1]?'Left player wins':s[1]>s[0]?'Right player wins':'Draw'):(s[0]>s[1]?'You win!':s[1]>s[0]?'Defeat':'Draw')}</h2><div class="sc"><span>${s[0]}</span>–<em>${s[1]}</em></div></div>
    <div class="row"><button class="btn" data-go="${pick.two?'start2':'start1'}">Rematch</button><button class="btn alt" data-go="menu">Menu</button></div></div>`}
  $('#ov').innerHTML=h?`<div class="ov">${h}</div>`:''}
function start(o){close();$('#pad2').hidden=o.mode!=='two';$('#keys').textContent=o.mode==='two'?'Left: A D move · W jump · S kick   |   Right: ← → move · ↑ jump · Space kick':'Keyboard: ← → move · ↑ jump · Space kick';
  newMatch(o);size();RG.sfx('whistle')}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pick]');if(p){pick[p.dataset.pick]=p.dataset.v;RG.sfx('tap');return render()}
  const o=e.target.closest('[data-opt]');if(o){opts[o.dataset.opt]=o.dataset.opt==='len'?+o.dataset.v:o.dataset.v;sv('opts',opts);RG.sfx('click');return render()}
  const b=e.target.closest('[data-buy]');if(b&&L){const k=b.dataset.buy,c=COST[L.up[k]];if(L.cash>=c&&L.up[k]<5){L.cash-=c;L.up[k]++;sv('league',L);RG.sfx('coin');render()}return}
  const g=e.target.closest('[data-go]');if(!g)return;const v=g.dataset.go;RG.sfx('click');
  if(v==='resume')return close();
  if(v==='newleague'){pick.home=L?.team||'BRA';return show('newleague')}
  if(v==='startleague'){newLeague(pick.home||'BRA');return show('league')}
  if(v==='nextseason'){newLeague(L.team);return show('league')}
  if(v==='shop2')return show('shop');
  if(v==='play')return playLeagueMatch();
  if(v==='start1'){pick.two=false;const lv=opts.level;return start({mode:'quick',home:T[pick.home],away:T[pick.away],c0:'human',c1:'cpu',s1:{easy:.3,normal:.6,hard:.9}[lv],len:opts.len,onEnd:s=>{pick.qs=s;show('qres')}})}
  if(v==='start2'){pick.two=true;return start({mode:'two',home:T[pick.home],away:T[pick.away],c0:'human',c1:'human',len:opts.len,onEnd:s=>{pick.qs=s;show('qres')}})}
  show(v)});
// attract mode behind the menu: two computer stars knocking it about
newMatch({mode:'demo',home:T.ENG,away:T.BRA,c0:'cpu',c1:'cpu',s0:.7,s1:.7,len:9999});size();requestAnimationFrame(loop);
show('menu');M.state='play';
</script>

(function(){
